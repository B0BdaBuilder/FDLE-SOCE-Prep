choices:{A:"Inmates must purchase all menstrual products from the canteen using their own commissary funds each and every month",B:"Correctional facilities must provide free health-care products for menstruation to inmates who need them, without requiring a medical referral or diagnosis",C:"Only inmates with a documented medical condition may receive these products free of charge at all",D:"These products are provided only once per month regardless of an individual inmate's actual need"},
correct:"B",
explanation:"Florida Statutes require correctional facilities to provide free health-care products for menstruation, and inmates do not need a medical referral or diagnosis to access them.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 10 (Unit 1), citing Fla. Stat.",sourceType:"statute"},

{id:"CO326-036",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Transgender/Intersex Terminology",difficulty:"applied",type:"scenario",
stem:"Which of the following correctly reflects the curriculum's guidance on referring to transgender or intersex people?",
choices:{A:"\"A transgender\" or \"an intersex\" is acceptable shorthand as long as it is not used in a hostile or mocking tone toward the individual",B:"\"Transgender person\" or \"intersex person\" should be used, since \"transgender\" and \"intersex\" are descriptive adjectives, not nouns, and using them as nouns can be derisive",C:"These terms should never be used at all, even as adjectives describing a person",D:"Only medical staff are permitted to use these terms; correctional officers must avoid them entirely, even in routine conversation"},
correct:"B",
explanation:"The curriculum specifically instructs that \"transgender\" and \"intersex\" are adjectives, not nouns - referring to someone as \"a transgender\" or \"an intersex\" rather than \"a transgender person\" or \"an intersex person\" can be seen as derisive and offensive.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 11 (Unit 1)",sourceType:"textbook"},

{id:"CO326-037",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Transgender Searches",difficulty:"higher",type:"scenario",
stem:"Per PREA-compliant practices, what is prohibited when searching a transgender or intersex inmate?",
choices:{A:"Any search of a transgender or intersex inmate is prohibited under any circumstance",B:"Officers cannot search or physically examine a transgender or intersex inmate for the sole purpose of determining the inmate's genital status",C:"Only male officers may conduct these searches, regardless of the inmate's gender identity or stated preference",D:"These searches must always be videotaped, regardless of agency policy on the matter"},
correct:"B",
explanation:"PREA standards specifically state that officers cannot search or physically examine a transgender or intersex inmate for the sole purpose of determining genital status - searches should instead be conducted by medical staff only, female staff only, or based on the inmate's stated preference, depending on agency policy.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 11 (Unit 1)",sourceType:"statute"},

{id:"CO326-038",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"PREA - Consent Between Inmates",difficulty:"higher",type:"scenario",
stem:"Two inmates engage in what appears to be consensual sexual activity. What is the correct understanding under PREA and facility policy?",
choices:{A:"Consensual sexual activity between inmates is always a PREA violation, regardless of consent, and must be reported and disciplined identically to non-consensual activity in every single recorded case",B:"While non-consensual sexual activity between inmates is always a PREA violation, apparently consensual activity between inmates does not violate PREA standards, though it still typically violates facility policy and is subject to discipline",C:"Sexual activity between inmates is entirely unregulated, since PREA applies only to staff-inmate contact in every case",D:"Only officer-inmate sexual contact is ever restricted; inmate-on-inmate activity is never subject to any discipline whatsoever under policy"},
correct:"B",
explanation:"PREA standards prohibit non-consensual sexual activity between inmates, but genuinely consensual sexual contact between inmates does not itself violate PREA standards - however, it still typically violates the facility's own policies restricting any sexual activity between inmates and is subject to disciplinary action.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 12 (Unit 1)",sourceType:"textbook"},

{id:"CO326-039",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"PREA Vulnerable Populations",difficulty:"foundational",type:"recall",
stem:"Which of the following groups is specifically identified as a vulnerable population at increased risk of sexual abuse while incarcerated?",
choices:{A:"Inmates with the longest sentences",B:"First-time or newly incarcerated inmates",C:"Inmates assigned to work squads",D:"Inmates over the age of 40 with no other risk factors"},
correct:"B",
explanation:"First-time or newly incarcerated inmates are specifically identified as a vulnerable population, along with juveniles, elderly inmates, LGBTQ+ inmates, transgender/intersex inmates, inmates with limited English proficiency, inmates with disabilities, and inmates small in stature.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 12 (Unit 1)",sourceType:"textbook"},

{id:"CO326-040",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"PREA Evidence Preservation",difficulty:"higher",type:"scenario",
stem:"An inmate reports a recent sexual assault. What timeframe does the curriculum generally reference for preserving physical evidence, and what should the alleged victim avoid?",
choices:{A:"There is no meaningful timeframe; evidence is never considered time-sensitive under this policy regardless of the victim's actions",B:"Generally around 120 hours, during which the victim should avoid washing, showering, changing clothes, or other actions that could destroy physical evidence",C:"Exactly 24 hours, with no further evidence collection possible after that point under any circumstance whatsoever",D:"One year, since DNA evidence never degrades regardless of how the victim cares for themselves afterward"},
correct:"B",
explanation:"The curriculum references a general window of around 120 hours during which physical evidence can still be collected, and advises requesting that the alleged victim avoid washing, showering, brushing teeth, changing clothes, or similar actions that could destroy that evidence.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 12 (Unit 1)",sourceType:"textbook"},

{id:"CO326-041",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Youthful Inmates (PREA)",difficulty:"higher",type:"recall",
stem:"Per PREA standards, what age defines a 'youthful inmate' who cannot be housed with adult inmates or placed where they could see or hear adult inmates?",
choices:{A:"Under 16",B:"Under 18",C:"Under 21",D:"Under 25"},
correct:"B",
explanation:"PREA standards specifically identify any inmate under the age of 18 as a youthful inmate, who cannot be placed in a housing unit with adult inmates and cannot be housed where they can see or hear adult inmates.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 12 (Unit 1)",sourceType:"statute"},

{id:"CO326-042",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Security Threat Group Definition",difficulty:"foundational",type:"recall",
stem:"What is the minimum number of people required for a group to be classified as a security threat group (STG)?",
choices:{A:"Two or more",B:"Three or more",C:"Five or more",D:"Ten or more"},
correct:"B",
explanation:"An STG is specifically defined as consisting of three or more people who have a common name or common identifying signs, colors, or symbols and engage repeatedly in criminal acts.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO326-043",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"STG Communication",difficulty:"applied",type:"scenario",
stem:"An officer notices inmates passing paper messages between cells using a string. What is this method called?",
choices:{A:"Ballooning",B:"Fishing",C:"Kickback",D:"Tagging"},
correct:"B",
explanation:"Fishing is the specific term for when an inmate passes paper messages using a string - a method STG members and other inmates use to communicate cryptically, sometimes combined with written code.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO326-044",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"STG Officer Conduct",difficulty:"higher",type:"scenario",
stem:"An officer learns some STG hand signs and considers using them to build rapport with STG-affiliated inmates. Is this appropriate?",
choices:{A:"Yes, as long as it improves communication and helps build trust with STG-affiliated inmates over time",B:"No - officers must not use STG symbols, gestures, graffiti, or alphabets as communication, as it could place them in a compromising or dangerous position",C:"Yes, but only with STG coordinator pre-approval noted in the classification file",D:"It is appropriate only for veteran officers with 10+ years of experience working STG-affiliated housing units specifically"},
correct:"B",
explanation:"The curriculum is explicit that officers must not use STG symbols, gestures, graffiti, or alphabets as communication, since doing so could place the officer in a compromising or dangerous situation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO326-045",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Administrative Confinement",difficulty:"applied",type:"scenario",
stem:"An inmate transferred from another facility is awaiting classification review before being assigned to the general population. What type of confinement does this describe?",
choices:{A:"Disciplinary confinement",B:"Administrative confinement",C:"Death row housing",D:"Protective management"},
correct:"B",
explanation:"Administrative confinement is the temporary removal of an inmate from the general population for safety and security until a more permanent management process is in place - one specific listed reason is being received from another facility while classification review is pending.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO326-046",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Protective Management",difficulty:"applied",type:"scenario",
stem:"An inmate requests to be placed in a special management status designed to protect them from other inmates, without any disciplinary basis. This describes:",
choices:{A:"Disciplinary confinement",B:"Protective management (protective custody)",C:"Death row",D:"A corrective consultation"},
correct:"B",
explanation:"Protective management, also called protective custody, is specifically a non-disciplinary status designed to protect an inmate from other inmates - inmates in protective management are not under punishment or in confinement in the disciplinary sense.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO326-047",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Disciplinary Confinement Access Rights",difficulty:"higher",type:"scenario",
stem:"An inmate in disciplinary confinement requests access to their prescribed medication and legal mail. Should these be provided?",
choices:{A:"No, all privileges are suspended during disciplinary confinement, including medication and legal mail access",B:"Yes - essential health items including prescribed medications, and legal mail or grievance forms, must remain accessible even in disciplinary confinement",C:"Only medication may be provided, never legal mail or grievance forms, regardless of the circumstances",D:"Only if approved by a judge, since disciplinary confinement removes all facility-level authority over these items entirely"},
correct:"B",
explanation:"Even in disciplinary confinement, inmates must retain access to essential health items including prescribed medications, along with legal resources and legal mail or grievance forms - these are not subject to restriction, unlike privileges such as canteen items or visitation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO326-048",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Confinement Monitoring Frequency",difficulty:"foundational",type:"recall",
stem:"What is the maximum interval the curriculum specifies for varied monitoring rounds of inmates in confinement?",
choices:{A:"Not to exceed 15- or 30-minute rounds",B:"Once per shift is sufficient",C:"Every 2 hours",D:"Only when the inmate requests a check"},
correct:"A",
explanation:"The curriculum specifies that monitoring intervals for inmates in confinement should be varied but should not exceed 15- or 30-minute rounds, ensuring frequent and unpredictable observation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO326-049",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Death Row Housing",difficulty:"foundational",type:"recall",
stem:"How can an inmate be placed on death row?",
choices:{A:"By a facility warden's administrative decision",B:"Only through sentencing by a court of law",C:"By a majority vote of correctional officers",D:"By classification staff based on disciplinary history alone"},
correct:"B",
explanation:"The curriculum specifically states that an inmate may only be placed on death row through sentencing by a court of law - it is not a housing or disciplinary decision made at the facility level.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO326-050",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Death Row Transfer",difficulty:"applied",type:"scenario",
stem:"A death row inmate's case is on appeal and they are transferred to a county facility. How are they treated at the county facility?",
choices:{A:"As a general population inmate with standard privileges and no extra escort requirement",B:"As an inmate in protective custody, segregated from the general population, with the same strict restraint and escort requirements",C:"As a juvenile inmate regardless of their actual documented age",D:"With no restraint requirements since they are no longer at the state facility"},
correct:"B",
explanation:"When a death row inmate is transferred to a county facility during an appeal, they are treated as inmates in protective custody and segregated from the general population, with the same strict restraint and escort requirements maintained.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 2 (Unit 2)",sourceType:"textbook"},


// ============ CJK 0336 - INCIDENTS AND EMERGENCIES IN CORRECTIONAL FACILITIES ============
{id:"CO336-001",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Critical Incident Definition",difficulty:"foundational",type:"recall",
stem:"How does the curriculum distinguish a 'critical incident' from a general incident?",
choices:{A:"Critical incidents only occur during natural disasters such as hurricanes, floods, or wildfires, and never arise from any security or medical emergency",B:"Critical incidents are events with a high chance of putting lives at risk and causing major damage to property or the environment, unlike general incidents which are unforeseen events that may or may not have consequences",C:"There is no meaningful distinction between the two terms; they are used interchangeably regardless of consequence, severity, or the danger posed to anyone nearby",D:"Critical incidents are defined solely by the number of inmates involved, regardless of the actual danger posed to life, property, or the environment"},
correct:"B",
explanation:"General incidents are unforeseen or unplanned events that may or may not have consequences, while critical incidents specifically carry a high chance of endangering lives and causing major property or environmental damage.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO336-002",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Chain of Command",difficulty:"applied",type:"scenario",
stem:"An officer is the first to respond to a critical incident. Per the curriculum, what is the officer's role regarding command of the scene?",
choices:{A:"The officer has no authority until a supervisor physically arrives on the scene of the incident",B:"The first responding officer typically takes charge of the scene until relieved by command staff, keeping command staff updated throughout",C:"Command automatically defaults to the most senior inmate present at the scene",D:"Only the facility warden may take charge of any critical incident scene"},
correct:"B",
explanation:"The curriculum specifically states that the first officer to respond typically takes charge of the scene until relieved by command staff, while keeping command staff updated on the incident's status - this allows for rapid response while preserving the chain of command.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO336-003",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"CERT",difficulty:"foundational",type:"recall",
stem:"What is a correctional emergency response team (CERT)?",
choices:{A:"A team responsible only for administrative paperwork completed after an incident",B:"A specially-trained extraction team used to handle violent and uncooperative inmates during incidents",C:"A team of medical doctors assigned to each individual shift",D:"An outside auditing agency for correctional facilities"},
correct:"B",
explanation:"A CERT is a specially-trained extraction team used to handle violent and uncooperative inmates during critical incidents - one of the specialty resources an officer may request when a situation requires additional, specialized assistance.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO336-004",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Evacuation Guidelines",difficulty:"applied",type:"scenario",
stem:"During a facility evacuation, which of the following is specifically prohibited by the curriculum's evacuation guidelines?",
choices:{A:"Using stairwells for evacuation",B:"Using elevators for evacuation",C:"Conducting an inmate count at the evacuation area",D:"Obtaining inmate rosters before evacuation"},
correct:"B",
explanation:"The curriculum specifically instructs that elevators should not be used for evacuation, likely due to the risk of power failure or entrapment during an emergency - stairwells and designated evacuation routes should be used instead.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO336-005",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Riot vs. Disturbance",difficulty:"applied",type:"scenario",
stem:"A single fight breaks out between two inmates in a dorm and is quickly resolved with minimal staff. This is best classified as:",
choices:{A:"A riot",B:"A minor disturbance",C:"A hostage incident",D:"A facility assault"},
correct:"B",
explanation:"A disturbance is any incident that disrupts normal facility operations, and minor disturbances - such as a single fight between two inmates - can usually be handled with minimal staff, unlike a riot, which involves uncontrolled violence typically directed at the administration.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO336-006",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Post-Riot Procedures",difficulty:"foundational",type:"recall",
stem:"Which of the following is a listed post-riot procedure?",
choices:{A:"Immediately releasing all involved inmates back to general population without further action",B:"Separating ringleaders and agitators",C:"Destroying all documentation related to the incident",D:"Canceling the next scheduled inmate count"},
correct:"B",
explanation:"Separating ringleaders and agitators is specifically listed as a post-riot procedure, along with accounting for staff and visitors, administering first aid, conducting strip searches of involved inmates, conducting an inmate count, and completing documentation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO336-007",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Escape Definition",difficulty:"foundational",type:"recall",
stem:"What distinguishes an inmate being in an unauthorized area from an actual escape?",
choices:{A:"They are legally identical offenses, carrying the same disciplinary and criminal consequences in every single case regardless of the underlying facts",B:"Being in an unauthorized area is a policy violation, but it does not necessarily mean an escape has occurred - an escape specifically means the inmate has broken free from custody",C:"An unauthorized area violation always results in an automatic escape charge under Florida law, no exceptions",D:"There is no meaningful legal distinction, since both terms describe the same underlying conduct under the statute in every instance"},
correct:"B",
explanation:"The curriculum specifically clarifies that an inmate in an unauthorized area has violated facility policy, but this does not necessarily mean they have attempted an escape - an escape specifically occurs when an inmate breaks free from custody.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO336-008",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Escape Evidence Collection",difficulty:"applied",type:"scenario",
stem:"After an inmate escapes, officers collect an article of the inmate's clothing for a canine scent search. What is the correct procedure?",
choices:{A:"Handle the item freely with bare hands to save time before storage",B:"Use gloves and store the item properly to avoid contaminating it, since it will be used as a scent item",C:"Wash the item first to make it more presentable to a supervisor",D:"Discard the item since it has no further use"},
correct:"B",
explanation:"The curriculum specifically instructs officers to use gloves and store clothing items properly without contaminating them, since canines will use these articles as scent items during a search for the escaped inmate.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO336-009",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Hostage Incident Definition",difficulty:"foundational",type:"recall",
stem:"Who can potentially be taken hostage during a hostage incident in a correctional facility?",
choices:{A:"Only correctional officers, excluding inmates, visitors, and civilian staff entirely",B:"Only civilian visitors, excluding staff, officers, and inmates entirely",C:"Any person, including inmates, civilians, officers, visitors, and staff",D:"Only medical staff"},
correct:"C",
explanation:"The curriculum specifically notes that any person can be held hostage, including inmates, civilians, officers, visitors, and staff - and that officers responding to an incident or riot could themselves become hostages.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO336-010",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Responding to Hostage Incidents",difficulty:"applied",type:"scenario",
stem:"An officer discovers a hostage situation in progress. What is the correct initial response?",
choices:{A:"Immediately enter the area to physically free the hostage without further planning",B:"Maintain a visual on the hostage without entering the area and becoming a hostage themselves, and contain the incident",C:"Ignore it and continue normal duties until a supervisor eventually becomes available",D:"Immediately use a firearm to end the situation"},
correct:"B",
explanation:"The curriculum instructs officers to maintain a visual on the hostage but not enter the area and risk becoming a hostage themselves - the priority is containing the incident and preventing additional hostages while gathering information.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO336-011",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"If Taken Hostage",difficulty:"higher",type:"scenario",
stem:"An officer is taken hostage during an incident. What guidance does the curriculum give regarding the officer's authority in this situation?",
choices:{A:"The officer retains full authority and should give orders to the hostage taker directly throughout the incident",B:"A staff member who is held hostage is not viewed as having rank or authority in the incident and should not interfere with response team discussions",C:"The officer should attempt to negotiate directly with the hostage taker on their own, without involving the response team",D:"The officer should try to physically overpower the hostage taker as soon as possible"},
correct:"B",
explanation:"The curriculum specifically states that a hostage staff member is not viewed as having rank or authority in the incident, and should not interfere with discussions between response teams and the hostage taker, instead cooperating without enabling the hostage taker and avoiding impulsive action.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO336-012",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Hostage Trigger Words",difficulty:"higher",type:"scenario",
stem:"If taken hostage, which of the following words does the curriculum specifically warn against using, as they may empower the hostage taker?",
choices:{A:"Words like 'help' or 'please'",B:"Words like 'prisoner,' 'guns,' or 'police'",C:"The hostage taker's own name",D:"Any words at all - officers should remain completely silent"},
correct:"B",
explanation:"The curriculum specifically lists words like 'prisoner,' 'guns,' and 'police' as trigger words that may empower the hostage taker, and advises avoiding insults or such language while remaining calm and cooperative.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO336-013",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Bomb Threat Equipment",difficulty:"higher",type:"scenario",
stem:"During an active bomb threat, why does the curriculum instruct officers to avoid using cell phones and radios?",
choices:{A:"They are simply against facility policy for reasons unrelated to safety",B:"Electronic devices could emit electromagnetic signals that may create a spark near a device",C:"They interfere with the facility's Wi-Fi network during a search",D:"They are needed exclusively by the bomb squad"},
correct:"B",
explanation:"Cell phones, radios, and other electronic devices that emit electromagnetic signals should be avoided during an active bomb threat because they carry a risk of creating a spark that could potentially detonate a device - non-electrical communication like landline phones is preferred.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO336-014",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Suspicious Package",difficulty:"foundational",type:"recall",
stem:"An officer discovers a suspicious package that may be a bomb. What is the correct action?",
choices:{A:"Carefully open it to verify its contents before calling anyone else over",B:"Do not touch, inspect, or tamper with it in any way; notify a supervisor and establish a secure perimeter",C:"Move it to a more secure location personally without waiting for a supervisor",D:"Shake it gently to determine its weight"},
correct:"B",
explanation:"The curriculum is explicit that a suspected bomb or suspicious package should never be touched, inspected, or tampered with in any way - the correct response is to notify a supervisor and establish a secure perimeter around the device.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO336-015",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Hazardous Materials Definition",difficulty:"foundational",type:"recall",
stem:"How does the curriculum define a hazardous material?",
choices:{A:"Only substances specifically labeled as chemical weapons by the manufacturer or a government agency",B:"Any solid, liquid, or gas substance that, when released, may be capable of causing harm to people, the environment, or property",C:"Only substances used in industrial manufacturing processes, excluding household or medical chemicals",D:"Only substances that produce a detectable smell"},
correct:"B",
explanation:"A hazardous material is broadly defined as any solid, liquid, or gas substance that, when released, may cause harm to people, the environment, or property - this includes common items like bleach, cleaning agents, and fuels, not just exotic chemicals.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 6 (Unit 2)",sourceType:"textbook"},

{id:"CO336-016",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Testing Unknown Containers",difficulty:"applied",type:"scenario",
stem:"An officer finds an unmarked shampoo bottle and is unsure if it contains shampoo or a hazardous substance like bleach. What is the safest way to check?",
choices:{A:"Smell the contents carefully, since the odor alone will reliably identify most hazardous household chemicals",B:"Taste a small amount to identify it, since taste is the most reliable way to distinguish similar-looking liquids",C:"Rotate the closed container to test its weight and consistency without opening it, and consult a safety data sheet if still unsure",D:"Pour a small amount into an open container to observe it, since visual inspection alone can confirm its contents"},
correct:"C",
explanation:"The curriculum specifically warns against ever smelling or tasting an unknown substance and instead recommends rotating a closed container to test weight and consistency, since a bottle filled with bleach will feel and sound different than one filled with shampoo, consulting an SDS if further clarification is needed.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 6 (Unit 2)",sourceType:"textbook"},

{id:"CO336-017",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Safety Data Sheet",difficulty:"foundational",type:"recall",
stem:"What is a Safety Data Sheet (SDS)?",
choices:{A:"An officer's personal safety checklist completed before beginning a shift in any hazardous area of the facility",B:"Written or printed material concerning a hazardous chemical, prepared per federal regulations, including the manufacturer's name, product name, and procedures for spills and leaks",C:"A form used only for reporting officer injuries sustained while handling hazardous chemicals during a shift, unrelated to any manufacturer documentation",D:"A log used exclusively for recording inmate medical records related to any chemical exposure incidents on file at the facility"},
correct:"B",
explanation:"An SDS is federally mandated documentation for hazardous chemicals that includes the manufacturer's name, product name, and procedures for handling spills and leaks - OSHA and federal regulations require these to be made available to anyone who may be exposed to the substance.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 6 (Unit 2)",sourceType:"statute"},

{id:"CO336-018",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Hazmat Classes",difficulty:"applied",type:"scenario",
stem:"An inmate discovers a container of nitric acid used for metal cleaning that has a label indicating it can cause spontaneous combustion or intensify a fire. Which hazard class does this belong to?",
choices:{A:"Class 3 - Flammable liquids",B:"Class 5 - Oxidizing substances and organic peroxides",C:"Class 8 - Corrosive substances",D:"Class 2 - Gases"},
correct:"B",
explanation:"Class 5 hazardous materials are oxidizing substances that supply their own oxygen and may cause spontaneous combustion or increase fire intensity - nitric acid used in metal cleaners is a specific example listed under this class.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 6 (Unit 2), citing DOT Emergency Response Guidebook",sourceType:"textbook"},

{id:"CO336-019",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Hazmat Classes",difficulty:"applied",type:"scenario",
stem:"A container of sulfuric acid causes irreversible skin damage upon contact. Which hazard class does this substance belong to?",
choices:{A:"Class 6 - Toxic substances",B:"Class 7 - Radioactive materials",C:"Class 8 - Corrosive substances",D:"Class 4 - Flammable solids"},
correct:"C",
explanation:"Class 8 hazardous materials are corrosive substances that can cause irreversible damage to human tissue on contact - sulfuric acid and hydrochloric acid are specific examples given for this class.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 6 (Unit 2), citing DOT Emergency Response Guidebook",sourceType:"textbook"},

{id:"CO336-020",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Hazmat Evacuation Distance",difficulty:"higher",type:"recall",
stem:"During a hazardous materials incident, what minimum distance does the curriculum recommend staying away from the affected area, if possible?",
choices:{A:"50 feet",B:"100 feet",C:"500 feet",D:"1 mile"},
correct:"C",
explanation:"The curriculum specifically recommends staying as far away as practical, a minimum of 500 feet if possible, and approaching from upwind while using binoculars or video surveillance rather than direct observation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 6 (Unit 2)",sourceType:"textbook"},

{id:"CO336-021",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Sensitive Supplies",difficulty:"applied",type:"scenario",
stem:"Which of the following food service items is specifically identified as a sensitive supply that inmates could misuse to produce an illegal substance?",
choices:{A:"Salt",B:"Yeast",C:"Rice",D:"Bread"},
correct:"B",
explanation:"Yeast is specifically identified as a sensitive supply that, combined with sugar and fruit, inmates can use to produce illegal alcohol - which is why these food service items require careful control and tracking.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 6 (Unit 2)",sourceType:"textbook"},

{id:"CO336-022",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Medical Emergency Equipment",difficulty:"foundational",type:"recall",
stem:"Which of the following is specifically listed as equipment that may be available during a medical emergency response?",
choices:{A:"An automated external defibrillator (AED) and Narcan (naloxone)",B:"A fire extinguisher only, excluding any other emergency medical equipment",C:"A radioactive materials detector kept in the medical unit",D:"A bomb-detecting canine"},
correct:"A",
explanation:"The curriculum specifically lists PPE, an AED, Narcan (naloxone), and a first-aid kit as equipment that may be available during a medical emergency response, distinct from equipment used for fires or other incident types.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 7 (Unit 2)",sourceType:"textbook"},

{id:"CO336-023",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Combustion Triangle",difficulty:"foundational",type:"recall",
stem:"According to the curriculum, which three components must come together in a chemical chain reaction to create fire?",
choices:{A:"Heat, fuel, and oxygen",B:"Water, wind, and heat",C:"Fuel, smoke, and pressure",D:"Oxygen, pressure, and light"},
correct:"A",
explanation:"Fire is created through combustion, a chemical chain reaction requiring heat, fuel, and oxygen to come together - removing any one of these components can help stop or extinguish a fire.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 8 (Unit 2)",sourceType:"textbook"},

{id:"CO336-024",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Fire Classes",difficulty:"applied",type:"scenario",
stem:"A fire breaks out in the facility kitchen involving vegetable oil in a fryer. Which class of fire is this, and what type of extinguisher should be used?",
choices:{A:"Class A fire, requiring a Type A extinguisher",B:"Class K fire, requiring a Type K extinguisher",C:"Class C fire, requiring a Type C extinguisher",D:"Class D fire, requiring a Type D extinguisher"},
correct:"B",
explanation:"Class K fires specifically involve combustible cooking media such as vegetable or animal oils and fats in cooking appliances, and require a Type K extinguisher designed for that specific fire class.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 8 (Unit 2)",sourceType:"textbook"},

{id:"CO336-025",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Fire Extinguisher Danger",difficulty:"higher",type:"scenario",
stem:"An inmate panics during a kitchen grease fire and throws water on it. Why is this dangerous?",
choices:{A:"Water has no effect on grease fires either way, so either extinguishing method is acceptable",B:"Using water on a flammable liquid fire, such as a grease fire, will increase the fire rather than extinguish it",C:"Water will only make the fire smell worse, without changing its size or behavior",D:"Water is always the correct response to any fire"},
correct:"B",
explanation:"The curriculum specifically warns that using water on a fire involving a flammable liquid, such as cooking oil or grease, will increase the fire rather than put it out - a Class K or ABC extinguisher should be used instead.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 8 (Unit 2)",sourceType:"textbook"},

{id:"CO336-026",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Fire Extinguisher Safety Check",difficulty:"applied",type:"scenario",
stem:"During a shift safety check, an officer notices the gauge needle on a fire extinguisher is not in the green zone. What should the officer do?",
choices:{A:"Use the extinguisher anyway since it is likely still functional",B:"Do not use that extinguisher, and notify the control room immediately",C:"Shake the extinguisher vigorously to recharge it",D:"Wait until the next shift to report the issue"},
correct:"B",
explanation:"If the gauge needle is not in the green zone, the charge is not adequate, and the extinguisher should not be used - the officer must notify the control room immediately so the extinguisher can be serviced or replaced.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 8 (Unit 2)",sourceType:"textbook"},

{id:"CO336-027",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Fire Extinguisher Use",difficulty:"foundational",type:"recall",
stem:"What is the correct order of steps for using a portable fire extinguisher, commonly remembered as PASS?",
choices:{A:"Point, Aim, Spray, Stand back, in that order for any extinguisher type",B:"Pull the pin, Aim the nozzle at the base of the fire, Squeeze the handle, Sweep side to side",C:"Push, Activate, Signal, Stop, following the manufacturer's printed label",D:"Position, Assess, Spray, Secure"},
correct:"B",
explanation:"The curriculum lists these four steps: pull the pin, aim the nozzle at the base of the fire from about 10 feet away, squeeze the handle, and sweep the base of the flame from side to side and front to back.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 8 (Unit 2)",sourceType:"textbook"},

{id:"CO336-028",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Natural vs. Human-Instigated Disasters",difficulty:"applied",type:"scenario",
stem:"A water main break floods part of a correctional facility. How is this classified?",
choices:{A:"A natural disaster, since water is a naturally occurring element in the environment",B:"A human-instigated disaster, since it results from a technological or human hazard rather than a force of nature",C:"Neither a natural nor human-instigated disaster under any classification",D:"Always classified as a hazardous materials incident instead"},
correct:"B",
explanation:"A human-instigated disaster is a consequence of technological or human hazards - the curriculum specifically lists a water main breaking as an example, distinct from a natural disaster like a hurricane or earthquake caused by forces of nature.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 9 (Unit 2)",sourceType:"textbook"},

{id:"CO336-029",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Crime Scene - Sexual Assault",difficulty:"higher",type:"scenario",
stem:"An inmate alleges they were sexually assaulted by another inmate. What special housing measure may be used to preserve evidence?",
choices:{A:"Immediate transfer to a different facility entirely, bypassing any on-site housing decision",B:"Temporary isolation in a dry cell without running water, to prevent the victim from cleaning themselves and destroying evidence",C:"Placement in the general population to avoid drawing any unwanted attention",D:"No special housing measure is used in these cases"},
correct:"B",
explanation:"The curriculum specifically notes that a sexual assault victim may be temporarily isolated in a dry cell without running water, preventing them from cleaning themselves in a way that could destroy potential evidence, while following all applicable PREA standards.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO336-030",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Entering a Crime Scene for Aid",difficulty:"higher",type:"scenario",
stem:"An officer must enter a crime scene to provide life-saving first aid to an injured person. What is the correct approach regarding evidence?",
choices:{A:"Rearrange items as needed to provide the best possible care in the moment",B:"Do not rearrange or move anything unnecessarily, and be very careful not to disturb evidence such as bloody prints or objects used in the crime",C:"Refuse to enter until evidence has been photographed first, even if it delays life-saving care to the patient",D:"Evidence preservation always takes priority over providing aid, even for a critical injury"},
correct:"B",
explanation:"The curriculum instructs that if an officer must enter a crime scene to render life-saving aid, they should not rearrange or move anything unnecessarily and must be careful not to disturb evidence such as bloody prints or objects used in the crime - providing aid is the priority, but evidence awareness still matters.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO336-031",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Chain of Custody",difficulty:"foundational",type:"recall",
stem:"What is 'chain of custody' as it relates to evidence?",
choices:{A:"The list of officers assigned to a particular shift or housing unit",B:"The documentation that reflects how evidence is handled and preserved to ensure the integrity of the evidence",C:"The order in which supervisors are contacted during an ongoing incident",D:"A term used only in disciplinary hearings, not criminal cases"},
correct:"B",
explanation:"Chain of custody is specifically defined as the documentation reflecting how evidence has been handled and preserved from the time of collection, ensuring its integrity is maintained for use in an investigation or court proceeding.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO336-032",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Separating Victims, Witnesses, Suspects",difficulty:"applied",type:"scenario",
stem:"Why does the curriculum emphasize separating victims, witnesses, and suspects as soon as possible after an incident?",
choices:{A:"To reduce the number of officers needed on scene by consolidating everyone into one location during the entire response effort",B:"To preserve evidence and information, provide clarity in assessing the incident, and minimize possible threats or collaboration that could confuse the investigation",C:"Because it is required only for property crimes, not violent crimes, under the written agency incident manual",D:"To speed up meal service during the incident by keeping everyone in one holding area until it is resolved"},
correct:"B",
explanation:"Separating victims, witnesses, and suspects preserves evidence and information, provides clarity for assessing the incident, and minimizes the possibility of collusion or threats that could compromise the later investigation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO336-033",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Officer Role with Suspects/Witnesses",difficulty:"higher",type:"scenario",
stem:"While overseeing a suspect after an incident, the suspect begins talking and volunteering information without being asked. What is the correct officer response?",
choices:{A:"Actively interview the suspect to gather as much information as possible before an investigator ever arrives on scene",B:"Document what is said without directly interviewing or encouraging the person to talk, since formal interviews are conducted by an assigned investigator or law enforcement",C:"Immediately stop the person from speaking at all, since only an assigned investigator may lawfully hear the statement",D:"Ignore anything said since spontaneous statements can never be used as evidence in any later criminal proceeding whatsoever at trial"},
correct:"B",
explanation:"The curriculum specifically states that officers must not conduct interviews, but if a person speaks on their own in the officer's presence, it is appropriate to document what is said accurately - without directly interviewing or encouraging them to talk further - since this information may later be used as evidence.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO336-034",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Victim Isolation",difficulty:"applied",type:"scenario",
stem:"After separating a victim from a suspect, where should the victim be placed while awaiting investigator interview?",
choices:{A:"Completely alone, out of sight and sound of any staff member, for privacy",B:"In a secure area, but not out of sight and sound, since they may need medical or psychological support",C:"Back in the general population immediately",D:"In the same holding area as the suspect, for the sake of efficiency"},
correct:"B",
explanation:"The curriculum specifically warns against placing victims out of sight and sound due to potential liability, since they may need medical or psychological support - they should be placed in a secure area while still being appropriately monitored.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO336-035",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Facility Assault Indicators",difficulty:"applied",type:"scenario",
stem:"Which of the following is specifically identified as a potential indicator of an outside facility assault?",
choices:{A:"A scheduled facility inspection by state auditors",B:"A vehicle speeding toward the perimeter and failing to yield",C:"A routine visitor arriving during normal visiting hours",D:"An inmate requesting a law library visit"},
correct:"B",
explanation:"A speeding vehicle approaching the perimeter and failing to yield is specifically listed as an example of a potential facility assault, along with gunshots, drones, aircraft, or attackers on foot.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO336-036",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Post-Incident Support",difficulty:"foundational",type:"recall",
stem:"After experiencing a traumatic critical incident such as a riot or fire, what does the curriculum say about an officer's emotional reaction?",
choices:{A:"Officers who experience emotional distress after a critical incident are not suited for correctional work and should consider resigning immediately from the agency",B:"The emotional impact of such incidents is normal and expected, and officers should reach out to a colleague, supervisor, or licensed mental health professional, using resources like an EAP if needed",C:"Officers should never discuss their emotional reactions with anyone, including a supervisor or licensed mental health professional",D:"Only officers directly involved in a fatality are entitled to any post-incident support resources under written agency policy"},
correct:"B",
explanation:"The curriculum specifically frames post-incident emotional distress as normal and expected, encouraging officers to seek support from a colleague, supervisor, or licensed mental health professional, and to use resources like an employee assistance program (EAP).",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO336-037",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Riot Indicators",difficulty:"applied",type:"scenario",
stem:"Over several weeks, officers notice inmates hoarding food, making makeshift weapons, and forming unusual groupings, along with an uptick in fights. What should this pattern suggest?",
choices:{A:"Normal seasonal behavior requiring no response",B:"Possible indicators that a riot or disturbance may be pending",C:"A sign that the facility needs more recreational equipment",D:"Evidence of a successful rehabilitation program"},
correct:"B",
explanation:"Food hoarding, makeshift weapons, unusual inmate groupings, and an increase in fights are all specifically listed as indicators that may precede a riot or disturbance, warranting heightened awareness and proactive intervention.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO336-038",subject:"CJK 0336",subjectName:"Incidents and Emergencies",subtopic:"Incident Command System",difficulty:"foundational",type:"recall",
stem:"What is the Incident Command System (ICS)?",
choices:{A:"A piece of software used only for inventory tracking during a facility lockdown or scheduled drill exercise",B:"A systematic approach to command, control, and coordination of incident response that typically follows an established agency protocol and chain of command",C:"A specific type of restraint device used to control a subject during transport only, unrelated to incident command or coordination",D:"A program exclusively for managing inmate visitation schedules during normal operations"},
correct:"B",
explanation:"The ICS is a systematic approach to command, control, and coordination of incident response, following an established agency protocol and chain of command - it may identify different levels of response and specific response teams depending on the nature of the incident.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 9, Lesson 1 (Unit 1)",sourceType:"textbook"},


// ============ CJK 0031 - FIRST AID DEEPENING BATCH (Burns, Diseases, Hazard Levels) ============
{id:"CO031-021",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Burn Depth Classification",difficulty:"foundational",type:"recall",
stem:"A patient has a sunburn: the skin is red and painful, but only the outermost layer of skin is affected. This is classified as which type of burn?",
choices:{A:"Superficial burn (first-degree)",B:"Partial-thickness burn (second-degree)",C:"Full-thickness burn (third-degree)",D:"Electrical burn"},
correct:"A",
explanation:"A superficial (first-degree) burn damages only the outermost layer of skin, causing redness and pain - a classic example is sunburn, typically from prolonged low-intensity heat exposure.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 7 (Unit 3)",sourceType:"textbook"},

{id:"CO031-022",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Burn Depth Classification",difficulty:"applied",type:"scenario",
stem:"A patient has a burn from hot grease that has caused blistering and red, splotchy, painful skin, damaging the first two layers of skin. This is classified as:",
choices:{A:"Superficial burn (first-degree)",B:"Partial-thickness burn (second-degree)",C:"Full-thickness burn (third-degree)",D:"None of these - blistering only occurs with electrical burns"},
correct:"B",
explanation:"A partial-thickness (second-degree) burn damages the first two skin layers, causing swelling, red/white/splotchy skin, and blisters - commonly caused by hot liquids, hot grease, explosions, or flame.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 7 (Unit 3)",sourceType:"textbook"},

{id:"CO031-023",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Burn Depth Classification",difficulty:"higher",type:"scenario",
stem:"A patient has a burn where the skin looks waxy, white, and charred, and the patient reports feeling no pain directly at the burn site. What does the absence of pain most likely indicate?",
choices:{A:"The burn is minor and superficial, since a lack of pain always indicates a less severe injury regardless of how the skin appears",B:"The burn is a full-thickness (third-degree) burn, where nerve damage at the site can eliminate pain at that location, though pain may still originate from surrounding partial-thickness areas",C:"The patient is not being truthful about the injury, since burns of this severity are always extremely painful to everyone who suffers one regardless",D:"The burn is not serious enough to require treatment, since the patient reports feeling no pain at all right at this moment in time"},
correct:"B",
explanation:"Full-thickness (third-degree) burns damage all skin layers along with underlying nerves, which can eliminate pain directly at the burn site - counterintuitively, the absence of pain at a burn site can indicate a more severe injury, not a minor one. Any pain reported usually originates from an adjacent partial-thickness area.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 7 (Unit 3)",sourceType:"textbook"},

{id:"CO031-024",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Burn Location",difficulty:"applied",type:"scenario",
stem:"A patient has a facial burn with singed facial hair, soot on the face, and burning around the mouth and nose. What complication should the officer suspect?",
choices:{A:"A minor cosmetic issue only, requiring no further medical assessment at all",B:"A possible inhalation burn or burn to the airway, which could obstruct breathing",C:"An allergic reaction to sunscreen applied earlier in the shift",D:"A sign the patient is faking the injury"},
correct:"B",
explanation:"Singed facial hair, soot on the face, and burning around the mouth and nose are specific signs that the patient may have suffered an inhalation burn or airway burn, which can cause dangerous swelling that obstructs the airway.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 7 (Unit 3)",sourceType:"textbook"},

{id:"CO031-025",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Burn Treatment - Full-Thickness",difficulty:"higher",type:"scenario",
stem:"A patient has a full-thickness burn with clothing stuck to the wound. What is the correct action regarding the clothing, and should the area be flushed with water?",
choices:{A:"Remove the stuck clothing carefully and flush thoroughly with water at the scene",B:"Leave clothing that is stuck in the burn in place, and do not flush a full-thickness thermal burn with water",C:"Remove the clothing but never apply any dressing to the burn afterward",D:"Cut away all clothing regardless of whether it is stuck to the wound"},
correct:"B",
explanation:"For full-thickness burns, if clothing is stuck in the wound, it should be left in place, and the area should not be flushed with water if it is a thermal burn - this differs from the treatment of superficial and partial-thickness burns, which are flushed with cool water.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 7 (Unit 3)",sourceType:"textbook"},

{id:"CO031-026",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Chemical Eye Burn Treatment",difficulty:"applied",type:"scenario",
stem:"A patient has a chemical burn to one eye. How should the officer position the patient's head while flushing, and for how long?",
choices:{A:"Position the affected eye above the unaffected eye, and flush for only 5 minutes",B:"Position the unaffected eye above the affected eye, and flush for twenty minutes to dilute the chemical",C:"Position the head level, and flush for one minute only before stopping",D:"Do not flush chemical eye burns under any circumstances"},
correct:"B",
explanation:"The unaffected eye should be positioned above the affected eye to prevent the chemical from cross-contaminating the healthy eye, and the affected eye should be flushed for twenty minutes to adequately dilute the chemical and limit further damage.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 7 (Unit 3)",sourceType:"textbook"},

{id:"CO031-027",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Burn Treatment - What to Avoid",difficulty:"foundational",type:"recall",
stem:"Which of the following should NEVER be applied to a burn wound?",
choices:{A:"A dry sterile dressing",B:"Cool or tepid water for superficial burns",C:"Creams or salves such as aloe vera, petroleum jelly, or butter",D:"A rigid eye shield for eye injuries"},
correct:"C",
explanation:"The curriculum specifically warns against applying creams or salves such as aloe vera, petroleum jelly, or butter to a burn wound, along with warnings not to bandage burned fingers or toes together or apply ice directly to a burn.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 7 (Unit 3)",sourceType:"textbook"},

{id:"CO031-028",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Electrical Burns",difficulty:"higher",type:"scenario",
stem:"An officer responds to a patient who was electrocuted and has visible burns. Beyond the visible burn, what internal complication should the officer be aware of?",
choices:{A:"Electrical injuries only ever cause superficial skin damage at the point of contact, nothing affecting deeper tissue at all",B:"Electricity travels the path of least resistance, often through nerves and blood vessels, and can cause underlying damage such as heart attack, organ damage, or spinal injury",C:"Electrical burns never require EMS transport if the patient simply states they feel fine",D:"Electrical burns should always be treated as chemical burns requiring immediate flushing with large amounts of running water instead"},
correct:"B",
explanation:"Electrical current travels the path of least resistance - typically nerves and blood vessels - which can cause serious internal damage such as heart attack, organ damage, or spinal injury even when the visible burn appears minor, which is why EMS should be called even if the patient reports feeling fine.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 7 (Unit 3)",sourceType:"textbook"},

{id:"CO031-029",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Diabetic Emergency",difficulty:"applied",type:"scenario",
stem:"An inmate is staggering, has slurred speech, and their breath smells sweet and fruity. An officer initially suspects intoxication. What should the officer keep in mind?",
choices:{A:"This is almost certainly alcohol intoxication and should be handled as a disciplinary matter rather than a medical one entirely",B:"These symptoms can also indicate a diabetic emergency, so the officer should not assume the person is under the influence of drugs or alcohol without further assessment",C:"Sweet-smelling breath always indicates poisoning, never any underlying medical condition at all",D:"These are exclusively signs of a seizure, unrelated to any metabolic condition"},
correct:"B",
explanation:"An intoxicated appearance with slurred speech and sweet, fruity, or acetone-smelling breath is a classic diabetic emergency presentation that can easily be mistaken for alcohol intoxication - the curriculum specifically warns officers not to assume the person is under the influence without further assessment.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 4)",sourceType:"textbook"},

{id:"CO031-030",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Types of Diabetes",difficulty:"foundational",type:"recall",
stem:"Which type of diabetes may temporarily develop during pregnancy?",
choices:{A:"Type I diabetes",B:"Type II diabetes",C:"Gestational diabetes",D:"Juvenile diabetes"},
correct:"C",
explanation:"Gestational diabetes is the type that may temporarily develop during pregnancy, distinct from Type I (little to no insulin production) and Type II (insulin not used properly), which are not pregnancy-specific.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 4)",sourceType:"textbook"},

{id:"CO031-031",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Seizure Response",difficulty:"applied",type:"scenario",
stem:"An inmate begins having a seizure and falls to the ground, shaking. What is the correct immediate action?",
choices:{A:"Force an object between their teeth to prevent them from biting their tongue during the episode",B:"Clear the area of sharp or hard objects, place something soft under their head, and do not restrain them or put anything in their mouth",C:"Restrain the patient firmly to stop the shaking from continuing",D:"Immediately attempt to hold the patient's tongue"},
correct:"B",
explanation:"The correct response is to clear the area of hazards, place a soft barrier under the patient's head, and specifically avoid restraining the patient or forcing anything into their mouth - both of these outdated practices can cause injury.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 4)",sourceType:"textbook"},

{id:"CO031-032",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Seizure Severity",difficulty:"higher",type:"recall",
stem:"When are seizures considered most dangerous or potentially life-threatening?",
choices:{A:"Any single, isolated seizure is always immediately life-threatening regardless of duration",B:"When they continue indefinitely, or when two or more consecutive seizures occur without a period of responsiveness in between",C:"Seizures are never life-threatening under any circumstance, regardless of frequency",D:"Only seizures that occur during work assignments are dangerous"},
correct:"B",
explanation:"Seizures are rarely life-threatening on their own, but become a serious medical emergency when they continue indefinitely or when two or more seizures occur consecutively without the patient regaining responsiveness in between.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 4)",sourceType:"textbook"},

{id:"CO031-033",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Stroke Recognition",difficulty:"foundational",type:"recall",
stem:"What does the 'F' in the BEFAST stroke mnemonic stand for?",
choices:{A:"Fatigue",B:"Face",C:"Fever",D:"Fear"},
correct:"B",
explanation:"In the BEFAST mnemonic (Balance, Eyes, Face, Arm, Speech, Time), 'F' stands for Face - specifically checking whether one side of the face droops when the patient is asked to smile, a classic stroke indicator.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 3 (Unit 4)",sourceType:"textbook"},

{id:"CO031-034",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Stroke - Time Component",difficulty:"applied",type:"scenario",
stem:"An officer recognizes possible stroke symptoms in an inmate. Beyond calling EMS, what critical piece of information should the officer try to determine and communicate?",
choices:{A:"The inmate's disciplinary history",B:"The time of onset of the symptoms",C:"The inmate's favorite meal",D:"The inmate's work assignment"},
correct:"B",
explanation:"The 'T' in BEFAST stands for Time - determining and communicating the time symptoms first began is critical, since stroke treatment options are highly time-sensitive and this information directly affects the care EMS and hospital staff can provide.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 3 (Unit 4)",sourceType:"textbook"},

{id:"CO031-035",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Heart Attack Symptoms - Women",difficulty:"higher",type:"scenario",
stem:"A female inmate reports chest pressure along with nausea, sweating, and extreme fatigue, but no dramatic chest-clutching pain. Should this be taken as seriously as a more 'typical' presentation?",
choices:{A:"No, without severe chest-clutching pain the curriculum treats a heart attack as unlikely in any patient, male or female, at any age or with any risk factor present",B:"Yes - women experiencing a heart attack often present with chest pressure plus additional symptoms like nausea, sweating, and extreme fatigue, which the curriculum specifically distinguishes from typical male symptoms",C:"No, these symptoms only indicate anxiety and should never be treated as a possible cardiac event in any patient regardless of history",D:"Yes, but only if the inmate is over 60 years old; younger patients presenting identical symptoms should never be treated as urgent or cardiac in nature"},
correct:"B",
explanation:"The curriculum specifically notes that women experiencing a heart attack often present differently than men - with chest pressure plus symptoms like nausea, vomiting, heartburn, sweating, and extreme fatigue - and these should be taken just as seriously.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 3 (Unit 4)",sourceType:"textbook"},

{id:"CO031-036",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Asthma Attack Response",difficulty:"foundational",type:"recall",
stem:"During a severe asthma attack, what position should the patient be encouraged to assume?",
choices:{A:"Lying flat on their back",B:"A position of comfort, and specifically advised not to lie down",C:"Lying on their stomach",D:"Standing perfectly still with arms raised"},
correct:"B",
explanation:"The curriculum specifically instructs positioning the patient for comfort and advising them not to lie down during a severe asthma attack, since lying flat can make breathing more difficult.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 3 (Unit 4)",sourceType:"textbook"},

{id:"CO031-037",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Heat Emergency Progression",difficulty:"applied",type:"scenario",
stem:"A patient working outside in the heat has hot, dry skin that has lost the ability to sweat, along with a weakening pulse and altered mental state. This describes which stage of hyperthermia?",
choices:{A:"Heat cramps",B:"Heat exhaustion",C:"Heat stroke",D:"Frostbite"},
correct:"C",
explanation:"Heat stroke, the most severe stage of hyperthermia, is characterized by hot, dry skin (the body has lost its ability to sweat), a rapid pulse that weakens as the condition worsens, and altered mental state, seizures, or unresponsiveness - a life-threatening emergency requiring prompt EMS transport.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 4)",sourceType:"textbook"},

{id:"CO031-038",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Heat Stroke Treatment",difficulty:"applied",type:"scenario",
stem:"A patient is diagnosed with heat stroke. What is the priority treatment?",
choices:{A:"Wrap the patient in warm blankets immediately, regardless of the presenting symptoms",B:"Cool the patient immediately by applying cold packs to the neck, armpits, and groin, and keeping skin wet",C:"Give the patient a large meal to restore their energy quickly",D:"Encourage vigorous exercise to sweat out the heat"},
correct:"B",
explanation:"Heat stroke is a life-threatening emergency requiring immediate cooling - applying cold packs to the neck, armpits, and groin, and keeping the skin wet with towels or water, while arranging prompt EMS transport.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 4)",sourceType:"textbook"},

{id:"CO031-039",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Frostbite vs. Hypothermia",difficulty:"applied",type:"scenario",
stem:"What is the key difference between frostbite and hypothermia?",
choices:{A:"They are two names for the exact same condition, differing only by which body region a clinician happens to examine first during assessment",B:"Hypothermia is an excessive cooling of the body's core temperature, while frostbite is a localized injury from overexposure to extreme cold, typically in exposed areas like ears, nose, fingertips, or toes",C:"Frostbite only affects the body's core temperature and never causes injury to any localized area at all, including fingers, toes, ears, or the nose in any patient",D:"Hypothermia only occurs in tropical climates and cannot develop during any cold-weather exposure at all, even prolonged exposure outdoors"},
correct:"B",
explanation:"Hypothermia is a systemic condition involving excessive cooling of the body's core temperature, while frostbite is a localized cold injury that typically occurs in exposed areas with lower blood supply, such as ears, nose, fingertips, and toes.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 4)",sourceType:"textbook"},

{id:"CO031-040",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Frostbite Treatment",difficulty:"higher",type:"scenario",
stem:"An officer wants to warm a patient's frostbitten hand in a remote area with delayed transport. What water temperature should be used, and what should be avoided?",
choices:{A:"Hot water, to warm the frostbitten area as quickly as possible",B:"Tepid (not hot) water, and the area should not be warmed if there is a possibility of refreezing",C:"Ice water, to numb the pain at the affected site",D:"No water should ever be used for frostbite"},
correct:"B",
explanation:"Frostbite should be warmed in tepid, not hot, water when transport is delayed - and the area should not be warmed at all if there is a risk of the tissue refreezing, since repeated freeze-thaw cycles cause additional tissue damage.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 4)",sourceType:"textbook"},

{id:"CO031-041",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Poisoning Routes",difficulty:"foundational",type:"recall",
stem:"Through which routes can a poison enter the body?",
choices:{A:"Only through ingestion",B:"Ingestion, inhalation, injection, or absorption",C:"Only through injection",D:"Only through inhalation and ingestion"},
correct:"B",
explanation:"Poisons - which can be solids, liquids, or gases - can enter the body through four routes: ingestion, inhalation, injection, or absorption through the skin, each producing somewhat different signs and symptoms.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 4)",sourceType:"textbook"},

{id:"CO031-042",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Anaphylactic Shock",difficulty:"applied",type:"scenario",
stem:"A patient is having a severe allergic reaction with swelling of the mouth and throat and difficulty breathing. They have their own epinephrine auto-injector. What is the officer's correct role?",
choices:{A:"The officer should inject the medication into the patient themselves",B:"The officer may assist by preparing the injection, but the patient must inject the medication themselves, per agency policy",C:"The officer should refuse to touch the auto-injector under any circumstances",D:"The officer should administer the medication only after calling a supervisor for verbal permission each time"},
correct:"B",
explanation:"The curriculum specifically states that an officer may assist by preparing an epinephrine auto-injector, but the patient must inject the medication themselves, since officers generally may not inject prescription medication on their own - always following agency policy on this point.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 4)",sourceType:"textbook"},

{id:"CO031-043",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Snakebite Signs",difficulty:"foundational",type:"recall",
stem:"Which of the following is a specific sign associated with a venomous snakebite, as opposed to other poisoning routes?",
choices:{A:"A semicircular bite site with one or two puncture wounds",B:"Diffuse full-body rash with no localized wound",C:"Symptoms limited exclusively to the respiratory system",D:"Complete absence of any local swelling"},
correct:"A",
explanation:"A semicircular bite site, often with one or two puncture wounds that may or may not bleed, is a specific sign of a snakebite, along with severe pain and burning at the wound site and swelling/discoloration that can begin within 30 minutes.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 4)",sourceType:"textbook"},

{id:"CO031-044",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Naloxone Administration",difficulty:"higher",type:"scenario",
stem:"An officer administers a dose of naloxone to a patient experiencing a suspected opioid overdose, but the patient is still not breathing normally after a few minutes. What is the correct next step?",
choices:{A:"Wait at least 30 minutes before considering another dose of the medication",B:"Administer another dose of naloxone every two to three minutes until the patient is breathing on their own",C:"Naloxone can only ever be administered once per patient under any circumstance",D:"Switch immediately to a different, unrelated medication"},
correct:"B",
explanation:"The curriculum specifically instructs administering a dose of naloxone every two to three minutes until the patient is breathing on their own, following the manufacturer's instructions and agency policy - naloxone is also specifically noted as the only medication an officer can legally administer.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 1 (Unit 4)",sourceType:"textbook"},

{id:"CO031-045",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Fentanyl Exposure Risk Levels",difficulty:"higher",type:"scenario",
stem:"An officer discovers a large amount of loose fentanyl powder that has the potential to become airborne, indicating widespread contamination. According to the curriculum's fentanyl exposure risk levels, what is the correct response?",
choices:{A:"Put on gloves and continue processing the scene as normal, treating the exposure as inherently low-risk",B:"This is a high-risk exposure - evacuate immediately, call a hazmat team, and have on-site decontamination and medical personnel on standby",C:"Double glove and continue working without any other precaution taken beyond the extra gloves",D:"No special precautions are needed as long as the powder is not touched directly"},
correct:"B",
explanation:"Loose powder with the potential to become airborne and widespread contamination matches the curriculum's high-risk fentanyl exposure level, which calls for immediate evacuation, calling a hazmat team (preferably with clandestine lab training), having on-site decontamination ready, and having medical personnel on standby.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 1 (Unit 4)",sourceType:"textbook"},

{id:"CO031-046",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Fentanyl Exposure Risk Levels",difficulty:"applied",type:"scenario",

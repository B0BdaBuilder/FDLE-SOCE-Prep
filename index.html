explanation:"The failure to properly seat the magazine is specifically identified as the leading cause of malfunctions in semiautomatic pistols - a problem that Phase I clearance (tap, rack, ready) is specifically designed to address.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 4 (Unit 3)",sourceType:"textbook"},

{id:"CO040-021",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Phase I Clearance",difficulty:"foundational",type:"recall",
stem:"What is the memorable phrase used to remember the steps of Phase I clearance for a semiautomatic pistol malfunction?",
choices:{A:"Stop, drop, and roll",B:"Tap, rack, ready (fire if necessary)",C:"Lock, load, and fire",D:"Point, aim, squeeze"},
correct:"B",
explanation:"\"Tap, rack, ready\" is the memorable phrase for Phase I clearance: tapping the magazine to ensure it is seated, racking the slide to extract/eject a bad round and chamber a new one, and getting ready to reassess and fire if necessary.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 4 (Unit 3)",sourceType:"textbook"},

{id:"CO040-022",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Phase II Clearance",difficulty:"higher",type:"scenario",
stem:"An officer's pistol experiences a double feed malfunction, where a round fails to extract and is met by a new round being fed from the magazine. Which clearance method is required?",
choices:{A:"Phase I clearance (tap, rack, ready) is always sufficient, regardless of the malfunction encountered",B:"Phase II clearance, which is more detailed and time-consuming, involving removing the magazine and manually clearing the chamber and barrel of obstructions",C:"No clearance method exists for a double feed; the firearm must be replaced entirely before it can ever be fired again",D:"Simply shaking the firearm vigorously until the obstructed rounds fall free on their own"},
correct:"B",
explanation:"A double feed specifically requires Phase II clearance, since Phase I clearance is not designed to resolve this malfunction - Phase II involves locking the slide back, forcibly stripping the magazine, working the slide to clear the chamber and barrel, then reloading.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 4 (Unit 3)",sourceType:"textbook"},

{id:"CO040-023",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Sight Alignment",difficulty:"foundational",type:"recall",
stem:"What is 'sight alignment'?",
choices:{A:"The relationship between the eye, front sight, rear sight, and the target, all aligned in a single plane before the shot ever breaks",B:"The relationship of the front sight and rear sight with the shooter's eye, occurring when the top of the front sight is level with the rear sight's top edge and centered in the notch",C:"A technique used only in low-light conditions when the sights cannot be clearly seen by the shooter at all during the encounter",D:"The distance between the shooter and the target, measured before taking any aim at a stationary object or moving threat"},
correct:"B",
explanation:"Sight alignment is specifically the relationship between the front and rear sights and the shooter's eye - level tops and a centered front sight - distinct from sight picture, which also includes the target's position relative to the aligned sights.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 5 (Unit 3)",sourceType:"textbook"},

{id:"CO040-024",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Point Shooting",difficulty:"applied",type:"scenario",
stem:"An officer is in an extremely close-quarters confrontation and has no time to align their sights. What technique should the officer use?",
choices:{A:"Point shooting - using the handgun as an extension of the arm and hand to point directly at the target when there is no time to align the sights properly",B:"Refuse to fire under any circumstances without a proper sight picture, even when the threat is at arm's length",C:"The Harries technique, regardless of lighting conditions, since it is the default technique for any close encounter of this kind",D:"Wait for backup before taking any action, even when the threat is close enough to close the distance immediately"},
correct:"A",
explanation:"Point shooting is specifically the technique used when the sights cannot be used or there is no time to align them properly - the handgun becomes an extension of the arm, used to point directly at the target, and is most effective at very close range.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 5 (Unit 3)",sourceType:"textbook"},

{id:"CO040-025",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Trigger Control",difficulty:"applied",type:"scenario",
stem:"What is the correct technique for trigger control when firing a handgun?",
choices:{A:"Squeezing the entire hand, including all fingers, simultaneously with equal pressure applied to each one at once",B:"Isolating the trigger finger to press the trigger straight back with increasing yet constant and steady pressure, without squeezing the rest of the hand",C:"Jerking the trigger quickly to minimize time on target and reduce the chance of the subject reacting",D:"Using the middle finger instead of the index finger for better leverage on a heavier trigger pull weight"},
correct:"B",
explanation:"Proper trigger control involves isolating the trigger finger - applying pressure with that finger alone, in a straight-back motion with steadily increasing pressure - without squeezing the rest of the hand, which would disturb the sight alignment.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 5 (Unit 3)",sourceType:"textbook"},

{id:"CO040-026",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Hip Shooting Position",difficulty:"higher",type:"scenario",
stem:"A threat closes to within 3-4 feet of an officer, too close for a normal extended shooting stance. Which shooting position is specifically designed to maintain control of the firearm and prevent the threat from grabbing it at this distance?",
choices:{A:"Two-hand high point position",B:"Hip shooting position",C:"Kneeling stance",D:"Compressed ready position only"},
correct:"B",
explanation:"The hip shooting position is specifically used within arm's reach (3-4 feet) of a threat, keeping the elbow/forearm against the body above the holster to maintain control of the firearm and prevent the threat from grabbing or knocking it aside.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 5 (Unit 3)",sourceType:"textbook"},

{id:"CO040-027",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Moving Off the X",difficulty:"applied",type:"scenario",
stem:"During a deadly force encounter, why does the curriculum recommend stepping laterally while drawing a handgun, sometimes called moving 'off the X'?",
choices:{A:"It is purely a stylistic preference taught for uniformity, with no tactical benefit to the officer during a real armed encounter of any kind",B:"Standing in place without cover during a deadly force encounter can get you killed; moving off the X makes you a harder target by stepping outside the threat's direct line of sight",C:"It is required only during formal qualification courses and has no real-world application in an actual encounter",D:"It allows the officer to reload more quickly by keeping both hands closer to the magazine well throughout the entire draw"},
correct:"B",
explanation:"Standing still without cover during a deadly force encounter, especially early in the engagement, significantly increases the risk of being hit - moving off the X (stepping outside the threat's visual cone) makes the officer a harder target to hit.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO040-028",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Flashlight Techniques",difficulty:"applied",type:"scenario",
stem:"An officer holds their handgun and flashlight with the backs of their hands pressed together, crossing the support hand under the primary hand, for maximum control over the handgun in low light. This describes which flashlight technique?",
choices:{A:"The Ayoob technique",B:"The Harries technique",C:"The neck index technique",D:"The FBI technique"},
correct:"B",
explanation:"The Harries technique involves crossing the support hand under the primary hand with the backs of the hands together, providing more control over the handgun - though it is not a natural position and requires practice to master.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 6 (Unit 3)",sourceType:"textbook"},

{id:"CO040-029",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Flashlight Techniques",difficulty:"applied",type:"scenario",
stem:"An officer navigating around a barricade holds their flashlight straight out to the side or above their head to illuminate a target while keeping their body less exposed. This describes which technique?",
choices:{A:"The Ayoob technique",B:"The Harries technique",C:"The FBI technique",D:"The watchman grip"},
correct:"C",
explanation:"The FBI technique involves holding the flashlight straight out to the side or above the head, which works particularly well when navigating around a barricade, since it separates the light source from the officer's body silhouette.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 6 (Unit 3)",sourceType:"textbook"},

{id:"CO040-030",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Flashlight Position Risk",difficulty:"higher",type:"scenario",
stem:"An officer uses a flashlight to search a dark area during a call. What tactical risk does the curriculum specifically warn about regarding flashlight use?",
choices:{A:"Flashlights have no tactical downsides",B:"Using a flashlight at any time will give away the officer's position",C:"Flashlights are only a concern if left on continuously for over 10 minutes",D:"Flashlights interfere with radio communication"},
correct:"B",
explanation:"The curriculum specifically warns that using a flashlight at any time will give away the officer's position - a genuine tactical tradeoff against the clear benefit of illumination for identifying threats and navigating safely.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 6 (Unit 3)",sourceType:"textbook"},

{id:"CO040-031",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Firearm Cleaning",difficulty:"foundational",type:"recall",
stem:"Before fieldstripping and cleaning a semiautomatic pistol, what is the first required safety step?",
choices:{A:"Apply lubricant to the barrel before checking whether the firearm is loaded",B:"Remove live ammunition from the cleaning area and safety check the firearm before removing the magazine and inspecting the chamber",C:"Disassemble the trigger mechanism before checking the chamber for a round",D:"Contact a certified armorer for permission before removing the magazine or inspecting the chamber"},
correct:"B",
explanation:"Before fieldstripping, the officer must remove all live ammunition from the cleaning area and perform a safety check - removing the magazine, locking the slide to the rear, and visually and physically inspecting the chamber, magazine well, and barrel.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 7 (Unit 3)",sourceType:"textbook"},

{id:"CO040-032",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Cleaning Tools",difficulty:"applied",type:"scenario",
stem:"An officer wants to use a larger caliber cleaning brush on a smaller caliber firearm to save time. Is this appropriate?",
choices:{A:"Yes, larger tools always clean more thoroughly regardless of the caliber involved",B:"No - cleaning tools are caliber specific, and a larger caliber brush or patch tip may not fit or may cause damage to a smaller firearm",C:"Yes, as long as it is done slowly and carefully by hand",D:"No, but only because it voids the manufacturer's warranty, not because of any functional concern"},
correct:"B",
explanation:"Cleaning tools are specifically caliber specific - the curriculum warns that a larger caliber cleaning brush or patch tip does not fit in a smaller firearm and may cause damage, while a tool too small may fail to fully clean a larger firearm.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 7 (Unit 3)",sourceType:"textbook"},


// ============ CJK 0355 - LEGAL DEEPENING BATCH (Sources of Law, Constitution, Offenses, Evidence) ============
{id:"CO355-021",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Sources of Law",difficulty:"foundational",type:"recall",
stem:"Which type of law is written and enacted by Congress, state legislatures, or local governing authorities, and includes criminal, civil, administrative, and regulatory laws?",
choices:{A:"Case law",B:"Statutory law",C:"Ordinances",D:"Common law"},
correct:"B",
explanation:"Statutory law is written and enacted by Congress, state legislatures, or local governing authorities in response to a perceived need, encompassing criminal, civil, administrative, and regulatory categories of law.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO355-022",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Ordinances",difficulty:"applied",type:"scenario",
stem:"A city council passes a law restricting the hours during which alcohol may be sold within city limits. What type of law is this, and where does it apply?",
choices:{A:"Statutory law, applying uniformly across the entire state of Florida",B:"An ordinance, applying only within the jurisdiction of the governmental entity that enacted it",C:"Case law, applying nationwide regardless of jurisdiction or venue",D:"Administrative law, applying only to state agencies"},
correct:"B",
explanation:"This is an ordinance - a written law enacted by a municipal or county government - and it applies only within the jurisdiction of the enacting governmental entity; ordinances cannot conflict with state, federal, or case law.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO355-023",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Administrative Law",difficulty:"applied",type:"scenario",
stem:"Which body of law establishes the operations and procedures of governmental agencies, and governs their internal operations to ensure they do not abuse their power?",
choices:{A:"Civil law",B:"Administrative law",C:"Criminal law",D:"Case law"},
correct:"B",
explanation:"Administrative law establishes the operations and procedures of governmental agencies and governs their internal operations - it is also concerned with the creation and adoption of rules and regulations, such as those found in the Florida Administrative Code.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO355-024",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Case Law and Precedent",difficulty:"applied",type:"scenario",
stem:"An appellate court in an officer's jurisdiction issues a new ruling on a search-and-seizure question. What is the officer's obligation regarding this ruling?",
choices:{A:"The officer may ignore it unless a supervisor specifically mentions it",B:"The officer is required to follow this precedent unless a higher court changes the rule",C:"The ruling only applies to the specific case decided and has no broader effect",D:"The officer may choose whether to follow it based on personal opinion"},
correct:"B",
explanation:"Once an appellate court in an officer's jurisdiction creates a precedent, officers are required to follow that rule unless a higher court changes it - staying current with case law is an ongoing professional responsibility.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO355-025",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Staying Current in the Law",difficulty:"applied",type:"scenario",
stem:"An officer wants to stay current on changes to Florida statutes and case law. Which of the following is an appropriate, reliable source?",
choices:{A:"A local newspaper article summarizing a court case from that jurisdiction",B:"Official websites such as FDLE, the Florida Office of the Attorney General, or the Florida Supreme Court",C:"Word of mouth from other officers at a different, unrelated agency",D:"An unofficial legal blog with no stated sourcing"},
correct:"B",
explanation:"The curriculum specifically recommends official sources like FDLE, the Florida Office of the Attorney General, and the Florida Supreme Court, while explicitly warning against relying on newspapers, television, radio, unreliable websites, or word of mouth for legal information.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO355-026",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Reading Florida Statutes",difficulty:"foundational",type:"recall",
stem:"In the Florida Statutes, how is a citation like '943.1395(1)' structured?",
choices:{A:"943 is the subsection, 1395 is the chapter, (1) is the section",B:"943 is the chapter, 1395 is the section, (1) is the subsection",C:"There is no meaningful internal structure to statute citations",D:"943.1395(1) refers only to a case law citation, not a statute"},
correct:"B",
explanation:"Florida Statutes are organized with the chapter as the broad topic (943), the section providing more specificity (1395), and the subsection (1) breaking that down further - understanding this structure helps officers navigate to the relevant portion of a statute.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO355-027",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Agency Policy vs. Law",difficulty:"applied",type:"scenario",
stem:"An agency's use-of-force policy is more restrictive than what state law would otherwise allow. Is this permissible?",
choices:{A:"No, agency policy can never be more restrictive than state law under any circumstance whatsoever in Florida",B:"Yes - agency policies and procedures may be more restrictive than state and federal laws to meet the specific needs of the agency",C:"Only if approved by the Florida Supreme Court on a case-by-case basis",D:"Only for state facilities, never county facilities"},
correct:"B",
explanation:"The curriculum specifically notes that agency policies and procedures may be more restrictive than state and federal laws, since they are designed to meet the agency's specific operational needs, and officers are expected to follow their agency's stricter standard.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO355-028",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"First Amendment in Corrections",difficulty:"applied",type:"scenario",
stem:"A group of inmates wants to organize a protest gathering in the dayroom. Do they have a First Amendment right to do so, and does their right to religious expression differ?",
choices:{A:"Inmates have an unrestricted right to assemble and protest, identical to civilians outside the facility gates in every possible way",B:"Inmates cannot assemble and protest in a correctional facility, but they retain the right to free speech to express religious beliefs and communicate with the press",C:"Inmates have no First Amendment rights of any kind while incarcerated, including for religious expression",D:"Inmates may protest only if a majority of the housing unit agrees to participate in the gathering beforehand"},
correct:"B",
explanation:"The curriculum specifically distinguishes these: inmates cannot assemble and protest within a correctional facility, but they do retain First Amendment rights to free speech for expressing religious beliefs and communicating with the press.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 2 (Unit 1)",sourceType:"court_case"},

{id:"CO355-029",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Substantive vs. Procedural Due Process",difficulty:"higher",type:"scenario",
stem:"Which type of due process specifically refers to the procedures that must be followed at every step to protect a person's rights during the criminal justice process?",
choices:{A:"Substantive due process",B:"Procedural due process",C:"Equal protection",D:"Qualified immunity"},
correct:"B",
explanation:"Procedural due process refers specifically to the procedures that must be followed to protect a person's rights during the criminal justice process, ensuring everyone is entitled to every required step - distinct from substantive due process, which concerns the fair and consistent enforcement of the law itself.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO355-030",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Fifth Amendment",difficulty:"applied",type:"scenario",
stem:"Beyond protecting against self-incrimination, which of the following is also protected under the Fifth Amendment?",
choices:{A:"The right to a speedy trial, along with protection against self-incrimination during questioning",B:"Protection against double jeopardy, and the requirement of due process before deprivation of life, liberty, or property",C:"Protection against cruel and unusual punishment, in addition to the right against self-incrimination",D:"The right to confront witnesses, along with the privilege against self-incrimination during trial"},
correct:"B",
explanation:"The Fifth Amendment protects against double jeopardy (being prosecuted twice for the same crime) and requires due process before a person can be deprived of life, liberty, or property, in addition to its well-known protection against self-incrimination.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO355-031",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Eighth Amendment - Conditions of Confinement",difficulty:"higher",type:"scenario",
stem:"A facility repeatedly withholds meals from inmates as an informal punishment, separate from any formal disciplinary process. Which constitutional protection is most directly implicated?",
choices:{A:"First Amendment",B:"Fourth Amendment",C:"Eighth Amendment",D:"Sixth Amendment"},
correct:"C",
explanation:"The Eighth Amendment's prohibition on cruel and unusual punishment has been interpreted by the Supreme Court to require humane conditions of confinement, including basic necessities like food - the curriculum specifically lists withholding meals as an example of a prohibited action.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 2 (Unit 1)",sourceType:"court_case"},

{id:"CO355-032",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Fourteenth Amendment",difficulty:"foundational",type:"recall",
stem:"What is the primary function of the Fourteenth Amendment as it relates to corrections?",
choices:{A:"It establishes the right to bear arms for private citizens against state infringement",B:"It expands the application of the Bill of Rights to state and local governments through its due process clause",C:"It protects against excessive bail and cruel or unusual punishment at the state level",D:"It establishes the right to a jury trial"},
correct:"B",
explanation:"The Fourteenth Amendment's due process clause expands the application of the Bill of Rights to state and local governments, meaning state actors like correctional officers must also honor federal constitutional protections, not just the federal government.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO355-033",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Felony vs. Misdemeanor",difficulty:"foundational",type:"recall",
stem:"Under Florida law, what distinguishes a felony from a misdemeanor?",
choices:{A:"A felony is punishable by a maximum penalty of death or incarceration in a state facility for more than one year; a misdemeanor is punishable by up to one year in a county facility",B:"A felony is any crime committed by a repeat offender, regardless of the sentence the court actually imposes in the case",C:"There is no legal distinction between the two terms; both are punished identically under state law regardless of severity",D:"A misdemeanor always carries a longer sentence than a felony, since felonies are reserved exclusively for the most violent crimes committed"},
correct:"A",
explanation:"A felony is a criminal offense with a maximum penalty of death or incarceration in a state correctional facility exceeding one year, while a misdemeanor is punishable by up to one year in a county correctional facility.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 3 (Unit 1)",sourceType:"statute"},

{id:"CO355-034",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Consecutive Sentences",difficulty:"higher",type:"scenario",
stem:"An inmate is convicted of two separate misdemeanors and receives two consecutive one-year sentences, resulting in two years total in a county facility. How is this possible, given that misdemeanors normally carry a maximum of one year?",
choices:{A:"This is not possible under Florida law; a county facility sentence can never exceed one year total under any legal theory whatsoever, ever",B:"Consecutive sentences allow an inmate to spend an extended term of more than one year in a county facility when receiving two or more sentences in a row for multiple charges",C:"This means the crime was automatically reclassified as a felony once the two consecutive sentences were combined together",D:"The inmate must serve the sentences at a state facility instead, since county facilities cap at one year regardless"},
correct:"B",
explanation:"The curriculum specifically explains that consecutive sentences - two or more sentences served in a row for multiple charges - can result in an inmate spending more than one year in a county facility, even though each individual misdemeanor sentence caps at one year.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO355-035",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Battery on a Facility Employee",difficulty:"higher",type:"scenario",
stem:"An inmate intentionally throws bodily fluids at a correctional officer to harass and alarm them. How does this act typically affect the classification of the offense?",
choices:{A:"It has no effect on classification since no physical injury occurred at the scene",B:"Battery against a facility employee reclassifies the offense to a more severe degree, carrying a greater penalty than a similar act against a non-employee",C:"It can only be charged as a civil offense, not a criminal one, since bodily fluids cannot constitute battery legally",D:"It is automatically treated as a misdemeanor regardless of severity or intent"},
correct:"B",
explanation:"The curriculum specifically notes that battery against a facility employee performing their duties - including throwing bodily fluids like blood, saliva, or urine to harass or alarm - reclassifies the offense to a more severe degree with a greater penalty.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 3 (Unit 1)",sourceType:"statute"},

{id:"CO355-036",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Elements of a Crime",difficulty:"foundational",type:"recall",
stem:"What are the two basic elements necessary to convict a person of a crime?",
choices:{A:"Motive and opportunity alone, without any further evidentiary requirement",B:"Proof that a crime has been committed, and proof that the person being charged committed the crime",C:"A confession and a witness, without any other supporting evidence needed",D:"Intent and a prior criminal record"},
correct:"B",
explanation:"To convict a person of a crime, the prosecution must establish two basic elements: proof that a crime has actually been committed, and proof that the specific person being charged is the one who committed it.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO355-037",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Instrumentalities vs. Fruits of a Crime",difficulty:"higher",type:"scenario",
stem:"An inmate uses a homemade shank to threaten another inmate into handing over commissary items. Which of the following correctly identifies the shank versus the commissary items?",
choices:{A:"Both are considered fruits of the crime, since both items were used to complete the offense",B:"The shank is an instrumentality of the crime (used to commit it), while the commissary items are the fruits of the crime (the benefit gained)",C:"Both are considered instrumentalities of the crime, since both played some role in it",D:"Neither would be treated as evidence, since the underlying threat was never physically carried out by the inmate"},
correct:"B",
explanation:"Instrumentalities of a crime are items used to commit it - like the shank - while fruits of a crime are benefits gained from committing it, such as the commissary items obtained through the threat; both can become evidence.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO355-038",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Types of Evidence",difficulty:"applied",type:"scenario",
stem:"An officer collects a written property receipt and a call log as part of an investigation. What type of evidence is this?",
choices:{A:"Physical evidence",B:"Testimonial evidence",C:"Documentary evidence - printed or written evidence",D:"Circumstantial evidence exclusively"},
correct:"C",
explanation:"Documentary evidence refers to printed or written evidence, such as a call log, written property receipt, letter, or recording - distinct from physical evidence (material objects) and testimonial evidence (verbal accounts from witnesses).",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO355-039",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Direct vs. Circumstantial Evidence",difficulty:"higher",type:"scenario",
stem:"An officer searches an inmate before a privileged attorney visit and finds nothing. After the visit, the same officer discovers a cell phone in the inmate's possession, though the officer did not witness the phone being handed over. What type of evidence would this observation provide regarding the source of the phone?",
choices:{A:"Direct evidence, since the officer directly observed the attorney hand the inmate the phone during the privileged legal visit",B:"Circumstantial evidence - based on reasoning rather than direct observation, since the officer did not personally witness the attorney give the inmate the phone",C:"Testimonial evidence exclusively, since it can only be established through the officer's sworn statement",D:"This cannot be used as evidence of any kind, since the exchange itself was never directly witnessed by staff"},
correct:"B",
explanation:"Since the attorney-client visit is privileged and the officer did not directly observe the exchange, any conclusion that the attorney provided the phone would be circumstantial (indirect) evidence, based on reasoning from the facts rather than direct personal observation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO355-040",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Chain of Custody Components",difficulty:"applied",type:"scenario",
stem:"When documenting the chain of custody for a piece of evidence, which of the following elements must specifically be recorded?",
choices:{A:"Only who collected the evidence, since later handling is tracked through a wholly separate log",B:"Who handled the evidence, what materials were used and secured, where it was collected/stored, when it was handled, why, and how it was preserved",C:"Only the location where evidence is currently stored, not its collection or handling history",D:"Only the final disposition of the evidence, such as whether it was destroyed or returned to its owner"},
correct:"B",
explanation:"Chain of custody documentation must specifically cover who, what, where, when, why, and how - covering everyone who handled the evidence, what was involved, its location history, timing, the reason it was handled, and the method of preservation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO355-041",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Evidence Documentation",difficulty:"applied",type:"scenario",
stem:"An officer collects an item during an investigation that does not immediately appear relevant to the incident. Should the officer document it?",
choices:{A:"No, only clearly relevant items need to be documented in the final report",B:"Yes - items must be documented even if they do not immediately appear to be relevant to the incident",C:"Only if a supervisor specifically requests it be documented afterward",D:"Only if the item is physical evidence, not documentary or testimonial"},
correct:"B",
explanation:"The curriculum specifically states that items must be documented even if what is collected does not immediately appear to be relevant to the incident, since relevance may become clear later and the chain of custody must remain intact from the moment of collection.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 3 (Unit 1)",sourceType:"textbook"},


// ============ CJK 0051 - DEFENSIVE TACTICS DEEPENING BATCH 2 (Threat Awareness, Fundamentals, Restraints, Search Law) ============
{id:"CO051-036",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Threat Awareness Spectrum",difficulty:"foundational",type:"recall",
stem:"According to the Threat Awareness Spectrum (Jeff Cooper's color code), what is an officer's desired state of awareness or readiness while on routine duty?",
choices:{A:"Condition White",B:"Condition Yellow",C:"Condition Orange",D:"Condition Red"},
correct:"B",
explanation:"Condition Yellow - a state of general awareness where attention is focused and the officer scans the environment for potential threats - is the desired baseline state while on routine duty, allowing quick escalation to Orange or Red if needed.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 2 (Unit 2), citing Jeff Cooper, Principles of Personal Defense",sourceType:"textbook"},

{id:"CO051-037",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Threat Awareness Spectrum",difficulty:"higher",type:"scenario",
stem:"An officer facing a genuine threat becomes so overwhelmed that survival stress functions break down, causing the officer to freeze and either overreact, underreact, or not react at all. This describes:",
choices:{A:"Condition Yellow",B:"Condition Orange",C:"Condition Red",D:"Condition Black"},
correct:"D",
explanation:"Condition Black describes a threat mismanaged due to a panicked stress response - survival stress functions break down, and the person may freeze, submit, overreact, or underreact, unlike Condition Red, where survival stress functions are optimum and the threat is actively managed.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 2 (Unit 2), citing Jeff Cooper, Principles of Personal Defense",sourceType:"textbook"},

{id:"CO051-038",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Decision-Making Under Stress",difficulty:"applied",type:"scenario",
stem:"Under high stress, an officer relies on quick mental shortcuts to make a use-of-force decision rather than deliberate, slow analysis. What does the curriculum say determines the reliability of these shortcuts?",
choices:{A:"The officer's natural personality traits alone, independent of any training received or realistic scenario practice over an entire career",B:"The officer's training and experience - these shortcuts are based on prior training, and less time to decide increases the likelihood of a judgment error, which can be offset by increased training",C:"Shortcuts are always equally reliable regardless of preparation, since stress affects every officer's decision-making in the same exact way",D:"Only a supervisor's real-time guidance during the encounter can make these split-second calls reliable, regardless of the officer's own training or experience"},
correct:"B",
explanation:"These short-cut decisions are based on training and experience; the curriculum specifically notes that less time to decide increases the likelihood of a mistake in judgment, and this can be offset by increasing realistic training.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO051-039",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Exhilaration Speech",difficulty:"higher",type:"scenario",
stem:"After successfully controlling a violent incident, an officer begins boasting and speaking emotionally without thinking, later regretting the statements made. What is this phenomenon called, and why does it matter during an investigation?",
choices:{A:"Command presence, a calm and authoritative bearing projected during the incident that has no bearing on how any investigation proceeds afterward",B:"\"Exhilaration speech\" - statements from a euphoric feeling after prevailing in a critical incident, which can make an officer's account seem unreliable during an internal investigation",C:"Tactical debriefing, a required procedure conducted immediately afterward with a supervisor present to review the response",D:"Verbal de-escalation, a technique that should be actively encouraged in this context to calm the officer's nerves"},
correct:"B",
explanation:"Exhilaration speech refers to statements brought on by a euphoric feeling of accomplishment after a critical incident - officers may say things they don't remember or later regret, which can make their account seem unreliable during a subsequent investigation.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO051-040",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Fundamental Principles - Compliance Types",difficulty:"applied",type:"scenario",
stem:"An officer locks a subject's wrist joint so that no movement is possible, causing the subject to comply with verbal direction, without necessarily causing pain. This is best described as:",
choices:{A:"Pain compliance",B:"Mechanical compliance",C:"Motor dysfunction",D:"A penetrating strike"},
correct:"B",
explanation:"Mechanical compliance specifically involves locking a joint so no movement is possible, causing the subject to comply with verbal direction - distinct from pain compliance, which relies on the subject's response to pain combined with verbal commands.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO051-041",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Fundamental Principles - Motor Dysfunction",difficulty:"applied",type:"scenario",
stem:"An officer uses an incapacitation technique that causes temporary impairment of a subject's muscular control, without relying on pain or joint locks. This describes:",
choices:{A:"Joint manipulation",B:"Leverage",C:"Motor dysfunction",D:"Balance displacement"},
correct:"C",
explanation:"Motor dysfunction is gaining control over a subject by using an incapacitation technique that causes temporary impairment of muscular control - distinct from joint manipulation (bending/twisting a joint to cause pain) or balance displacement (breaking balance through leverage).",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO051-042",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Penetrating Strike",difficulty:"higher",type:"recall",
stem:"What is a 'penetrating strike'?",
choices:{A:"A strike that only makes brief, glancing contact with the target, transferring minimal kinetic energy overall",B:"A strike where the striking object penetrates the muscle and nerves of the target area, representing a full transfer of kinetic energy for maximum effectiveness",C:"A strike used only against inanimate objects during training, never against any live subject under any circumstance whatsoever",D:"A verbal command used to warn a subject before any physical contact is made during the encounter itself"},
correct:"B",
explanation:"A penetrating strike involves the striking object penetrating the muscle and nerves of the target area, transferring the full kinetic energy of the strike - for maximum effectiveness, the striking object should stay on or indented in the target for an instant.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO051-043",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Verbal Direction vs. Dialogue",difficulty:"applied",type:"scenario",
stem:"An officer engages a resistant subject in a controlled, unemotional conversation specifically aimed at problem-solving and building rapport, rather than issuing a direct order. This is best described as:",
choices:{A:"Verbal direction",B:"Dialogue",C:"Touch",D:"Command presence"},
correct:"B",
explanation:"Dialogue is defined as controlled, unemotional communication aimed at problem-solving, intentionally used as a strategy to gain rapport and exchange information - distinct from verbal direction, which is the use of clear, concise commands to tell someone what to do.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO051-044",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Non-Verbal Threat Cues",difficulty:"applied",type:"scenario",
stem:"Which of the following is specifically listed as a non-verbal cue that may indicate a subject's aggression or posturing?",
choices:{A:"Relaxed, open posture with visible palms",B:"Clenched fists, quivering hands, and refusal to show the palms of the hands",C:"Slow, deliberate speech",D:"Maintaining a comfortable distance from the officer"},
correct:"B",
explanation:"Clenched fists, quivering hands, and refusal to show palms are specifically listed as non-verbal cues of possible aggression, along with increased breathing, a target glance, reddened/flushed face, and rapid, angry movements.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 3 (Unit 3)",sourceType:"textbook"},

{id:"CO051-045",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Unusual Symptoms",difficulty:"higher",type:"scenario",
stem:"During a confrontation, a subject begins exhibiting unusual symptoms that could indicate physical illness, drug overdose, or PTSD. What is the officer's correct response?",
choices:{A:"Continue the confrontation as planned, ignoring the symptoms since the encounter must be resolved first regardless of medical risk",B:"Immediately request medical assistance, while maintaining an open airway and proper circulation if the subject is restrained",C:"Assume the subject is faking and proceed with maximum force, since medical symptoms are commonly used as a delay tactic",D:"Wait until the end of shift to document the symptoms, since immediate reporting is not required by policy"},
correct:"B",
explanation:"The curriculum specifically instructs officers to immediately request medical assistance when a subject exhibits unusual symptoms that could indicate illness, overdose, or PTSD, while being careful to maintain an open airway and proper circulation if the subject is restrained.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 3 (Unit 3)",sourceType:"textbook"},

{id:"CO051-046",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Interview Stance vs. Offensive Ready Stance",difficulty:"applied",type:"scenario",
stem:"What is the key difference between the interview stance and the offensive ready stance?",
choices:{A:"They are identical stances used interchangeably, differing only in the name individual instructors happen to prefer using during training sessions at the academy",B:"The interview stance places hands above waist level for a lower-threat interaction, while the offensive ready stance places hands near eye level with a wider stance, chin tucked, for a higher perceived threat",C:"The interview stance is only used indoors, while the offensive ready stance is reserved strictly for outdoor calls involving a visible weapon",D:"The offensive ready stance is only used once a firearm has already been drawn and pointed at someone during the encounter itself"},
correct:"B",
explanation:"The interview stance uses a more neutral posture with hands above waist level for routine or lower-threat interactions, while the offensive ready stance - used for a higher perceived threat - involves a wider foot placement, tucked chin, and hands positioned just below eye level.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 3 (Unit 3)",sourceType:"textbook"},

{id:"CO051-047",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Danger Zone",difficulty:"foundational",type:"recall",
stem:"What is the 'danger zone' in defensive tactics?",
choices:{A:"Any area within a correctional facility that lacks camera coverage",B:"The area within the reactionary gap, where the potential for physical harm increases",C:"A designated training area only",D:"The area immediately surrounding a control room"},
correct:"B",
explanation:"The danger zone is specifically the area within the reactionary gap - anytime an officer is within this distance of a subject, the potential for physical harm increases, and officers should close this gap quickly while maintaining good balance if necessary.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 3 (Unit 3)",sourceType:"textbook"},

{id:"CO051-048",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Reaction Time Principle",difficulty:"applied",type:"scenario",
stem:"What is the 'reaction time principle'?",
choices:{A:"The maximum time allowed to file a use-of-force report after an incident occurs, per written agency policy and standard procedure manual",B:"The amount of time it takes for the brain to process a physical threat and the body to respond, involving perceiving the threat, forming a strategy, and initiating motor action",C:"The time an inmate has to comply with a verbal command before physical force may be authorized against them by policy",D:"The cooldown period required after a defensive tactics training session before an officer may return to regular assigned duty"},
correct:"B",
explanation:"The reaction time principle describes the process of perceiving and analyzing a threat, forming a strategy, and initiating motor action - in short, seeing the threat, figuring out what to do, and then acting, which inherently takes measurable time.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 3 (Unit 3)",sourceType:"textbook"},

{id:"CO051-049",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Evasion vs. Redirection",difficulty:"applied",type:"scenario",
stem:"An officer sidesteps to avoid an incoming punch without making physical contact with the subject. This is an example of:",
choices:{A:"Evasion - shifting the body or sidestepping to avoid an attack",B:"Redirection - using empty-hand techniques to move the subject away",C:"A penetrating strike",D:"Balance displacement"},
correct:"A",
explanation:"Evasion is simply shifting the body or sidestepping to avoid an attack without necessarily making contact, while redirection specifically uses empty-hand techniques to physically move the subject away.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 3 (Unit 3)",sourceType:"textbook"},

{id:"CO051-050",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Pressure Point Duration Warning",difficulty:"higher",type:"scenario",
stem:"An officer applies a pressure point technique to a resistant subject, but the subject shows no response after several seconds. What safety concern does the curriculum specifically warn about?",
choices:{A:"There is no time-related concern with pressure point techniques regardless of how long they are applied or how the subject responds",B:"Applying pressure longer than three to five seconds without a response may cause an adrenaline surge, which can produce survival-response symptoms like an inability to feel pain or extraordinary strength",C:"The technique will automatically cause permanent nerve damage after exactly ten seconds of application, regardless of technique, subject, or officer training",D:"The subject must be immediately released regardless of continued resistance the moment any pressure point technique is applied at all"},
correct:"B",
explanation:"The curriculum specifically warns that applying pressure point pressure for longer than three to five seconds without a compliance response may trigger an adrenaline surge in the subject, producing survival-response symptoms such as an inability to feel pain, extraordinary strength, or selective hearing.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 4 (Unit 3)",sourceType:"textbook"},

{id:"CO051-051",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Escorts vs. Transporters",difficulty:"applied",type:"scenario",
stem:"What is the key difference between an 'escort' and a 'transporter' technique?",
choices:{A:"They are interchangeable terms for the same technique, differing only in which term a particular agency happens to prefer using",B:"An escort provides minimal control through leverage without pain compliance; a transporter (or come-along hold) uses pain or mechanical compliance when a subject resists the escort",C:"Escorts are only used on handcuffed subjects; transporters are only used on unrestrained subjects who remain fully compliant throughout the entire encounter",D:"Transporters are exclusively verbal techniques with no physical contact, used before any hands-on control is ever attempted"},
correct:"B",
explanation:"An escort provides minimal control through leverage alone, without pain compliance, and is often an officer's first physical contact with a subject - if the subject resists, the officer may transition to a transporter (come-along hold), which uses pain or mechanical compliance.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 5 (Unit 3)",sourceType:"textbook"},

{id:"CO051-052",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Restraint Device Monitoring",difficulty:"foundational",type:"recall",
stem:"Why must a handcuffed subject continue to be monitored by the officer?",
choices:{A:"Handcuffing renders a subject completely harmless, so monitoring is only a courtesy",B:"Handcuffing does not render a subject harmless, so continuous monitoring is required for officer safety",C:"Monitoring is only required if the subject verbally threatens the officer",D:"Monitoring is not necessary once double-locking is confirmed"},
correct:"B",
explanation:"The curriculum specifically states that handcuffing does not render a subject harmless - subjects should be continuously monitored to ensure officer safety, since resistance can still occur even after restraints are applied.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 6 (Unit 3)",sourceType:"textbook"},

{id:"CO051-053",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Flexible Cuff Application",difficulty:"applied",type:"scenario",
stem:"An officer is applying flexible plastic cuffs to a subject's wrists. What technique should be used to avoid cutting off blood circulation?",
choices:{A:"Tighten the cuffs as much as possible for maximum security, regardless of circulation concerns or the subject's complaints of pain",B:"Place an index finger against the subject's wrist before tightening the flexible cuff to the finger and wrist, then remove the finger and check for adequate circulation",C:"Apply the cuffs loosely with no fit-check at all, relying on the subject to report discomfort if it occurs later",D:"Circulation checks are not necessary with flexible cuffs, since they are designed to self-adjust to the subject's wrist"},
correct:"B",
explanation:"The curriculum specifically recommends placing an index finger against the wrist as a spacer while tightening the flexible cuff, then removing the finger and checking that circulation has not been cut off - this prevents over-tightening while still securing the subject.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 6 (Unit 3)",sourceType:"textbook"},

{id:"CO051-054",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Removing Flexible Cuffs",difficulty:"higher",type:"scenario",
stem:"An officer needs to cut off a subject's flexible plastic cuffs. What tool should specifically be avoided?",
choices:{A:"Any bladed cutting tool with sharp pointed ends or an exposed blade, such as a pocketknife or box cutter",B:"Purpose-built cuff-cutting shears designed specifically for flexible restraints",C:"Any tool at all, since flexible cuffs cannot be safely removed by any method",D:"Scissors with rounded tips"},
correct:"A",
explanation:"The curriculum specifically warns against using a cutting instrument with sharp pointed ends or an exposed blade, such as a pocketknife or box cutter, when removing flexible cuffs, due to the risk of injuring the subject during the cutting process.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 6 (Unit 3)",sourceType:"textbook"},

{id:"CO051-055",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Pat-Down Legal Standard",difficulty:"higher",type:"scenario",
stem:"Before a law enforcement officer may conduct a pat-down search under Florida's Stop and Frisk Law, what must the officer have?",
choices:{A:"A signed search warrant issued by a judge specifically authorizing the pat-down before it may lawfully begin at all",B:"Reasonable suspicion that the subject is armed - facts or circumstances that reasonably indicate the person has committed, is committing, or is about to commit a violation of the law",C:"Probable cause equivalent to that required for a full custodial arrest of the subject, not merely a lesser reasonable-suspicion standard",D:"The subject's written consent, obtained and signed by a witnessing supervisor before any pat-down is allowed to begin at all"},
correct:"B",
explanation:"Under s. 901.151, F.S. (the Stop and Frisk Law), an officer must have reasonable suspicion that the subject is armed before conducting a pat-down - a lower legal threshold than probable cause, requiring only facts or circumstances reasonably indicating criminal activity.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 7 (Unit 3), citing s. 901.151, F.S.",sourceType:"statute"},

{id:"CO051-056",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Pat-Down Purpose (Case Law)",difficulty:"higher",type:"recall",
stem:"According to Adams v. Williams, what is the actual purpose of a pat-down search?",
choices:{A:"To discover evidence of a crime for later prosecution of the subject",B:"To allow the officer to pursue their investigation without fear of violence, not to discover evidence of a crime",C:"To search for items of monetary value found on the subject",D:"To formally charge the subject with an additional offense"},
correct:"B",
explanation:"Adams v. Williams, 407 U.S. 143 (1972), established that the purpose of a pat-down is not to discover evidence of a crime but to allow the officer to pursue an investigation without fear of violence - a safety measure, not an evidence-gathering search.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 7 (Unit 3), citing Adams v. Williams, 407 U.S. 143 (1972)",sourceType:"court_case"},

{id:"CO051-057",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Plain Touch/Feel Doctrine",difficulty:"higher",type:"scenario",
stem:"During a lawful pat-down, an officer feels an object through the subject's clothing whose contour and mass are immediately identifiable as a weapon. Under Minnesota v. Dickerson, may the officer seize this item?",
choices:{A:"No, seizure requires a separate search warrant even after the object is clearly identified as contraband by touch alone during the pat-down",B:"Yes - under the plain touch/feel doctrine, an officer may seize an object whose contour or mass is identified as apparent contraband during a lawful pat-down",C:"Only if the officer first asks the subject for permission to remove the item from their clothing",D:"No, only visible items in plain view may ever be seized during any lawful pat-down of a subject"},
correct:"B",
explanation:"Minnesota v. Dickerson, 508 U.S. 366 (1993), established the plain touch/feel doctrine, allowing an officer to seize an object whose contour or mass is identifiable as apparent contraband during a lawful pat-down, without needing a separate warrant.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 7 (Unit 3), citing Minnesota v. Dickerson, 508 U.S. 366 (1993)",sourceType:"court_case"},

{id:"CO051-058",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Custodial Search Technique",difficulty:"applied",type:"scenario",
stem:"An officer is about to conduct a thorough custodial search of a subject taken into custody in an unsecured environment. What is the correct sequence and search pattern?",
choices:{A:"Search first, then handcuff, using a random, unsystematic search pattern",B:"Handcuff first, then search, using a systematic quadrant search approach that divides the body into four sections",C:"Search only the subject's pockets, skipping the rest of the body",D:"Search is not necessary if the subject simply appears cooperative at the time"},
correct:"B",
explanation:"For a custodial search, the officer should handcuff first and then search, given the vulnerability to assault during close contact - the search itself follows a systematic quadrant approach, dividing the body into four horizontal and vertical sections.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 7 (Unit 3)",sourceType:"textbook"},

{id:"CO051-059",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Clothed Search - Opposite Sex Rules",difficulty:"higher",type:"scenario",
stem:"A male officer wants to conduct a clothed search of a female inmate outside of an emergency situation. Is this permitted?",
choices:{A:"Yes, any officer of either sex may conduct a clothed search of any inmate at any time, since Florida policy places no restriction on cross-sex clothed searches outside of strip and unclothed searches specifically",B:"Generally no - a male officer will conduct a clothed search of a female inmate only during an emergency situation as determined by the shift supervisor, with limited exceptions when time and circumstances do not permit a female officer or supervisor consultation",C:"Yes, but only if a supervisor is present to witness the search and co-signs the report afterward, since presence alone satisfies the requirement regardless of urgency",D:"No, clothed searches must always be conducted by two officers of the inmate's sex working together, even during a genuine emergency with no other staff"},
correct:"B",
explanation:"The curriculum specifically restricts male officers from conducting clothed searches of female inmates to emergency situations determined by the shift supervisor, with a narrow exception when time and circumstances genuinely do not permit a female officer's presence or supervisor consultation - the reverse (female officer searching male inmate) has no such restriction.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 7 (Unit 3)",sourceType:"statute"},

{id:"CO051-060",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Strip Search Requirements",difficulty:"higher",type:"scenario",
stem:"Which of the following correctly describes the requirements for conducting a strip or unclothed search of an inmate?",
choices:{A:"It may be physically hands-on and conducted by any officer regardless of the inmate's sex at all, since only strip searches carry that restriction",B:"It must be done visually without touching the inmate, conducted only by officers of the same sex as the inmate (except in emergencies), and must occur out of view of the general inmate population",C:"It may be conducted in full view of other inmates as a deterrent measure, since visibility to the population reinforces facility security",D:"It requires a warrant signed by a judge before it may be conducted under any circumstance, emergency or otherwise"},
correct:"B",
explanation:"A strip or unclothed search is done visually - the officer does not touch the inmate - and must be conducted only by officers of the same sex as the inmate except in emergency circumstances, with the inmate moved out of view of the general population and only necessary staff present.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 7 (Unit 3)",sourceType:"statute"},

{id:"CO051-061",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Strip Search Triggers",difficulty:"applied",type:"scenario",
stem:"Which of the following circumstances would typically trigger a strip or unclothed search of an inmate?",
choices:{A:"A routine daily headcount, performed at the same scheduled times regardless of movement or contact with outsiders",B:"Returning from court, another institution, or any place of contact with the public, or after an escape or attempted escape",C:"A scheduled dental appointment within the facility, with no outside contact or transport involved",D:"A visit from an attorney only, since professional visits carry a lower contraband risk than public contact"},
correct:"B",
explanation:"Inmates are generally unclothed and searched upon arrival after returning from court, other institutions, or any place where they may have had contact with the public, as well as after an escape or attempted escape - situations with meaningful opportunity to obtain contraband.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 7 (Unit 3)",sourceType:"textbook"},

{id:"CO051-062",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Falling Techniques",difficulty:"foundational",type:"recall",
stem:"An officer is pushed forward with enough force to fall to the ground. They extend their bent arms, land on their palms, forearms, and feet, turn their head to the side, and exhale on impact. This describes:",
choices:{A:"The rear fall",B:"The side fall",C:"The front fall",D:"The foundation position"},
correct:"C",
explanation:"The front fall involves falling forward into a prone position, contacting the ground with the palms, forearms, and feet, turning the head to the side, and exhaling on impact to reduce injury and the stunning effect of the fall.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO051-063",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Hip Escape / Shrimping",difficulty:"applied",type:"scenario",
stem:"An officer on the ground pushes off with one foot, forces their hips up, and pushes out to the opposite side to avoid a subject attempting to gain a dominant ground position. This movement is known as:",
choices:{A:"Posting",B:"Sprawling",C:"A hip escape, also known as shrimping",D:"The three-point pin"},
correct:"C",
explanation:"A hip escape, also called shrimping, allows an officer to move side to side on the ground to avoid or defend against an attack, and is specifically used to escape ground positions like side control or full mount.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 2 (Unit 1)",sourceType:"textbook"},


// ============ CJK 0051 - DEFENSIVE TACTICS DEEPENING BATCH 3 (Strikes, VNR, Chemical Agents, Weapon Defense) ============
{id:"CO051-064",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Empty-Hand Strike Classification",difficulty:"higher",type:"scenario",
stem:"An officer strikes a resistant subject in the eyes with an open hand to gain compliance, without gouging. How is this strike classified?",
choices:{A:"Deadly force, identical to an eye gouge, since any eye strike carries the same classification",B:"Non-deadly force - striking the eyes with an empty hand is non-deadly force, though gouging the eyes is specifically classified as deadly force",C:"This target area may never be struck under any circumstances, regardless of the technique used or the severity of the threat",D:"It is unclassified since eye strikes are not addressed anywhere in policy"},
correct:"B",
explanation:"The curriculum specifically distinguishes an empty-hand strike to the eyes (non-deadly force) from gouging the eyes (deadly force) - the same general target area carries different force classifications depending on the specific technique used.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 8 (Unit 3)",sourceType:"textbook"},

{id:"CO051-065",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Impact Weapon Target Areas",difficulty:"higher",type:"scenario",
stem:"An officer strikes a resistant subject's groin with an empty hand versus with an impact weapon such as a baton. How does the force classification differ between these two methods?",
choices:{A:"Both are always classified as non-deadly force regardless of which tool is actually used against the subject",B:"A groin strike with an empty hand is non-deadly force, but the same strike delivered with an impact weapon is classified as deadly force",C:"Both are always classified as deadly force regardless of which tool is actually used",D:"The classification depends only on the subject's size, never the tool used"},
correct:"B",
explanation:"The curriculum specifically classifies a groin strike with an empty hand as non-deadly force, but the same target struck with an impact weapon is classified as deadly force - the tool used changes the classification even when the target area is identical.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 13 (Unit 3)",sourceType:"textbook"},

{id:"CO051-066",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Impact Weapon Target Areas",difficulty:"applied",type:"scenario",
stem:"Which impact weapon strike target areas are specifically classified as deadly force?",
choices:{A:"Front of shoulder and top of forearm",B:"Side of neck, head, throat, and groin",C:"Outside of thigh and top of calf",D:"Center of abdomen only"},
correct:"B",
explanation:"When using an impact weapon, strikes to the side of the neck, head, throat, and groin are all specifically classified as deadly force - a broader deadly-force list than with empty-hand strikes, where only the throat (and eye gouging) reach that classification.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 13 (Unit 3)",sourceType:"textbook"},

{id:"CO051-067",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Chokehold Statutory Definition",difficulty:"higher",type:"recall",
stem:"Under s. 943.1735, F.S., how is a 'chokehold' legally defined?",
choices:{A:"Any hold that makes contact with a person's neck for any reason, regardless of intent, duration, or effect on the person's airflow",B:"The intentional and prolonged application of force to the throat, windpipe, or airway of another person that prevents the intake of air - excluding neck contact not intended to prevent air intake",C:"Any restraint technique used on a resistant inmate, including handcuffing, leg restraints, and any pressure point compliance hold applied during the encounter",D:"A hold that is authorized only for use by K-9 units during an apprehension, never by correctional officers directly on an inmate"},
correct:"B",
explanation:"Section 943.1735, F.S. specifically defines a chokehold as the intentional and prolonged application of force to the throat, windpipe, or airway that prevents air intake - it explicitly excludes any neck contact that is not intended to prevent the intake of air.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 11 (Unit 3), citing s. 943.1735, F.S.",sourceType:"statute"},

{id:"CO051-068",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Vascular Neck Restraint Authorization",difficulty:"higher",type:"scenario",
stem:"Under what circumstance may a vascular neck restraint be used, per the 2020 national Consensus Policy referenced in the curriculum?",
choices:{A:"Any time a subject is verbally uncooperative",B:"Only when deadly force is authorized",C:"Routinely, as a first response to any physical resistance",D:"Only during formal disciplinary hearings"},
correct:"B",
explanation:"The curriculum specifically states that vascular neck restraints should only be used when deadly force is authorized, per recommendations in the 2020 national Consensus Policy and the Florida Police Chiefs Association report - and this lesson is optional training for corrections and correctional probation officers.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 11 (Unit 3)",sourceType:"textbook"},

{id:"CO051-069",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Vascular Neck Restraint Contraindications",difficulty:"higher",type:"scenario",
stem:"For which of the following populations does the curriculum specifically recommend AGAINST using a vascular neck restraint, due to unique physiology?",
choices:{A:"Adult males in good physical condition, regardless of any other listed factor",B:"Elderly persons, pregnant people, children, or people with apparent disabilities",C:"Subjects who are actively resisting arrest",D:"Subjects under the age of 30, regardless of any other listed factor"},
correct:"B",
explanation:"The curriculum specifically recommends against using a vascular neck restraint on elderly persons, pregnant people, children, or people with apparent disabilities, due to their unique physiology and the increased risk of serious harm.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 11 (Unit 3)",sourceType:"textbook"},

{id:"CO051-070",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Vascular Neck Restraint Recovery",difficulty:"applied",type:"scenario",
stem:"After a properly applied vascular neck restraint causes a subject to lose consciousness, and the hold is released, when should the subject regain consciousness, and what should the officer do if they do not?",
choices:{A:"The subject will never regain consciousness without CPR being administered immediately",B:"The subject should regain consciousness within about 30 seconds; if not, the officer should render medical aid",C:"Consciousness returns only after 10 minutes minimum in every case",D:"No monitoring is required once the hold is released"},
correct:"B",
explanation:"Because the vascular neck restraint works by restricting blood flow, releasing the hold quickly replenishes blood flow and revives the subject - the curriculum specifies the subject should regain consciousness within about 30 seconds, and if not, the officer must render medical aid.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 11 (Unit 3)",sourceType:"textbook"},

{id:"CO051-071",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"OC Spray Active Ingredient",difficulty:"foundational",type:"recall",
stem:"What is the active ingredient in oleoresin capsicum (OC) spray that produces the burning sensation on contact?",
choices:{A:"Capsaicin",B:"Orthochlorobenzalmalononitrile",C:"Nitrogen",D:"Isobutane"},
correct:"A",
explanation:"Capsaicin is the active ingredient in OC, a natural derivative of the cayenne pepper (with some synthetic forms), that produces the heat sensation felt when it contacts human tissue.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 14 (Unit 3)",sourceType:"textbook"},

{id:"CO051-072",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Scoville Heat Units",difficulty:"applied",type:"scenario",
stem:"What is the Scoville heat unit (SHU) scale used for in relation to OC spray, and how should officers understand its significance?",
choices:{A:"It measures the exact thermal temperature the spray reaches in degrees Fahrenheit, presenting a fire hazard identical to actual heat, flame, or a lit match held near the eyes",B:"It measures the burning sensation heat value of capsicum (originally designed for peppers in the restaurant industry) - SHUs are not equated with thermal degrees and do not present the burning dangers associated with actual fire",C:"It measures the exact distance in feet the spray travels once deployed from the canister nozzle, similar to a firearm's rated maximum effective range",D:"It has no established use in evaluating chemical agents and is not referenced anywhere in the curriculum's discussion of OC spray deployment or its effects"},
correct:"B",
explanation:"The Scoville heat unit scale, originally designed to rate the heat of peppers for the restaurant industry, measures the burning sensation value of capsicum - the curriculum specifically clarifies that SHUs are not equivalent to thermal degrees and do not carry the actual burning dangers associated with fire.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 14 (Unit 3)",sourceType:"textbook"},

{id:"CO051-073",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Alcohol-Based OC Spray Hazard",difficulty:"higher",type:"scenario",
stem:"An officer is about to use an electronic control device (ECD) on a subject who was recently sprayed with an alcohol-based OC formulation. What specific hazard should the officer consider?",
choices:{A:"There is no interaction risk between OC spray and ECDs under any documented condition",B:"Alcohol-based sprays can create a potential fire hazard when used in conjunction with an ECD or sprayed near an open flame",C:"Alcohol-based sprays neutralize the effectiveness of an ECD completely on contact",D:"This combination is required by policy for maximum effectiveness"},
correct:"B",
explanation:"The curriculum specifically warns that alcohol-based OC formulations can create a potential fire hazard if sprayed directly into a flame or used in conjunction with an ECD, even though alcohol-based sprays adhere better to skin and are more effective.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 14 (Unit 3)",sourceType:"textbook"},

{id:"CO051-074",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Chemical Agent Decontamination",difficulty:"applied",type:"scenario",
stem:"A subject contaminated with OC spray instinctively wants to rub their eyes. What should the officer instruct instead, and why?",
choices:{A:"Allow rubbing, since it helps distribute the chemical evenly across the eye and speeds up the burning sensation fading over the following several minutes",B:"Instruct the subject never to rub their eyes, and instead use 'strobing' - forcefully blinking to activate the tear ducts, since rubbing can push particles into the eye and damage the cornea",C:"Apply ice directly to the eyes immediately to numb the burning sensation caused by the spray's active ingredient and reduce swelling",D:"Instruct the subject to keep their eyes tightly closed for the next hour without flushing them or taking any other action"},
correct:"B",
explanation:"The curriculum specifically warns against rubbing contaminated eyes, since this can push small particles into the eye and damage the cornea - instead, strobing (forceful blinking using facial muscles) helps clear vision and activates tear ducts to wash away contaminant particles.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 14 (Unit 3)",sourceType:"textbook"},

{id:"CO051-075",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Chemical Agent Decontamination - Soap",difficulty:"applied",type:"scenario",
stem:"During decontamination from a chemical agent, why should oil-based soaps or scrubbing generally be avoided?",
choices:{A:"They are more expensive than water alone, which is the only real drawback of using them",B:"Scrubbing or using oil-based soaps can cause the contaminant to adhere more to the skin and prolong decontamination time",C:"They have no effect either way on decontamination time or absorption",D:"They are only avoided due to unrelated skin allergy concerns"},
correct:"B",

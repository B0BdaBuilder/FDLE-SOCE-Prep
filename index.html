explanation:"The curriculum specifically warns that scrubbing or using oil-based soaps during decontamination can cause the chemical contaminant to adhere more to the skin, actually prolonging the decontamination time rather than helping.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 14 (Unit 3)",sourceType:"textbook"},

{id:"CO051-076",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Weapon Retention Principle",difficulty:"foundational",type:"recall",
stem:"What is identified as one of the most effective methods to prevent being disarmed by a subject?",
choices:{A:"Carrying a backup weapon at all times",B:"Maintaining an appropriate reactionary gap",C:"Wearing a double-locked holster exclusively",D:"Never drawing a weapon under any circumstance"},
correct:"B",
explanation:"Maintaining an appropriate reactionary gap is specifically identified as one of the most effective methods to prevent being disarmed, since keeping distance from a subject reduces their ability to reach and grab an officer's weapon in the first place.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 15 (Unit 3)",sourceType:"textbook"},

{id:"CO051-077",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Handgun Defense - Telegraphing",difficulty:"higher",type:"scenario",
stem:"Before attempting a handgun defense technique, an officer makes a subtle shift of their eyes and feet toward the direction they intend to move. What principle have they violated?",
choices:{A:"Physical proximity",B:"Telegraphing",C:"Verbal distraction",D:"Action is faster than reaction"},
correct:"B",
explanation:"Telegraphing is specifically defined as revealing your intentions through small eye, hand, or foot movements in the direction you plan to move - avoiding this is essential to maintaining the element of surprise that makes handgun defense techniques effective.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 16 (Unit 3)",sourceType:"textbook"},

{id:"CO051-078",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Handgun Defense - Verbal Distraction",difficulty:"applied",type:"scenario",
stem:"Immediately before attempting a handgun defense technique, an officer asks the subject an unrelated question. What principle is this applying, and why?",
choices:{A:"Physical proximity, since questions require the officer to be within close range of the subject",B:"Verbal distraction - reaction time increases when a subject must process two or more pieces of information simultaneously",C:"Telegraphing, which should generally be avoided",D:"This has no tactical value and is purely conversational filler during the encounter"},
correct:"B",
explanation:"Verbal distraction relies on the principle that a subject's reaction time increases when they must process two or more pieces of information at once - asking a question immediately before acting is a deliberate way to create that momentary processing delay.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 16 (Unit 3)",sourceType:"textbook"},

{id:"CO051-079",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Edged Weapon Reactionary Gap",difficulty:"higher",type:"recall",
stem:"What is the minimum safe distance identified for an officer to be able to react to a sudden edged weapon attack without injury?",
choices:{A:"5 feet",B:"10 feet",C:"25 feet",D:"50 feet"},
correct:"C",
explanation:"The curriculum specifically identifies approximately 25 feet as the minimum safe distance for an officer to react to an edged weapon attack without injury - notably the same distance used for the reactionary gap when a subject's hands are concealed.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 17 (Unit 3)",sourceType:"textbook"},

{id:"CO051-080",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Edged Weapon Defense Principles",difficulty:"applied",type:"scenario",
stem:"Which three defensive movements does the curriculum specifically identify for defending against a spontaneous, close-quarter edged weapon attack?",
choices:{A:"Evade, secure, redirect",B:"Retreat, negotiate, surrender",C:"Freeze, assess, escalate",D:"Draw, aim, fire"},
correct:"A",
explanation:"The curriculum specifically identifies evade (move or pivot away), secure (capture and control the weapon arm), and redirect (redirect the weapon arm) as the three core defensive movements against a close-quarter edged weapon attack.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 17 (Unit 3)",sourceType:"textbook"},

{id:"CO051-081",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Deadly Force via Empty Hand",difficulty:"higher",type:"scenario",
stem:"During a ground fight, a subject attempts to gouge an officer's eyes and grab for the officer's firearm. Under what principle can the officer's empty-hand response escalate to deadly force?",
choices:{A:"Empty-hand techniques can never be classified as deadly force, regardless of the severity of the threat faced, the subject's access to a weapon, or the officer's own safety at that moment",B:"Empty-hand techniques become deadly force when they have the capability of causing great bodily harm or death, which can occur when the threat itself has escalated to a deadly level, such as an eye gouge or a fight for the officer's gun",C:"Only firearms and edged weapons can ever constitute deadly force under this framework, since hands alone cannot cause fatal injury by definition",D:"Empty-hand responses are always classified as less-lethal, even when applied to a threat capable of causing death or great bodily harm to anyone present"},
correct:"B",
explanation:"Empty-hand techniques become deadly force when applied in a way capable of causing great bodily harm or death - the curriculum specifically gives this scenario (a ground fight escalating to an eye gouge or a fight for the officer's gun) as exactly the kind of situation where an empty-hand response may become deadly force.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 18 (Unit 3)",sourceType:"textbook"},

{id:"CO051-082",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Improvised Deadly Weapons",difficulty:"applied",type:"scenario",
stem:"An officer, with no other option, uses a ballpoint pen directed at a subject's eye to stop a deadly threat. How does the curriculum classify this item in that context?",
choices:{A:"It remains a harmless office supply regardless of use, since intent alone cannot reclassify it",B:"It becomes a deadly weapon - any item used to cause death or great bodily harm is classified based on its use, not its original designed purpose",C:"It can never be classified as a weapon under any legal framework, regardless of how it was used against a person",D:"Only factory-manufactured weapons can be classified as deadly weapons under this rule"},
correct:"B",
explanation:"The curriculum specifically states that a deadly weapon is any item used to cause death or great bodily harm - it gives this exact example of a ballpoint pen directed at the eye becoming a deadly weapon, since it is the use of an item, not its original design, that determines its classification.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 18 (Unit 3)",sourceType:"textbook"},


// ============ CJK 0031 - FIRST AID DEEPENING BATCH 2 (Scene Assessment, MARCH, Triage, Threat Care) ============
{id:"CO031-053",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Scene Size-Up Components",difficulty:"foundational",type:"recall",
stem:"What are the four components of a scene size-up?",
choices:{A:"Scene safety, mechanism of injury/nature of illness, number of victims, and the need for more rescuers or special equipment",B:"Patient age, patient weight, patient allergies, and patient medications, gathered before any other step",C:"Weather, traffic, lighting, and noise level only, without any patient-related factor",D:"Arrival time, departure time, transport time, and hospital destination"},
correct:"A",
explanation:"The scene size-up has four specific components: determining scene safety, identifying the mechanism of injury or nature of illness, determining the number of victims, and assessing the need for additional rescuers or specialized equipment.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO031-054",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Scene Safety Priority",difficulty:"applied",type:"scenario",
stem:"An officer arrives at a medical emergency but assesses that the scene is not safe to enter, with no means to make it safe. What is the correct action?",
choices:{A:"Enter anyway since helping the patient is always the single top priority",B:"Do not enter the scene - if you get injured, you may not be able to help anyone else",C:"Enter only if wearing a seatbelt while approaching the scene",D:"Enter but leave all equipment behind"},
correct:"B",
explanation:"The curriculum is explicit that if a scene is unsafe and there is no means to make it safe, the officer should not enter - getting injured would prevent the officer from helping the patient or anyone else at all.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO031-055",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Trauma vs. Medical Patient",difficulty:"applied",type:"scenario",
stem:"A patient loses consciousness due to low blood sugar while driving, causing a vehicle crash and a broken arm. How should this patient be classified?",
choices:{A:"Only as a trauma patient, since the crash caused the visible injury",B:"Only as a medical patient, since low blood sugar caused the incident",C:"As both a trauma patient and a medical patient, requiring treatment for each condition",D:"Neither classification applies since the cause was accidental"},
correct:"C",
explanation:"The curriculum specifically gives this example - a medical condition (low blood sugar) causing a trauma event (the crash) - to illustrate that a patient can belong to both categories simultaneously and needs treatment for each.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO031-056",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"AVPU Scale",difficulty:"foundational",type:"recall",
stem:"What does the AVPU scale measure, and what do its four letters stand for?",
choices:{A:"Vital signs; airway, ventilation, pulse, urgency",B:"Level of consciousness; alert, verbal, pain, unresponsive",C:"Triage priority; assess, victim, prioritize, unify",D:"Bleeding severity; arterial, venous, punctured, uncontrolled"},
correct:"B",
explanation:"AVPU measures a patient's level of consciousness and stands for alert (fully awake), verbal (responds when spoken to), pain (responds only to painful stimulation), and unresponsive (no response to any stimuli).",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO031-057",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"AVPU - Officer Safety",difficulty:"higher",type:"scenario",
stem:"During an assessment, an officer determines that a fellow criminal justice officer's level of consciousness has dropped below 'alert.' What safety-related action should be taken?",
choices:{A:"No special action is needed beyond continuing the assessment",B:"Disarm the officer to avoid possible safety concerns",C:"Immediately restrain the officer's hands",D:"Remove the officer's radio only"},
correct:"B",
explanation:"The curriculum specifically instructs that if the patient is a criminal justice officer who drops below the level of alert, they should be disarmed to avoid possible safety concerns, since a reduced level of consciousness could lead to an unintended discharge or weapon loss.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO031-058",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"MARCH Primary Assessment",difficulty:"foundational",type:"recall",
stem:"What does the mnemonic MARCH stand for in a primary assessment, and in what order should it be completed?",
choices:{A:"Medication, Allergies, Respiration, Circulation, History, assessed in that fixed order",B:"Massive hemorrhage, Airway, Respirations, Circulation, Hypothermia/head injury - completed in that exact order",C:"Movement, Awareness, Response, Communication, Health, assessed in that fixed order",D:"Mobility, Assessment, Recovery, Care, Handoff"},
correct:"B",
explanation:"MARCH stands for massive hemorrhage, airway, respirations, circulation, and hypothermia/head injury, and the curriculum specifically requires completing the primary assessment in this exact order and priority.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO031-059",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"MARCH - Why Bleeding First",difficulty:"higher",type:"scenario",
stem:"Why does the MARCH primary assessment address massive hemorrhage before airway, even though airway management is also critical?",
choices:{A:"Bleeding is always less serious than an airway problem, addressed first only as a formality",B:"Massive hemorrhage (uncontrolled severe bleeding) is the number one preventable cause of trauma-related deaths, making it the most time-critical intervention",C:"Airway problems are never actually life-threatening, so bleeding always takes priority instead",D:"There is no significance to the order; it is arbitrary and could be taught in either sequence without any consequence at all"},
correct:"B",
explanation:"Massive hemorrhage is specifically identified as the number one preventable cause of trauma-related deaths, which is why the MARCH sequence addresses life-threatening bleeding as the very first priority, even before airway management.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO031-060",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Pulse Points by Age",difficulty:"applied",type:"scenario",
stem:"An officer needs to check the pulse of an unconscious adult patient during a primary assessment. Which pulse point should be checked?",
choices:{A:"The brachial pulse on the upper arm",B:"The carotid pulse on the neck",C:"The radial pulse on the wrist",D:"The femoral pulse in the groin"},
correct:"B",
explanation:"For an unconscious adult or child, the curriculum specifies checking the carotid pulse on the neck - the brachial pulse is used specifically for infants, and the radial pulse is used for a conscious adult or child.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO031-061",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Capillary Refill Test",difficulty:"applied",type:"scenario",
stem:"An officer performs a capillary refill test by squeezing a patient's fingernail bed for two seconds and releasing. The nail bed returns to a pink color within two seconds. What does this indicate?",
choices:{A:"Inadequate circulation requiring immediate CPR",B:"Adequate blood flow/circulation",C:"A confirmed spinal injury",D:"The test result is inconclusive and must be repeated five times"},
correct:"B",
explanation:"If the squeezed nail bed returns to a pink color within two seconds after release, this indicates adequate blood flow - a slower return would suggest a circulation problem requiring further assessment.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO031-062",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"DOTS Secondary Assessment",difficulty:"foundational",type:"recall",
stem:"During a secondary assessment, what does the mnemonic DOTS help an officer examine?",
choices:{A:"Deformities, open injuries, tenderness, and swelling in each body part",B:"Diagnosis, oxygen, treatment, and shock",C:"Dosage, onset, timing, and severity of medication",D:"Direction, observation, triage, and stabilization"},
correct:"A",
explanation:"DOTS stands for deformities, open injuries, tenderness, and swelling - a systematic guide for examining each body part during the comprehensive head-to-toe secondary assessment.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO031-063",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"PMS Secondary Assessment",difficulty:"foundational",type:"recall",
stem:"What does the mnemonic PMS help an officer assess when examining a patient's extremities?",
choices:{A:"Pulse, motor, and sensory function",B:"Pain, movement, and swelling",C:"Position, mobility, and strength",D:"Pressure, mass, and shape"},
correct:"A",
explanation:"PMS stands for pulse, motor, and sensory function - assessing for the presence of a pulse, the ability to move (motor function), and the ability to feel sensation, specifically when examining a patient's extremities.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO031-064",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Battle's Sign",difficulty:"higher",type:"scenario",
stem:"During a head-to-toe assessment, an officer notices discoloration behind a patient's ears. What might this specifically indicate?",
choices:{A:"A normal variation with no medical significance",B:"Battle's sign, which may indicate brain trauma",C:"A sign of dehydration only",D:"An unrelated skin condition requiring no further assessment"},
correct:"B",
explanation:"Discoloration behind the ears, known as Battle's sign, is specifically identified as a possible indicator of brain trauma during a head assessment - along with raccoon eyes (discoloration around the eyes) and fluid loss from the ears or nose.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO031-065",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Ongoing Assessment Frequency",difficulty:"applied",type:"scenario",
stem:"An officer is caring for a patient who is stable while awaiting EMS. How often should the officer reassess the patient?",
choices:{A:"Every 5 minutes regardless of stability",B:"Every 15 minutes if stable, or every 5 minutes if unstable",C:"Only once, immediately before EMS arrives",D:"Every hour regardless of stability"},
correct:"B",
explanation:"The curriculum specifically instructs reassessing a stable patient every 15 minutes, but increasing the frequency to every 5 minutes if the patient is unstable, continuing until EMS arrives and takes over.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO031-066",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Vital Sign Calculation",difficulty:"applied",type:"scenario",
stem:"An officer counts 18 pulse beats over 15 seconds while taking a patient's pulse. What is the patient's average pulse rate per minute?",
choices:{A:"18 beats per minute",B:"36 beats per minute",C:"72 beats per minute",D:"90 beats per minute"},
correct:"C",
explanation:"To calculate the pulse rate, count the beats over 15 seconds and multiply by four: 18 beats x 4 = 72 beats per minute, which is the correct method taught in the curriculum for both pulse and respiration rate calculations.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO031-067",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Recovery Position",difficulty:"applied",type:"scenario",
stem:"An unresponsive, breathing patient with no suspected neck or back injury needs to be positioned while awaiting EMS. What position should be used, and why?",
choices:{A:"Flat on their back, to allow CPR to begin immediately without needing to reposition the patient beforehand",B:"The recovery position, which helps maintain an open airway if the patient becomes nauseated or vomits, and helps prevent positional asphyxia",C:"Seated fully upright with legs crossed, to keep the airway open through gravity alone",D:"Face down with hands under the chest, to prevent aspiration if the patient vomits"},
correct:"B",
explanation:"The recovery position is specifically used for an unresponsive, breathing patient without suspected neck or back injury because it helps maintain an open airway in case of vomiting and helps prevent breathing restrictions like positional asphyxia.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO031-068",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Positional Asphyxia Risk Factors",difficulty:"higher",type:"scenario",
stem:"A restrained subject is placed face down with their chest on a hard surface and arms restrained behind their back for an extended period. Which condition are they at heightened risk for, especially if they have obesity or a pre-existing lung condition?",
choices:{A:"Frostbite",B:"Positional asphyxia",C:"Heat stroke",D:"Anaphylaxis"},
correct:"B",
explanation:"Positional asphyxia occurs when body positioning interferes with adequate breathing - the curriculum specifically describes this exact scenario (face down, chest on a hard surface, arms restrained behind the back) as a risk, especially for people with obesity, pre-existing lung disease, or under the influence of alcohol or drugs.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO031-069",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Positional Asphyxia Response",difficulty:"applied",type:"scenario",
stem:"A restrained suspect complains they cannot breathe while in a prone position, and is not combative. What is the correct response?",
choices:{A:"Ignore the complaint, since restrained subjects often make this claim to manipulate officers into loosening restraints",B:"Get the patient out of the prone position as soon as practical and place them in a position of comfort, such as sitting upright against a solid surface",C:"Add additional restraints to prevent further complaints from the subject entirely",D:"Leave the subject prone but loosen the handcuffs slightly, without repositioning the subject's body"},
correct:"B",
explanation:"The curriculum specifically instructs getting a complaining, non-combative restrained subject out of the prone position as soon as practical, searching them if needed, and placing them in a position of comfort such as sitting upright leaning against a solid surface.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO031-070",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Proper Lifting Technique",difficulty:"foundational",type:"recall",
stem:"When lifting a patient, which body parts should generate the lifting force?",
choices:{A:"The back and shoulders",B:"The legs, hips, and buttocks - not the back",C:"The arms and wrists only",D:"The neck and upper back"},
correct:"B",
explanation:"The curriculum specifically instructs lifting with the legs, hips, and buttocks, not the back, along with maintaining correct spinal alignment and engaging the abdominal muscles, to reduce the risk of injury to the officer.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO031-071",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Emergency vs. Non-Emergency Moves",difficulty:"applied",type:"scenario",
stem:"When should an officer perform an emergency move of a patient, such as a drag, rather than a non-emergency move?",
choices:{A:"Whenever the officer personally prefers it over waiting for EMS to arrive",B:"When the patient is in immediate danger, or the patient's location prevents providing care to them or another patient",C:"Emergency moves should never be performed by officers under any circumstance whatsoever on scene",D:"Only when specifically instructed by EMS after their arrival"},
correct:"B",
explanation:"An emergency move is specifically performed when a patient is in immediate danger or their location prevents care from being provided - a non-emergency move (like an extremity lift) is used when the situation is not urgent.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO031-072",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Extremity Lift Contraindication",difficulty:"higher",type:"scenario",
stem:"An officer is preparing to move an unresponsive patient using a two-officer extremity lift. Under what circumstance should this technique NOT be performed?",
choices:{A:"When the patient is unconscious, regardless of any suspected spinal or extremity injury",B:"When the officer suspects or knows the patient has an injury to the spine or an extremity",C:"When only two officers are available to move the patient at the scene",D:"When the patient is a criminal justice officer"},
correct:"B",
explanation:"The curriculum specifically warns not to perform an extremity lift if a spine or extremity injury is suspected or known, since the technique's positioning and movement could worsen those specific injuries.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO031-073",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Mass Casualty Incident - First Officer Role",difficulty:"foundational",type:"recall",
stem:"What is the role of the first officer to arrive at a mass casualty incident, assuming no active threats are present?",
choices:{A:"Immediately begin full medical treatment on the first patient encountered at the scene",B:"Conduct a scene size-up, establish command of the scene, and communicate with other first responders through dispatch",C:"Wait outside the scene until EMS arrives before taking any action at all",D:"Immediately begin evacuating all patients regardless of injury severity"},
correct:"B",
explanation:"The first officer at a mass casualty incident is responsible for conducting a scene size-up, establishing command, and communicating with other responders through dispatch - ideally accomplishing all of these tasks simultaneously, before beginning triage.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO031-074",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Triage Goal",difficulty:"foundational",type:"recall",
stem:"What is the primary goal of triage during a mass casualty incident?",
choices:{A:"To provide the most extensive possible treatment to the first patient found on scene",B:"To do the most for the most - rapidly evaluating all patients to determine the order of future medical attention based on injury severity",C:"To treat patients in the exact order they are discovered, regardless of injury severity or the resources actually available",D:"To transport all patients immediately regardless of injury severity"},
correct:"B",
explanation:"The goal of triage is specifically to do the most for the most, rather than providing extensive treatment to a single patient - the focus is on rapidly evaluating and sorting patients by severity to determine the order of care.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO031-075",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"START Triage - Walking Wounded",difficulty:"applied",type:"scenario",
stem:"During START triage at a mass casualty incident, what is the officer's first action?",
choices:{A:"Immediately begin treating the most severely injured patient found first, before assessing anyone else present",B:"Direct all patients who can hear the officer's voice and can walk to move to a designated area, then move quickly through the remaining patients",C:"Wait for a supervisor's approval before taking any triage action, even as patients continue to deteriorate",D:"Transport the nearest patient to the hospital immediately, without triaging anyone else first"},
correct:"B",
explanation:"START triage begins by directing all patients who can hear and walk to a separate designated location - these \"walking wounded\" are not forgotten, but this step quickly identifies the least critical patients so the officer can focus on rapidly assessing those remaining.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO031-076",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"START Triage Categories",difficulty:"foundational",type:"recall",
stem:"In the START triage system, what does a BLACK tag indicate?",
choices:{A:"Minor injury, ambulatory",B:"Immediate, life-threatening injury requiring urgent care",C:"Deceased or non-salvageable",D:"Delayed care, stable for the moment"},
correct:"C",
explanation:"A BLACK tag in START triage specifically indicates the patient is deceased or non-salvageable - distinct from RED (immediate), YELLOW (delayed), and GREEN (ambulatory/minor).",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO031-077",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"START Triage - RPM",difficulty:"higher",type:"scenario",
stem:"During START triage, a patient's respiratory rate is 34 breaths per minute. Per the RPM assessment sequence, what triage tag should this patient immediately receive?",
choices:{A:"GREEN, since the patient is breathing at all, regardless of the actual rate",B:"RED - a respiratory rate of more than 30 breaths per minute results in an immediate RED tag",C:"YELLOW, pending further assessment",D:"BLACK, since rapid breathing always indicates death is imminent"},
correct:"B",
explanation:"Under the RPM (respiration, perfusion, mental status) sequence, a respiratory rate of more than 30 breaths per minute results in an immediate RED tag without needing to proceed to the perfusion or mental status checks.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO031-078",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"START Triage - Perfusion",difficulty:"higher",type:"scenario",
stem:"During START triage, a patient is breathing at 20 breaths per minute, but has no palpable radial pulse. What should happen next in the RPM sequence?",
choices:{A:"The patient is automatically tagged GREEN regardless of the missing radial pulse finding",B:"The patient is tagged RED, since no radial pulse present or a capillary refill time greater than two seconds results in an immediate RED tag",C:"The officer should proceed directly to assessing mental status without concern for the missing pulse at all",D:"The patient is tagged BLACK, since a missing pulse means death has occurred"},
correct:"B",
explanation:"In the perfusion step of RPM, if no radial pulse is present, or capillary refill time exceeds two seconds, the patient receives an immediate RED tag - only if perfusion is adequate does the assessment proceed to mental status.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO031-079",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"START Triage - Borderline Decisions",difficulty:"higher",type:"scenario",
stem:"An officer is triaging a patient whose condition seems to fall right between GREEN and YELLOW. What does the curriculum instruct in borderline cases like this?",
choices:{A:"Always default to the less urgent category to save resources",B:"Always triage to the more urgent priority - in this case, tag YELLOW",C:"Flip a coin to decide",D:"Skip the patient and move to the next one without tagging"},
correct:"B",
explanation:"The curriculum specifically instructs that when a borderline decision arises, the officer should always triage to the most urgent priority - in a GREEN/YELLOW borderline case, this means tagging the patient YELLOW.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO031-080",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"SALT Triage - GRAY Category",difficulty:"higher",type:"recall",
stem:"What does a 'GRAY' tag mean under the SALT triage method, and how does it differ from START?",
choices:{A:"GRAY means minor injury requiring no treatment, identical to START's GREEN walking-wounded category in every respect and every outcome",B:"GRAY means the patient is expected to die but is not yet deceased - a category not present in START, signaling responders to focus on patients with a higher chance of survival first",C:"GRAY indicates the patient has already been treated and transported to a receiving hospital by someone else entirely",D:"GRAY is used only for patients with no visible injuries who are cleared to leave the scene under their own power right away"},
correct:"B",
explanation:"SALT adds the GRAY category - meaning expectant, or expected to die but not yet deceased - which START does not use; this signals responders to prioritize immediate patients with a higher survival chance before expectant patients, when resources allow.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO031-081",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Direct Threat Care",difficulty:"higher",type:"scenario",
stem:"An officer is providing care to a wounded colleague during an active shooter incident, while the threat is still present. What is the primary concern in this 'direct threat care' or 'hot zone' environment?",
choices:{A:"Performing a complete secondary assessment immediately, before addressing any active threat present nearby",B:"Stopping or neutralizing the threat if possible, and addressing only the most life-threatening injuries that can be quickly treated, such as massive hemorrhage",C:"Beginning CPR immediately regardless of the ongoing threat, since airway care always takes priority over stopping the threat itself",D:"Completing detailed documentation before providing any care, to preserve an accurate timeline before treatment begins"},
correct:"B",
explanation:"In direct threat care (hot zone), the primary concern is stopping or neutralizing the threat if possible - medical intervention is limited to the most life-threatening, quickly addressable injuries like massive hemorrhage, rather than a full assessment.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO031-082",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Indirect Threat Care",difficulty:"applied",type:"scenario",
stem:"An officer and a wounded colleague have reached a warm zone (indirect threat care), where the officer is out of imminent danger but not yet fully safe. What level of care is now appropriate?",
choices:{A:"Full CPR and airway care, including intubation, should begin immediately upon reaching the warm zone, before any bleeding is even addressed at all",B:"Following MARCH assessment and treatment priorities, addressing life-threatening bleeding, but generally not initiating airway care like CPR until reaching the cold zone (except for the recovery position)",C:"No care of any kind should be provided until the patient has been physically moved into the cold zone entirely, even for severe bleeding",D:"Only mental health and emotional support should be provided in the warm zone, with no physical treatment of any wound or bleeding at all"},
correct:"B",
explanation:"In indirect threat care (warm zone), officers follow MARCH assessment and treatment priorities, addressing bleeding with pressure, packing, and tourniquets - but the curriculum specifically notes airway care like CPR should generally wait until reaching the cold zone, aside from placing the patient in the recovery position.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO031-083",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Evacuation Care",difficulty:"applied",type:"scenario",
stem:"An officer has reached the cold zone (evacuation care) with an injured colleague. Under what circumstance should evacuation still be delayed?",
choices:{A:"Evacuation should never be delayed once the cold zone has been reached at all",B:"Only to address immediately life-threatening conditions, such as massive hemorrhage or airway compromise",C:"Evacuation should always be delayed to complete a full secondary assessment first",D:"Only if the injured person requests a delay"},
correct:"B",
explanation:"The curriculum specifically states that the only time evacuation should be delayed in the cold zone is to address immediately life-threatening conditions like massive hemorrhage or airway compromise - otherwise, the best care is evacuation and hand-off to a higher level of care.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO031-084",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Self-Care Priority",difficulty:"higher",type:"scenario",
stem:"During direct threat care, an officer providing aid to a wounded colleague becomes injured themselves. What does the curriculum instruct?",
choices:{A:"Continue focusing entirely on the original patient regardless of the officer's own injury",B:"The primary focus should shift to applying the officer's own tourniquet and providing self-care",C:"Call for backup and take no direct action",D:"Abandon all first aid efforts and retreat immediately"},
correct:"B",
explanation:"The curriculum specifically instructs that if the officer becomes injured while providing direct threat care, the primary focus should shift to self-care - such as applying their own tourniquet - since an incapacitated officer cannot continue helping anyone else.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 2)",sourceType:"textbook"},


// ============ CJK 0111 - INTERVIEWING AND REPORT WRITING DEEPENING BATCH (Grammar, Mechanics, Review) ============
{id:"CO111-021",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Sentence Fragments",difficulty:"foundational",type:"recall",
stem:"A report contains the phrase \"Fight in the rec yard.\" as a complete sentence. What is wrong with this, and how should it be corrected?",
choices:{A:"Nothing is wrong; this is a complete and acceptable sentence as written by the officer in the report",B:"It is a sentence fragment, missing a subject and verb; it should be rewritten as something like \"I witnessed a fight in the rec yard.\"",C:"It is too short and should simply be made longer with more descriptive adjectives",D:"It should be rewritten in the passive voice instead"},
correct:"B",
explanation:"This is a sentence fragment because it lacks a subject and verb and does not express who did what - the curriculum's own corrected example adds a subject and verb: \"I witnessed a fight in the rec yard.\"",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO111-022",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Subject-Verb Agreement",difficulty:"foundational",type:"recall",
stem:"Which sentence demonstrates correct subject-verb agreement?",
choices:{A:"\"They is brothers.\"",B:"\"They are brothers.\"",C:"\"They be brothers.\"",D:"\"They was brothers.\""},
correct:"B",
explanation:"Since \"they\" is a plural subject, it requires the plural verb \"are\" - \"They is brothers\" incorrectly pairs a plural subject with a singular verb.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO111-023",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Run-On Sentences and Comma Splices",difficulty:"applied",type:"scenario",
stem:"A report reads: \"We arrived at the scene, Officer Stone interviewed the inmate.\" What error does this contain, and how can it be corrected?",
choices:{A:"No error; this is correctly punctuated and requires no revision before submission to a supervisor",B:"A comma splice - two complete sentences joined only by a comma; it can be fixed by adding a conjunction after the comma or replacing the comma with a period",C:"A subject-verb agreement error, since 'arrived' and 'interviewed' do not match in number within the same written sentence",D:"A capitalization error only, since 'Officer' should not be capitalized anywhere in this particular sentence"},
correct:"B",
explanation:"This is a comma splice, where two complete sentences are joined by a comma alone without a conjunction - it can be corrected by adding a conjunction (\"and\") after the comma, or by replacing the comma with a period to create two separate sentences.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO111-024",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Verb Tense",difficulty:"foundational",type:"recall",
stem:"In which tense should correctional officers generally write their reports, and why?",
choices:{A:"Present tense, since it feels more immediate",B:"Past tense, since most reports describe events that have already occurred",C:"Future tense, to describe expected outcomes",D:"Tense does not matter as long as it is consistent within a single sentence"},
correct:"B",
explanation:"Reports should generally be written in the past tense, since they describe events that have already occurred - officers should also ensure verb tense stays consistent throughout the entire report.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO111-025",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Active vs. Passive Voice",difficulty:"applied",type:"scenario",
stem:"Which sentence is written in the active voice preferred for reports?",
choices:{A:"\"The visitor was searched by the officer.\"",B:"\"The officer searched the visitor.\"",C:"Both sentences are equally acceptable in professional reports",D:"Neither sentence is grammatically correct"},
correct:"B",
explanation:"\"The officer searched the visitor\" is active voice - the subject (the officer) is stated clearly at the beginning, before the verb - unlike the passive version, which reverses the subject and object and requires the reader to wait until the end to learn who performed the action.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO111-026",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Active Voice Accountability",difficulty:"higher",type:"scenario",
stem:"Beyond readability, why does the curriculum emphasize using active voice in reports?",
choices:{A:"Active voice is simply a matter of stylistic preference with no substantive purpose in a written incident report",B:"Active voice ensures that people's actions are accountable, telling the reader directly who performed an action and who received it, without guesswork",C:"Active voice is required only for reports involving use of force, not for any other incident type",D:"Active voice makes reports shorter, which is the only real benefit"},
correct:"B",
explanation:"Beyond being easier to read, active voice ensures accountability - it makes explicit who performed an action and who received it, avoiding the ambiguity that passive voice can create about who is responsible for what.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO111-027",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Possessive Apostrophes",difficulty:"applied",type:"scenario",
stem:"An officer writes, \"The officer searched Inmate Jones cell.\" What is missing, and what is the correct version?",
choices:{A:"Nothing is missing; the sentence is correct as written",B:"An apostrophe showing possession is missing; it should read \"Inmate Jones's cell\"",C:"A comma is missing before the word \"cell\" at the end of the sentence",D:"The word \"cell\" should be capitalized in this particular sentence"},
correct:"B",
explanation:"The sentence needs an apostrophe to show possession - since \"Jones\" is a singular noun ending in s, it still requires an additional s after the apostrophe, making the correct form \"Jones's cell.\"",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO111-028",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Contractions in Reports",difficulty:"applied",type:"scenario",
stem:"When, if ever, is it appropriate to use a contraction (such as \"didn't\") in a report?",
choices:{A:"Contractions should be used freely throughout reports to keep them concise",B:"Contractions should generally be avoided in reports unless they are part of a direct quote or statement",C:"Contractions are never permitted under any circumstance, even within a direct quote",D:"Contractions are required whenever quoting an inmate"},
correct:"B",
explanation:"The curriculum specifically states that contractions should be avoided in report writing unless they are part of a statement or direct quote - for example, quoting an inmate who said \"I don't want my breakfast\" preserves their exact words.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO111-029",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Quotation Marks",difficulty:"applied",type:"scenario",
stem:"An officer writes: \"Inmate Roberts refused to leave his cell.\" and places quotation marks around this entire sentence, even though the inmate did not say these exact words. What is the error?",
choices:{A:"There is no error; quotation marks may be used for any paraphrase as long as the general meaning is accurate overall",B:"Quotation marks should only be used around words actually said by someone - this is a summary, not a direct quote, and should not have quotation marks",C:"The sentence should be written in the present tense instead, describing events as they happen",D:"The error is a subject-verb agreement problem between 'Roberts' and 'refused'"},
correct:"B",
explanation:"Quotation marks should be reserved for a person's actual words - placing them around a paraphrased summary (rather than the inmate's direct statement, such as \"I'm not leaving this cell\") misrepresents the facts of what was actually said.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO111-030",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Capitalization - Titles",difficulty:"applied",type:"scenario",
stem:"Which sentence correctly follows the capitalization rule for professional titles?",
choices:{A:"\"I spoke to the Captain to explain the situation.\" (no name given)",B:"\"I spoke to Captain Smith to explain the situation.\"",C:"Both sentences are equally correct regardless of whether a name is used",D:"Titles should never be capitalized under any circumstance"},
correct:"B",
explanation:"Professional titles are capitalized only when a specific name is used alongside them - \"Captain Smith\" is correctly capitalized, while an unnamed reference like \"the captain\" should remain lowercase.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO111-031",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Capitalization - Geographic Terms",difficulty:"higher",type:"scenario",
stem:"Which sentence correctly applies the capitalization rule distinguishing a specific geographic region from a simple direction?",
choices:{A:"\"The inmate requested a transfer to a facility in the south.\" and \"The sally port is South of the entrance.\"",B:"\"The inmate requested a transfer to a facility in the South.\" and \"The sally port is south of the entrance.\"",C:"Both instances should always be capitalized regardless of context",D:"Neither instance should ever be capitalized"},
correct:"B",
explanation:"A specific geographic region (\"the South\") is capitalized as a proper noun, while a simple direction (\"south of the entrance\") is not - the same word can be treated differently depending on whether it names a place or indicates direction.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO111-032",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Editing vs. Proofreading",difficulty:"higher",type:"scenario",
stem:"What is the difference between 'editing' and 'proofreading' a report?",
choices:{A:"They are identical processes with different names, both focused equally on content accuracy and typographical correctness in a report",B:"Editing is revising content for accuracy, organization, and grammar; proofreading is a later step focused on catching typos and minor issues not caught during editing",C:"Proofreading always comes before editing, since typos should be fixed before larger revisions",D:"Editing is done only by supervisors, and proofreading is done only by the writing officer, per written agency policy"},
correct:"B",
explanation:"Editing is the process of revising content for accuracy, organization of ideas, grammar, and overall presentation, and should be done first - proofreading follows, focused on catching typos and minor mechanical issues that editing may have missed.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO111-033",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Report Review Techniques",difficulty:"applied",type:"scenario",
stem:"An officer wants to catch errors in a completed report before submission. Which technique does the curriculum specifically recommend to help focus on one line at a time?",
choices:{A:"Reading the entire report only once, silently, from start to finish",B:"Placing a blank sheet of paper over the report, covering everything but the line being read",C:"Submitting the report immediately without any review",D:"Only checking the first and last sentences"},
correct:"B",
explanation:"The curriculum specifically recommends the cover method - placing a blank sheet of paper over the report so only one line is visible at a time - which helps errors stand out that might otherwise be missed when reading the whole page at once.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO111-034",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Report Review - Reading Aloud",difficulty:"foundational",type:"recall",
stem:"Why does the curriculum recommend reading a report aloud during the review process?",
choices:{A:"It has no real benefit and is only a matter of personal preference for the writer",B:"Reading aloud encourages reading every word, which can help spot errors that might be missed when reading silently",C:"It is required only for reports involving the use of force, not other report types",D:"It replaces the need for any other review technique"},
correct:"B",
explanation:"Reading a report aloud - or having someone else read it to you - encourages careful attention to every word, which can help catch errors that might otherwise be skipped over during silent reading.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO111-035",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Finalizing a Report",difficulty:"applied",type:"scenario",
stem:"Before submitting a completed report to a supervisor, what should the officer specifically ask themselves to check for completeness?",
choices:{A:"\"Is this report shorter than my last one?\" - a check aimed only at brevity, not completeness",B:"\"If I was not involved or did not witness this incident, would I have a clear picture of what happened after reading this report?\"",C:"\"Will this report win an award for writing quality?\" - a check aimed at style rather than substance",D:"\"Did I use as many synonyms as possible?\" - a check aimed only at vocabulary variety"},
correct:"B",
explanation:"The curriculum specifically recommends this self-check question to test completeness - if someone with no personal knowledge of the incident couldn't understand what happened from the report alone, it needs revision to fill in missing details.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO111-036",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Report Attachments",difficulty:"foundational",type:"recall",
stem:"Which of the following should be attached to a finalized report, where applicable?",
choices:{A:"Only the officer's personal notes taken during the initial response to the scene of the incident",B:"Relevant documents such as pictures, logs, chain of custody records for evidence, medical documents, and evidence submissions",C:"Nothing further is needed once the narrative portion of the report is signed",D:"Only documents requested by the inmate involved"},
correct:"B",
explanation:"The curriculum specifically lists attaching relevant supporting documents - including pictures, logs, chain of custody records, medical documents, evidence submissions, and follow-up actions - as part of finalizing a report.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 4 (Unit 2)",sourceType:"textbook"},


// ============ CJK 0040 - FIREARMS DEEPENING BATCH 2 (Cover/Concealment, Survival Shooting, Active Threat Response) ============
{id:"CO040-033",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Cover vs. Concealment",difficulty:"foundational",type:"recall",
stem:"What is the key difference between 'cover' and 'concealment'?",
choices:{A:"They are interchangeable terms for the same concept, both hiding an officer from view equally",B:"Cover is a bullet-resistant barrier between an officer and a threat; concealment only creates a visual barrier and may not stop a projectile",C:"Concealment always provides better protection than cover, since it hides the officer entirely",D:"Cover only applies indoors, while concealment only applies outdoors, based on the type of structure available"},
correct:"B",
explanation:"Cover is specifically an object or obstacle that creates a bullet-resistant barrier, such as a concrete wall or vehicle engine block, while concealment only creates a visual barrier that hides an officer's location without necessarily stopping a projectile - cover can also serve as concealment, but concealment is not necessarily cover.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 4)",sourceType:"textbook"},

{id:"CO040-034",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Choosing Cover",difficulty:"applied",type:"scenario",
stem:"An officer is choosing between two potential positions of cover during a deadly force encounter. Which factor is specifically prioritized over the object's size when selecting cover?",
choices:{A:"Color",B:"Density - the cover's capability of stopping a projectile",C:"Distance from the nearest exit",D:"Whether the object is man-made or natural"},
correct:"B",
explanation:"The curriculum specifically states that cover should be chosen for its bullet-stopping capabilities (density), not its size - while size matters for full body concealment, density is what actually determines whether the object can stop a projectile.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 4)",sourceType:"textbook"},

{id:"CO040-035",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Using Cover Correctly",difficulty:"higher",type:"scenario",
stem:"An officer takes cover behind a concrete wall during a deadly force encounter and leans their body directly against it while firing. What is the problem with this approach?",
choices:{A:"There is no problem; leaning against cover is the recommended technique for stability while returning fire under stress",B:"Leaning on cover decreases mobility and increases the chance of being hit by direct fire, ricochet, or scattered debris when projectiles impact the cover",C:"Leaning against cover is only a concern if the cover happens to be made of wood",D:"This technique is required to maintain accuracy while shooting from a braced position against solid cover"},
correct:"B",
explanation:"The curriculum specifically warns against resting the body directly against cover, since leaning decreases mobility and increases the risk of injury from ricochet or debris when the cover is struck by incoming fire, and it could also disable the officer's firearm.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 4)",sourceType:"textbook"},

{id:"CO040-036",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Barricade Shooting Position",difficulty:"applied",type:"scenario",
stem:"An officer fires from a barricade position, then prepares to reengage the threat again. What does the curriculum specifically recommend regarding re-emerging from cover?",
choices:{A:"Always emerge from the exact same spot for consistency and predictability every time",B:"Emerge from a different part of cover than where the officer arrived, rather than coming out the same way they went in",C:"Always emerge fully exposed for maximum visibility to a supervisor observing",D:"Wait exactly 10 seconds between exposures"},
correct:"B",
explanation:"The curriculum specifically recommends emerging from a different part of cover than the point of arrival - not coming out the same way you went in - since a predictable re-emergence point could be anticipated and exploited by the threat.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 4)",sourceType:"textbook"},

{id:"CO040-037",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Tactical Reload",difficulty:"applied",type:"scenario",
stem:"During a lull in an armed confrontation, an officer performs a tactical reload while still having some ammunition remaining in their current magazine. What is the purpose of this technique?",
choices:{A:"To dispose of ammunition that is no longer needed once a magazine is only partially depleted during a lull",B:"To reload when the officer wants to, rather than when forced to by an empty firearm, avoiding having an empty weapon during a deadly force encounter",C:"To practice reloading skills during a low-stress moment between scheduled qualification courses",D:"To switch to a different caliber of ammunition mid-engagement without changing firearms or reholstering at all during the encounter"},
correct:"B",
explanation:"A tactical reload is performed during a lull in engagement specifically so the officer can reload on their own terms rather than being forced to reload with an empty firearm at a critical moment - the partially loaded magazine is kept, not discarded, and stored separately to avoid confusion with fully loaded magazines.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 4)",sourceType:"textbook"},

{id:"CO040-038",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Support-Hand Only Skills",difficulty:"applied",type:"scenario",
stem:"Why does the curriculum emphasize practicing drawing and firing with the support hand only?",
choices:{A:"It is purely a backup skill with no realistic application outside of qualification day",B:"An officer's primary hand may be injured or taken out of action during a deadly force encounter, since attackers tend to target the gun hand",C:"It is only relevant for left-handed officers, since right-handed officers rarely need to use their support hand",D:"It replaces the need to practice with the primary hand at all once proficient"},
correct:"B",
explanation:"The curriculum specifically notes that attackers tend to shoot for the gun, meaning an officer's primary hand and arm could be disabled during a gunfight - practicing support-hand-only drawing and firing prepares officers for this realistic possibility.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 2 (Unit 4)",sourceType:"textbook"},

{id:"CO040-039",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Survival Stress - Complex Motor Skills",difficulty:"higher",type:"scenario",
stem:"Under extreme survival stress, an officer struggles to shoot accurately while moving and reloading at the same time, even though each individual task is not difficult alone. What is this an example of?",

// ---------- Utility ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Human-readable chapter label for a subject code, safe to show anywhere in the UI
// (never expose the raw "CJK ####" code to the user). Distinguishes the two books
// with an "HL" prefix, since both books have their own Chapter 2/3/4.
function chapterLabel(code){
  const meta = SUBJECT_META[code];
  if(!meta) return SUBJECT_LABELS[code] || code;
  const prefix = meta.book === "highliability" ? "HL Ch." : "Ch.";
  return `${prefix} ${meta.ch}: ${SUBJECT_LABELS[code]}`;
}

// The real FDLE Corrections SOCE is a 200-question sitting (210 minutes under the formula below).
const STATE_EXAM_COUNT = 200;

// State exam time allowance: ~1.05 min/question, with a 15-minute floor for short quizzes.
// Matches the published references (10 q -> 15:00 via the floor, 200 q -> 210:00).
function timeLimitSec(count){ return Math.max(15, Math.ceil(count * 1.05)) * 60; }
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ":" + String(s).padStart(2,"0");
}

function prepareInstance(q){
  const entries = shuffle(Object.entries(q.choices));
  const letters = ["A","B","C","D"];
  const choices = {};
  let correct = "A";
  entries.forEach((e,i)=>{ choices[letters[i]] = e[1]; if(e[0]===q.correct) correct = letters[i]; });
  return Object.assign({}, q, {choices, correct, bankId:q.id});
}

// Guests get real persistence too (localStorage), just scoped to this browser
// instead of synced to an account across devices.
const GUEST_KEY = "fdle_soce_guest_attempts";
function getGuestAttempts(){
  try { return JSON.parse(localStorage.getItem(GUEST_KEY) || "[]"); }
  catch(e){ return []; }
}
function setGuestAttempts(attempts){
  try { localStorage.setItem(GUEST_KEY, JSON.stringify(attempts)); }
  catch(e){ /* best effort -- e.g. private browsing with storage disabled */ }
}

async function loadAttempts(){
  if(!state.user) return getGuestAttempts();
  try{
    const { data, error } = await sb.from("progress")
      .select("attempts").eq("user_id", state.user.id).maybeSingle();
    if(error) throw error;
    return data ? data.attempts : [];
  }catch(e){ return []; }
}

// Runs once, right after a guest signs in or creates an account, so practice
// history recorded before authenticating isn't lost.
async function mergeGuestIntoAccount(){
  const guest = getGuestAttempts();
  if(guest.length === 0) return loadAttempts();
  const cloud = await loadAttempts();
  const seen = new Set(cloud.map(a=>a.examId));
  const merged = cloud.concat(guest.filter(a=>!seen.has(a.examId)))
    .sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  await saveAttempts(merged);
  setGuestAttempts([]);
  return merged;
}

async function saveAttempts(attempts){
  const trimmed = attempts.slice(-40);
  if(!state.user){ setGuestAttempts(trimmed); return; }
  try{
    await sb.from("progress").upsert({
      user_id: state.user.id, attempts: trimmed, updated_at: new Date().toISOString()
    });
  }catch(e){ /* best effort */ }
}

async function submitAuth(isSignup){
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if(!email || !password){
    state.authError = "Enter both an email and a password.";
    render();
    return;
  }
  state.authBusy = true;
  state.authError = null;
  state.authNotice = null;
  render();
  try{
    const { data, error } = isSignup
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    if(isSignup && !data.session){
      // Email confirmation is required before the account can sign in.
      state.authBusy = false;
      state.authScreen = "login";
      state.authNotice = "Account created. Check your email to confirm your address, then log in below.";
      render();
      return;
    }
    // A successful sign-in fires onAuthStateChange below, which takes it from here.
  }catch(e){
    state.authBusy = false;
    state.authError = e.message || "Something went wrong. Please try again.";
    render();
  }
}

async function signOut(){
  await sb.auth.signOut();
}

function el(tag, opts, children){
  const e = document.createElement(tag);
  if(opts){
    Object.entries(opts).forEach(([k,v])=>{
      if(k==="class") e.className = v;
      else if(k==="html") e.innerHTML = v;
      else if(k.startsWith("on")){ if(v) e.addEventListener(k.slice(2), v); }
      else if(k==="disabled" || k==="checked" || k==="selected" || k==="readOnly"){ e[k] = !!v; }
      else e.setAttribute(k,v);
    });
  }
  (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}

function scrollToTop(){
  try { window.scrollTo(0, 0); } catch(e){}

}

// Move to another question and reset the viewport to the top so long
// question/answer blocks don't leave the reader scrolled down.
function navigateQuestion(delta){
  const exam = state.currentExam;
  if(!exam) return;
  exam.idx = Math.max(0, Math.min(exam.questions.length-1, exam.idx + delta));
  render();
  scrollToTop();
}

function subjectCount(code){ return QUESTION_BANK.filter(q=>q.subject===code).length; }

// Book-grouped chapter picker, shared by Quick Quiz and Full Exam setup.
function renderScopePicker(){
  const row = el("div",{class:"setup-row"});
  row.appendChild(el("label",{},["Books & chapters to draw from"]));
  BOOKS.forEach(book=>{
    const chapters = book.chapters.filter(code=>subjectCount(code)>0);
    if(chapters.length===0) return;
    const selCount = chapters.filter(code=>state.setupSubjects.has(code)).length;
    const block = el("div",{class:"scope-book"});

    const head = el("div",{class:"subject-check scope-book-head"});
    const bookCb = el("input",{type:"checkbox"});
    bookCb.checked = selCount === chapters.length;
    bookCb.indeterminate = selCount > 0 && selCount < chapters.length;
    bookCb.addEventListener("change",()=>{
      if(bookCb.checked) chapters.forEach(c=>state.setupSubjects.add(c));
      else chapters.forEach(c=>state.setupSubjects.delete(c));
      render();
    });
    head.appendChild(bookCb);
    head.appendChild(el("span",{},[`Whole book \u2014 ${book.title}`]));
    const totalAvail = chapters.reduce((s,c)=>s+subjectCount(c),0);
    head.appendChild(el("span",{class:"subject-count"},[`${totalAvail} available`]));
    block.appendChild(head);

    chapters.forEach(code=>{
      const meta = SUBJECT_META[code];
      const rowc = el("div",{class:"subject-check scope-chapter"});
      const cb = el("input",{type:"checkbox"});
      cb.checked = state.setupSubjects.has(code);
      cb.addEventListener("change",()=>{
        if(cb.checked) state.setupSubjects.add(code); else state.setupSubjects.delete(code);
        render();
      });
      rowc.appendChild(cb);
      rowc.appendChild(el("span",{},[`Ch. ${meta.ch} \u2014 ${SUBJECT_LABELS[code]}`]));
      rowc.appendChild(el("span",{class:"subject-count"},[`${subjectCount(code)} available`]));
      block.appendChild(rowc);
    });
    row.appendChild(block);
  });
  return row;
}

function projectedQuestionCount(mode, filteredCount){
  if(mode === "full") return filteredCount;
  if(mode === "exam") return Math.min(STATE_EXAM_COUNT, filteredCount);
  return Math.min(state.setupCount, filteredCount);

function pickExamPool(mode){
  let pool = QUESTION_BANK.filter(q=>state.setupSubjects.has(q.subject));
  // exclude questions seen in the most recent 2 attempts, if enough remain
  const recentIds = new Set();
  state.attempts.slice(-2).forEach(a=>{ (a.questionIds||[]).forEach(id=>recentIds.add(id)); });
  const target = projectedQuestionCount(mode, pool.length);
  const fresh = pool.filter(q=>!recentIds.has(q.id));
  let finalPool;
  let reused = false;
  if(fresh.length >= target){
    finalPool = fresh;
  } else {
    finalPool = pool;
    reused = true;
  }
  const chosen = shuffle(finalPool).slice(0, target);
  return {chosen, reused};
}

function startExam(mode){
  const {chosen, reused} = pickExamPool(mode);
  if(chosen.length === 0){
    alert("No questions available for the selected chapters yet.");
    return;
  }
  const questions = shuffle(chosen).map(prepareInstance);
  stopTimer();
  const timed = !!state.setupTimed;
  const limitSec = timeLimitSec(questions.length);
  const startedTs = Date.now();
  state.currentExam = {
    mode, questions, answers:{}, idx:0, reusedWarning:reused, submitted:{},
    timed, limitSec, startedTs,
    deadlineTs: startedTs + limitSec*1000,
    warned: false,
    scopeChapters: [...state.setupSubjects],
    scopeBooks: BOOKS.filter(b=>b.chapters.some(c=>state.setupSubjects.has(c))).map(b=>b.id)
  };
  state.screen = "quiz";
  render();
  scrollToTop();
  if(timed){ timerHandle = setInterval(tickTimer, 1000); tickTimer(); }
}

function tickTimer(){
  const exam = state.currentExam;
  if(!exam || !exam.timed || state.screen !== "quiz"){ stopTimer(); return; }
  const remaining = Math.round((exam.deadlineTs - Date.now())/1000);
  const node = document.getElementById("quiz-timer");
  if(node){
    node.textContent = fmtClock(remaining);
    node.classList.toggle("warn", remaining <= 300 && remaining > 60);
    node.classList.toggle("danger", remaining <= 60);
  }
  if(remaining <= 60 && !exam.warned){
    exam.warned = true;
    const banner = document.getElementById("timer-banner");
    if(banner) banner.hidden = false;
  }
  if(remaining <= 0){
    stopTimer();
    finishExam();
  }
}

function renderQuiz(){
  const exam = state.currentExam;

  const q = exam.questions[exam.idx];
  const total = exam.questions.length;

  if(exam.timed){
    const remaining = Math.round((exam.deadlineTs - Date.now())/1000);
    const timerCls = "quiz-timer" + (remaining <= 60 ? " danger" : (remaining <= 300 ? " warn" : ""));
    const timerBar = el("div",{class:"quiz-timer-bar"},[

    banner.hidden = !exam.warned;
    wrap.appendChild(banner);
  }

  const track = el("div",{class:"progress-track"},[el("div",{class:"progress-fill",style:`width:${((exam.idx+1)/total*100).toFixed(1)}%`})]);
  wrap.appendChild(track);

  meta.appendChild(el("span",{},[`Question ${exam.idx+1} of ${total}`]));
  meta.appendChild(el("span",{},[`${chapterLabel(q.subject)} \u00b7 ${q.subtopic}`]));
  card.appendChild(meta);

  card.appendChild(el("p",{class:"qstem"},[q.stem]));

  const answered = exam.submitted[q.bankId+"_"+exam.idx];
  const selected = exam.answers[exam.idx];

  ["A","B","C","D"].forEach(letter=>{
    const isSelected = selected === letter;
    let cls = "choice";
    if(answered){
      if(letter === q.correct) cls += " correct";
      else if(isSelected && letter !== q.correct) cls += " incorrect";
    } else if(isSelected){
      cls += " selected";
    }
    const choiceEl = el("div",{class:cls, onclick: answered ? null : ()=>{ exam.answers[exam.idx]=letter; render(); }},[
      el("span",{class:"choice-letter"},[letter]),
      el("span",{},[q.choices[letter]])
    ]);
    card.appendChild(choiceEl);
  });

  if(!answered){
    const submitBtn = el("button",{class:"btn btn-gold",disabled: !selected, onclick:()=>{
      if(!exam.answers[exam.idx]) return;
      exam.submitted[q.bankId+"_"+exam.idx] = true;
      render();
    }},["Submit Answer"]);
    card.appendChild(el("div",{style:"margin-top:16px;"},[submitBtn]));
  } else {
    const correctBool = exam.answers[exam.idx] === q.correct;
    const box = el("div",{class:"explain-box"});
    box.appendChild(el("div",{class:"verdict "+(correctBool?"correct":"incorrect")},[correctBool ? "Correct." : `Not quite. The correct answer is ${q.correct}.`]));
    box.appendChild(el("div",{},[q.explanation]));
    box.appendChild(el("div",{class:"source-tag"},[`Source: ${q.source}`]));
    card.appendChild(box);
  }

  wrap.appendChild(card);

  const navRow = el("div",{class:"nav-row"});
  const prevBtn = el("button",{class:"btn btn-outline btn-sm",disabled: exam.idx===0, onclick:()=>navigateQuestion(-1)},["\u2190 Previous"]);
  navRow.appendChild(prevBtn);

  if(exam.idx < total-1){
    const nextBtn = el("button",{class:"btn btn-sm",disabled: !answered, onclick:()=>navigateQuestion(1)},["Next \u2192"]);
    navRow.appendChild(nextBtn);
  } else {
    const finishBtn = el("button",{class:"btn btn-gold btn-sm",disabled: !answered, onclick:finishExam},["Finish & See Results"]);
    navRow.appendChild(finishBtn);
  }
  wrap.appendChild(navRow);
  return wrap;
}

async function finishExam(){
  stopTimer();
  const exam = state.currentExam;
  if(!exam) return;
  state.currentExam = null; // guard against a double finish (timer expiry + manual click)
  const results = exam.questions.map((q,i)=>({
    id:q.bankId, subject:q.subject, subjectName:q.subjectName, subtopic:q.subtopic,
    difficulty:q.difficulty, type:q.type, correctAnswer: exam.answers[i]===q.correct
  }));
  const correctCount = results.filter(r=>r.correctAnswer).length;
  const total = results.length;
  const scoredCount = Math.min(190, total); // will matter once bank supports full 200
  const rawPct = Math.round((correctCount/total)*1000)/10;

  const attempt = {
    examId: "EX-"+Date.now(),
    timestamp: new Date().toISOString(),
    mode: exam.mode,
    total, correctCount, rawPct,
    questionIds: exam.questions.map(q=>q.bankId),
    timed: !!exam.timed,
    limitSec: exam.timed ? exam.limitSec : null,
    elapsedSec: exam.timed ? Math.min(exam.limitSec, Math.round((Date.now()-exam.startedTs)/1000)) : null,
    timedOut: exam.timed ? (Date.now() >= exam.deadlineTs) : false,
    scopeBooks: exam.scopeBooks || null,
    scopeChapters: exam.scopeChapters || null,
    results
  };
  state.attempts.push(attempt);
  await saveAttempts(state.attempts);
  state.lastResult = attempt;
  state.currentExam = null;
  state.screen = "results";
  render();
  scrollToTop();
}

// ---------- FEEDBACK ----------
function buildFeedbackContext(r){
  const parts = [];
  if(r){
    const bySubj = {};
    r.results.forEach(res=>{
      if(!bySubj[res.subject]) bySubj[res.subject] = {c:0,t:0};
      bySubj[res.subject].t++;
      if(res.correctAnswer) bySubj[res.subject].c++;
    });
    const subjStr = Object.entries(bySubj).map(([k,d])=>`${k} ${d.c}/${d.t}`).join(", ");
    parts.push(`session=${r.mode}`);
    parts.push(`score=${r.correctCount}/${r.total} (${r.rawPct}%)`);
    parts.push(`subjects=[${subjStr}]`);
    parts.push(`questionIds=${(r.questionIds||[]).join(" ")}`);
    parts.push(`scope=${(r.scopeBooks||[]).join("+")||"all"} [${(r.scopeChapters||[]).join(",")}]`);
    parts.push(`timed=${r.timed ? (fmtClock(r.elapsedSec)+"/"+fmtClock(r.limitSec)+(r.timedOut?" (timed out)":"")) : "no"}`);
    parts.push(`sessionTime=${r.timestamp}`);
  } else {
    parts.push("session=none");
  }
  parts.push(`submittedAt=${new Date().toISOString()}`);
  try { parts.push(`page=${location.href}`); } catch(e){}
  try { parts.push(`ua=${navigator.userAgent}`); } catch(e){}
  return parts.join("\n");
}

function encodeForm(data){
  return Object.keys(data).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(data[k])).join("&");
}

  const emailField = el("div",{class:"fb-field"});

    const msg = msgInput.value.trim();
    if(!selectedType){ status.textContent = "Please pick a feedback type above."; status.className = "fb-status err"; return; }

    const email = emailInput.value.trim();

function startRemediation(repeatedMisses){
  const subjects = new Set(repeatedMisses.map(([k])=>k.split("|||")[0]));
  let pool = QUESTION_BANK.filter(q=>subjects.has(q.subject));
  // avoid exact previously-missed questions where alternates exist within the same subject
  const missedIds = new Set();
  state.attempts.forEach(a=>a.results.forEach(r=>{ if(!r.correctAnswer) missedIds.add(r.id); }));
  const altPool = pool.filter(q=>!missedIds.has(q.id));
  const finalPool = altPool.length >= 8 ? altPool : pool;
  const count = Math.min(25, finalPool.length);
  const chosen = shuffle(finalPool).slice(0,count).map(prepareInstance);
  stopTimer();
  state.currentExam = { mode:"remediation", questions: chosen, answers:{}, idx:0, submitted:{}, timed:false };
  state.screen = "quiz";
  render();
  scrollToTop();
}

// ---------- INIT ----------
(async function init(){
  try{
    const { data: { session } } = await sb.auth.getSession();
    state.user = session ? session.user : null;
    state.attempts = await loadAttempts();
    state.loadingAttempts = false;
    render();

    sb.auth.onAuthStateChange(async (event, session)=>{
      if(event === "SIGNED_IN"){
        const wasGuest = !state.user;
        state.user = session.user;
        state.authScreen = null;
        state.authBusy = false;
        render();
        state.attempts = wasGuest ? await mergeGuestIntoAccount() : await loadAttempts();
        render();
      } else if(event === "SIGNED_OUT"){
        state.user = null;
        state.attempts = await loadAttempts();
        state.screen = "home";
        render();
      }
    });
  } catch(e){
    const root = document.getElementById("root");
    root.innerHTML = "";
    root.appendChild(el("div",{class:"card"},[
      el("h2",{},["Something went wrong loading the practice exam"]),
      el("p",{},["The page hit an unexpected error while starting up. Reloading the page usually fixes this. If it keeps happening, please share this message:"]),
      el("pre",{style:"white-space:pre-wrap;font-size:12px;background:#FAF8F2;padding:10px;border:1px solid #DEDACF;"},[String(e && (e.stack||e.message)||e)])
    ]));
  }
})();
</script>

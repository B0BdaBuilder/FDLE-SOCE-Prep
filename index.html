source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO040-005",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Safe Storage Law",difficulty:"higher",type:"scenario",
stem:"Under Section 790.174, F.S., an officer who stores a loaded firearm at home where they know or should know a minor is likely to gain access without lawful permission must:",
choices:{A:"Simply keep the firearm in a closet, as long as the closet door is generally kept shut most of the time when a minor is present",B:"Keep the firearm in a securely locked box or container, in a location a reasonable person would believe to be secure, or secure it with a trigger lock (unless carried on the person)",C:"Only store ammunition separately, with no requirement for the firearm itself to be locked, boxed, or trigger-locked in any way at all inside the home",D:"This statute only applies to firearms dealers, not individual officers storing a personal weapon at their own home"},
correct:"B",
explanation:"Section 790.174, F.S. requires a person to secure a loaded firearm in a locked box or container, a location reasonably believed to be secure, or with a trigger lock, when they know or should know a minor is likely to gain unauthorized access - unless the firearm is being carried on the person.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 1), citing s. 790.174, F.S.",sourceType:"statute"},

{id:"CO040-006",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Use of Force Statute",difficulty:"foundational",type:"recall",
stem:"Section 776.05, F.S. identifies two general areas in which an officer's use of force is justified. What are they?",
choices:{A:"To apprehend a subject and make an arrest, or to defend oneself or others",B:"To punish a subject and deter future crime",C:"To search a vehicle and to search a residence, without any other listed purpose",D:"To collect evidence and to interview witnesses, without any other listed purpose"},
correct:"A",
explanation:"Section 776.05, F.S. justifies an officer's use of force in two general contexts: making a lawful arrest of a resisting subject, or defending oneself or others from bodily harm.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 2 (Unit 1), citing s. 776.05, F.S.",sourceType:"statute"},

{id:"CO040-007",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Deadly Force",difficulty:"applied",type:"scenario",
stem:"An officer fires their duty weapon at a fleeing subject but misses entirely, causing no injury. How is this act classified under Florida law?",
choices:{A:"It is not deadly force since no one was harmed and the round missed its target entirely and completely",B:"It is considered deadly force because the act of firing a firearm in the direction of a person meets the statutory definition, regardless of whether harm occurs",C:"It is automatically classified as less-lethal force, since no injury or death resulted at all",D:"It cannot be classified until an internal investigation determines the officer's intent behind firing the weapon in question"},
correct:"B",
explanation:"Under s. 776.06, F.S., firing a firearm in the direction of a person to be arrested is defined as deadly force even if there is no intent to kill and no actual injury results - the act itself meets the statutory threshold.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 2 (Unit 1), citing s. 776.06, F.S.",sourceType:"statute"},

{id:"CO040-008",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Ammunition Nomenclature",difficulty:"foundational",type:"recall",
stem:"Which part of a cartridge ignites the propellant when struck?",
choices:{A:"The case",B:"The headstamp",C:"The primer",D:"The rim"},
correct:"C",
explanation:"The primer is the mixture used to ignite the propellant (powder) when struck by the firing pin, which then produces the gas that propels the bullet.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO040-009",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Caliber vs. Gauge",difficulty:"foundational",type:"recall",
stem:"What is the key difference between caliber and gauge?",
choices:{A:"Caliber measures shotgun bores in thousandths of an inch; gauge measures pistol bores using that identical numbering system",B:"Caliber is a measurement of bore diameter used to identify cartridge/projectile size; gauge is a measurement of shotgun bores based on the number of bore-sized lead balls per pound",C:"They are interchangeable terms for the same bore-diameter measurement across every firearm type and every ammunition manufacturer worldwide",D:"Caliber only applies to rifles, and gauge only applies to handguns, regardless of the ammunition or firearm type actually used"},
correct:"B",
explanation:"Caliber measures the diameter of a firearm's bore to identify the correct cartridge and projectile size, while gauge is a distinct measurement specific to shotguns, derived from the number of bore-sized lead balls per pound.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO040-010",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Ammunition Defects",difficulty:"applied",type:"scenario",
stem:"During an ammunition inspection, an officer notices a cartridge case has a layer of oxidation and mold-like buildup on its surface. This defect is called:",
choices:{A:"A scrape",B:"A dent",C:"Corrosion",D:"A puncture"},
correct:"C",
explanation:"Corrosion is defined as a layering of the case with oxidation or foreign material such as mold, fungi, congealed oil, or lubricants - distinct from a scrape (scratched/torn case wall), a dent (a depression), or a puncture (an actual opening in the case).",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO040-011",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Ammunition Handling",difficulty:"foundational",type:"recall",
stem:"Why should an officer avoid placing ammunition in the radio holder of a patrol vehicle?",
choices:{A:"It may scratch the radio equipment",B:"Ammunition that comes into contact with an electrical impulse may discharge",C:"It is only a policy preference with no safety basis",D:"The radio holder is reserved exclusively for spare magazines"},
correct:"B",
explanation:"The curriculum specifically warns that ammunition exposed to an electrical impulse, such as inside a radio holder, may discharge - this is a genuine safety hazard, not just a storage inconvenience.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO040-012",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Duty Ammunition",difficulty:"applied",type:"recall",
stem:"Why does the curriculum advise against using reloaded ammunition for duty use?",
choices:{A:"Reloads are always more expensive than factory ammunition, regardless of the components used",B:"Reloads use previously fired brass and are not as reliable as new ammunition, and their use may void firearm warranties",C:"Reloads are illegal to possess in Florida under any circumstance",D:"Reloads cannot be fired from semiautomatic pistols"},
correct:"B",
explanation:"Reloaded ammunition uses previously fired brass cases and is considered less reliable than new factory ammunition for duty use, and using reloads may also void the warranties of many firearms.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 2)",sourceType:"textbook"},

// ============ CJK 0051 - CRIMINAL JUSTICE DEFENSIVE TACTICS ============
{id:"CO051-001",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Deadly Force Triad",difficulty:"higher",type:"scenario",
stem:"An inmate is armed with a shank and is standing at the far end of a large dayroom, verbally threatening an officer but making no move to close the distance. Which element of the deadly force triad is most clearly absent?",
choices:{A:"Ability",B:"Opportunity",C:"Intent",D:"Totality of circumstances"},
correct:"B",
explanation:"Opportunity requires that the subject be positioned close enough to actually deploy their weapon against a target. Even though the inmate has the ability (a weapon) and may be expressing intent, the distance means the opportunity element is not yet satisfied - all three elements must be present simultaneously to justify deadly force.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Legal Foundations)",sourceType:"textbook"},

{id:"CO051-002",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Resistance Spectrum",difficulty:"applied",type:"scenario",
stem:"An inmate refuses a lawful order to return to their cell and goes completely limp, forcing officers to physically carry them, but does not strike or grab at anyone. This behavior is best classified as:",
choices:{A:"Passive resistance",B:"Active resistance",C:"Aggressive resistance",D:"Deadly force resistance"},
correct:"A",
explanation:"Passive resistance includes verbal refusal or going completely limp ('dead weight') in response to a lawful command, without any active structural counter-force or physical attack - distinct from active resistance, which involves counter-movements to evade control.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Subject Resistance Spectrum)",sourceType:"textbook"},

{id:"CO051-003",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Resistance Spectrum",difficulty:"applied",type:"scenario",
stem:"An inmate braces both hands against a cell door frame and pulls their arm away to avoid being handcuffed, but does not strike the officer. This is best classified as:",
choices:{A:"Passive resistance",B:"Active resistance",C:"Aggressive resistance",D:"Deadly force resistance"},
correct:"B",
explanation:"Active resistance involves physical counter-movements used to evade control or pull away from an officer's grip - such as bracing or anchoring limbs - but is not itself a strike or attack directed at the officer, which would instead be aggressive resistance.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Subject Resistance Spectrum)",sourceType:"textbook"},

{id:"CO051-004",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Threat Awareness Levels",difficulty:"applied",type:"scenario",
stem:"An officer walking through a housing unit is scanning the room, noting which inmates are gathered where, and observing the general mood of the facility, without a specific threat identified yet. This describes which awareness level?",
choices:{A:"Condition White",B:"Condition Yellow",C:"Condition Orange",D:"Condition Red"},
correct:"B",
explanation:"Condition Yellow describes a continuous state of relaxed awareness - actively scanning the environment and noting potential hazards before they escalate - as opposed to Condition White (unaware/distracted) or Condition Orange (a specific identified threat).",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Threat Awareness Levels)",sourceType:"textbook"},

{id:"CO051-005",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Threat Awareness Levels",difficulty:"foundational",type:"recall",
stem:"Which threat awareness condition describes an officer who is completely unaware of their surroundings, such as being distracted or daydreaming - a state considered extremely dangerous inside a correctional facility?",
choices:{A:"Condition White",B:"Condition Yellow",C:"Condition Orange",D:"Condition Black"},
correct:"A",
explanation:"Condition White describes complete unawareness of surroundings, such as daydreaming or being distracted, and is considered extremely dangerous in a correctional environment where threats can emerge quickly.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Threat Awareness Levels)",sourceType:"textbook"},

{id:"CO051-006",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Reactionary Gap",difficulty:"applied",type:"scenario",
stem:"An officer is speaking with an inmate whose hands are concealed inside a bulky jacket. Based on the reactionary gap principle, what is the recommended minimum safety distance in this situation?",
choices:{A:"6-9 feet, the same as if hands were visible",B:"25 feet, because concealed hands require a greater safety margin",C:"There is no distance requirement if the inmate is calm",D:"1-2 feet, to allow for physical control"},
correct:"B",
explanation:"The reactionary gap principle calls for a minimum 25-foot safety margin when an inmate's hands are concealed or tucked inside clothing, compared to the smaller 6-9 foot minimum distance recommended when hands are fully visible and clear.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Tactical Concepts and Positioning)",sourceType:"textbook"},

{id:"CO051-007",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Relative Positioning",difficulty:"applied",type:"recall",
stem:"Which positioning level, using the 12-hour clock face model, is tactically preferred for applying physical control or handcuffing an inmate?",
choices:{A:"Inside position (frontal)",B:"Level 1 (front left/right angle)",C:"Level 2 (directly to the side)",D:"Level 3 (directly behind)"},
correct:"D",
explanation:"Level 3 positioning, directly behind the subject, is identified as the tactically preferred position specifically for physical control or handcuffing, as it limits the subject's ability to see and react to the officer's movements.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Tactical Concepts and Positioning)",sourceType:"textbook"},

{id:"CO051-008",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Compliance Modalities",difficulty:"applied",type:"scenario",
stem:"An officer applies handcuffs to freeze an inmate's wrist joints and stop independent movement, using a rigid tool rather than pressure to a nerve point. This is an example of:",
choices:{A:"Pain compliance",B:"Mechanical compliance",C:"Verbal compliance",D:"Passive compliance"},
correct:"B",
explanation:"Mechanical compliance uses rigid tools - such as handcuffs, leg irons, or belly chains - to isolate and freeze structural joints and stop independent movement, as opposed to pain compliance, which uses pressure applied to nerve points or joint locks.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Tactical Concepts and Positioning)",sourceType:"textbook"},

{id:"CO051-009",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Survival Stress Response",difficulty:"higher",type:"scenario",
stem:"During a high-stress physical confrontation, an officer finds it very difficult to precisely thread a small handcuff key into the lock, despite being able to easily perform a hard strike. What best explains this?",
choices:{A:"The officer is simply not well trained and needs additional fine-motor-skill practice under low-stress, controlled range conditions",B:"Fine motor skills, such as precise key or trigger manipulation, degrade significantly under Sympathetic Nervous System activation, while gross motor skills like striking are enhanced",C:"This indicates the officer is experiencing Condition Black, a total breakdown of decision-making and awareness under extreme stress",D:"This is unrelated to stress and is purely a mechanical issue with the handcuff lock alone, unrelated to the officer's own physiology or training"},
correct:"B",
explanation:"Under SNS ('fight or flight') activation, gross motor skills such as running or striking are enhanced, while fine motor skills requiring precise, small muscle movements - like threading a key or reloading - drop drastically, which is a well-documented physiological effect of survival stress, not a training failure by itself.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Physiological Survival Stress Responses)",sourceType:"textbook"},

{id:"CO051-010",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Ground Mechanics",difficulty:"foundational",type:"recall",
stem:"Which term describes using an arm or leg to support the body's weight and maintain balance after being knocked to the floor, creating a platform to return to standing?",
choices:{A:"Sprawling",B:"Posting",C:"Shrimping",D:"Pummeling"},
correct:"B",
explanation:"Posting refers to using an arm or leg to support body weight after being knocked down, creating a stable platform to transition safely back to a standing position.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Physical Mechanics)",sourceType:"textbook"},

{id:"CO051-011",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Ground Mechanics",difficulty:"foundational",type:"recall",
stem:"An officer drops their hips and drives them into the floor while throwing their legs backward to stop a rushing inmate from completing a takedown. This technique is called:",
choices:{A:"Posting",B:"Shrimping",C:"Sprawling",D:"Pummeling"},
correct:"C",
explanation:"Sprawling is the technique of dropping the hips and driving them into the floor while throwing the legs back, specifically used to prevent a rushing inmate from securing a takedown.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Physical Mechanics)",sourceType:"textbook"},

{id:"CO051-012",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Search Definitions",difficulty:"foundational",type:"recall",
stem:"Which type of search involves a highly regulated, visual search of an inmate's unclothed body, excluding physical body cavities unless performed by medical staff?",
choices:{A:"Pat down search",B:"Custodial/strip search",C:"Clothed search",D:"Metal detection search"},
correct:"B",
explanation:"A custodial/strip search is a highly regulated visual search of an inmate's stripped body, specifically excluding physical cavity searches, which are reserved for medical staff only.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Facility Definitions)",sourceType:"textbook"},

{id:"CO051-013",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Chemical Agents",difficulty:"foundational",type:"recall",
stem:"Oleoresin Capsicum (OC) spray, derived from cayenne peppers, primarily causes which effect?",
choices:{A:"Loss of consciousness lasting several minutes after exposure to the spray",B:"Involuntary eye closure, burning sensation, and respiratory inflammation",C:"Permanent skin discoloration at the point of contact with the spray",D:"Temporary paralysis"},
correct:"B",
explanation:"OC spray is an inflammatory agent that causes immediate involuntary eye closure, a burning sensation, and respiratory inflammation, but it is not designed to cause unconsciousness or paralysis.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Facility Definitions and Chemical Standards)",sourceType:"textbook"},

{id:"CO051-014",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Chemical Agents",difficulty:"foundational",type:"recall",
stem:"CS gas is classified as which type of chemical agent?",
choices:{A:"A sedative",B:"An irritant (tear gas)",C:"A paralytic agent",D:"A stimulant"},
correct:"B",
explanation:"CS gas (orthochlorobenzalmalononitrile) is classified as an irritant, or tear gas, causing severe tearing, coughing, and stinging on moist skin surfaces.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Facility Definitions and Chemical Standards)",sourceType:"textbook"},

{id:"CO051-015",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Totality of Circumstances",difficulty:"applied",type:"scenario",
stem:"A single officer of average build must physically control three larger, aggressive inmates with a known history of violence. When evaluating whether the officer's use of force was reasonable, which concept requires this imbalance to be considered?",
choices:{A:"Objective reasonableness only, without considering any other listed factor from the curriculum",B:"Totality of circumstances, which includes physical mismatch and the number of inmates versus officers",C:"The deadly force triad exclusively, to the exclusion of any other consideration",D:"Procedural justice"},
correct:"B",
explanation:"Totality of circumstances calls for a holistic review that includes physical mismatch between officer and inmate(s), the ratio of inmates to officers, and known inmate history - all of which are relevant to whether a given level of force was reasonable.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Legal Foundations)",sourceType:"textbook"},

{id:"CO051-016",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Statutory Authority",difficulty:"higher",type:"recall",
stem:"Which statute specifically governs the use of force authority, restrictions, and statutory responsibilities for state correctional officers and correctional probation officers, as distinct from the broader statute covering all criminal justice law enforcement use of force?",
choices:{A:"Chapter 776, F.S.",B:"Chapter 944, F.S.",C:"Chapter 943, F.S.",D:"Chapter 951, F.S."},
correct:"B",
explanation:"While Chapter 776, F.S. regulates use-of-force applications across all criminal justice officers broadly, Chapter 944, F.S. specifically governs the use-of-force authority, restrictions, and statutory responsibilities unique to state correctional officers and correctional probation officers.",
source:"High Liability, Vol. 2, Ch. 4 (Defensive Tactics Study Guide, Legal Foundations)",sourceType:"textbook"},

// ============ CJK 0306 - COMMUNICATION FOR CORRECTIONAL OFFICERS ============
{id:"CO306-001",subject:"CJK 0306",subjectName:"Communication",subtopic:"Elements of Communication",difficulty:"foundational",type:"recall",
stem:"Which of the following correctly lists the steps in the communication process taught in the curriculum?",
choices:{A:"Construct the message, convey it to the intended person or group, allow time for it to be received and understood, and gauge the response",B:"Speak first, listen second, and document third, repeated identically for every single interaction",C:"Interview, interrogate, and report, in that exact fixed order for every exchange",D:"Observe, assume, and act, relying on the officer's initial impression of the situation"},
correct:"A",
explanation:"The curriculum defines the communication process as constructing the message, conveying it in an appropriate format, allowing time for the receiver to understand it, and then gauging whether an appropriate response or behavior change occurred.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO306-002",subject:"CJK 0306",subjectName:"Communication",subtopic:"Empathy vs. Sympathy",difficulty:"higher",type:"scenario",
stem:"An officer must inform an inmate of a death in their family. The curriculum recommends using empathy rather than sympathy in this moment. Why?",
choices:{A:"Empathy and sympathy are the same thing, so the distinction the curriculum draws between them does not matter in practice",B:"Sympathy engages emotions in a way that risks compromising the officer's authority, while empathy allows the officer to connect with the inmate without becoming overly emotionally involved",C:"Sympathy is only appropriate for law enforcement officers, not correctional officers, according to the curriculum's specific guidance on the topic",D:"Empathy is prohibited under PREA standards when informing an inmate of a family death or any other personal tragedy"},
correct:"B",
explanation:"The curriculum distinguishes empathy - understanding and caring about another's emotions while remaining professionally grounded - from sympathy, which engages the officer's own emotions and creates a risk of compromising their authority or objectivity.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO306-003",subject:"CJK 0306",subjectName:"Communication",subtopic:"Active Listening - Safety",difficulty:"higher",type:"scenario",
stem:"During a conversation, an inmate uses the words 'kill,' 'getting out,' and 'hang' within a short span. Per the curriculum's active listening guidance, these specific words should:",
choices:{A:"Be ignored unless the inmate raises their voice while speaking",B:"Alert the officer as key words requiring closer attention, since active listening specifically flags such terms",C:"Only matter if said during a formal, scheduled interview",D:"Automatically require the inmate be placed in disciplinary confinement"},
correct:"B",
explanation:"The curriculum specifically lists identifying key words such as 'kill,' 'suicide,' 'getting out,' and 'hang' as an element of active listening, since these terms can be significant safety indicators that warrant closer attention and possible follow-up.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO306-004",subject:"CJK 0306",subjectName:"Communication",subtopic:"Trauma-Informed Approach",difficulty:"foundational",type:"recall",
stem:"Which four major emotions are identified as commonly presenting in trauma survivors?",
choices:{A:"Happiness, excitement, relief, and calm",B:"Anger, guilt, fear, and depression",C:"Confusion, boredom, curiosity, and pride",D:"Jealousy, envy, contempt, and disgust"},
correct:"B",
explanation:"The curriculum identifies anger, guilt, fear, and depression as the four major emotions that can present in trauma survivors, which can affect how they perceive and react to routine correctional procedures.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO306-005",subject:"CJK 0306",subjectName:"Communication",subtopic:"Command Presence",difficulty:"foundational",type:"recall",
stem:"'Command presence' is best defined as:",
choices:{A:"The loudest verbal command an officer can issue",B:"Body language that projects confidence, poise, and professionalism",C:"A written order signed by a supervisor",D:"The physical act of restraining an inmate"},
correct:"B",
explanation:"Command presence refers to non-verbal techniques - positioning, posture, and bearing - that project confidence, poise, and professionalism, helping an officer communicate authority without necessarily raising their voice.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO306-006",subject:"CJK 0306",subjectName:"Communication",subtopic:"Clear Commands",difficulty:"applied",type:"scenario",
stem:"Which of the following verbal commands is the clearest and most specific, per the curriculum's guidance?",
choices:{A:"\"Move over where I can see you.\"",B:"\"Stand next to your bunk.\"",C:"\"Do something different.\"",D:"\"Get over there.\""},
correct:"B",
explanation:"The curriculum specifically contrasts \"stand next to your bunk\" as clearer and more specific than a vague instruction like \"move over where I can see you,\" since clear, specific commands reduce confusion and the risk of miscommunication.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO306-007",subject:"CJK 0306",subjectName:"Communication",subtopic:"Effective Questioning",difficulty:"applied",type:"scenario",
stem:"An officer wants to gather as much detail as possible from an inmate about a dispute rather than a simple yes or no. What type of question should the officer use?",
choices:{A:"A closed-ended question",B:"An open-ended question",C:"A leading question",D:"A rhetorical question"},
correct:"B",
explanation:"Open-ended questions promote communication without limiting the person's response to a short or one-word answer, which is preferable to yes-or-no questions when trying to gather detailed information.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO306-008",subject:"CJK 0306",subjectName:"Communication",subtopic:"Conflict Management Steps",difficulty:"applied",type:"scenario",
stem:"Two inmates are in the middle of a heated verbal argument that is escalating. According to the curriculum's conflict management steps, what should the officer typically do first?",
choices:{A:"Immediately mediate a compromise between them",B:"Separate the people involved so they are in safe locations and cannot communicate with one another",C:"Write the incident report before taking any other action",D:"Ask a supervisor to make the final decision without gathering any information"},
correct:"B",
explanation:"The first listed step in defusing a conflict is to separate the people involved, ensuring each party is in a safe location and cannot continue communicating with one another, before moving on to gathering information from all sides.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO306-009",subject:"CJK 0306",subjectName:"Communication",subtopic:"De-escalation Goal",difficulty:"foundational",type:"recall",
stem:"What is the primary goal of de-escalation techniques?",
choices:{A:"To obtain compliance without using force, or by using the minimum force necessary",B:"To end the conversation as quickly as possible",C:"To transfer the inmate to a different housing unit immediately",D:"To document the incident before any action is taken"},
correct:"A",
explanation:"De-escalation aims to obtain compliance without force, or with the minimum force necessary, reducing the intensity of a situation through communication, active listening, and empathy.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO306-010",subject:"CJK 0306",subjectName:"Communication",subtopic:"Manipulation vs. Deception",difficulty:"applied",type:"scenario",
stem:"An inmate consistently lies to an officer about minor details for no clear personal benefit, simply out of habit. An inmate in a different unit instead works to influence an officer's decision-making to gain a specific advantage. Which best describes the second inmate's behavior?",
choices:{A:"Deception",B:"Manipulation",C:"Active resistance",D:"Procedural justice"},
correct:"B",
explanation:"Manipulation is specifically defined as controlling or influencing another person's behavior to gain a personal benefit or advantage, distinguishing it from deception, which is simply lying, misleading, or tricking someone and may not always be goal-directed toward a specific advantage.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO306-011",subject:"CJK 0306",subjectName:"Communication",subtopic:"Manipulation Team Roles",difficulty:"higher",type:"scenario",
stem:"An inmate is observed supplying another inmate with detailed information about a specific officer's daily habits, likes, and dislikes, without directly interacting with that officer. This inmate is most likely functioning as which role in an organized manipulation team?",
choices:{A:"Observer",B:"Contact",C:"Runner",D:"Point-man"},
correct:"B",
explanation:"A contact is the team role responsible for supplying information about a correctional officer's work habits, likes, and dislikes - distinct from an observer (who watches for exploitable officer behavior), a runner (who directly approaches the officer for small items), or a point-man (who stands guard during an illegal exchange).",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO306-012",subject:"CJK 0306",subjectName:"Communication",subtopic:"Professional Boundaries",difficulty:"applied",type:"scenario",
stem:"An inmate compliments an officer's appearance in a way that feels like it is testing professional boundaries. What is the curriculum's recommended response?",
choices:{A:"Accept the compliment warmly to keep the interaction pleasant",B:"Ignore it completely and walk away without a word",C:"Tell the inmate that the comment is not appropriate, and consider documenting the attempt to test boundaries",D:"Report the inmate for disciplinary action immediately without further conversation"},
correct:"C",
explanation:"The curriculum specifically recommends shutting down boundary-testing behavior by telling the inmate the comment is not appropriate, and documenting such attempts so other correctional staff can be aware and on guard.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO306-013",subject:"CJK 0306",subjectName:"Communication",subtopic:"Core Communication Competencies",difficulty:"applied",type:"scenario",
stem:"An officer feels themselves becoming angry during a tense conversation with an inmate, pauses, takes a breath, and consciously resets their response before continuing. This best demonstrates which core communication competency?",
choices:{A:"Introduction",B:"Self-de-escalation",C:"Appropriate conclusion",D:"Environment and audience consideration"},
correct:"B",
explanation:"Self-de-escalation involves recognizing when you are at risk of becoming overwhelmed or emotional and taking deliberate steps - such as pausing to reset your response - to maintain composure, which is exactly what is described here.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO306-014",subject:"CJK 0306",subjectName:"Communication",subtopic:"Non-Verbal Cues",difficulty:"applied",type:"recall",
stem:"Which of the following is listed as a facial expression cue that may indicate a person's true feelings differ from their words?",
choices:{A:"Nodding while speaking clearly",B:"Excessive or no blinking, or biting one's lip",C:"Smiling only when greeting a visitor",D:"Maintaining a neutral posture"},
correct:"B",
explanation:"The curriculum lists specific facial cues - such as excessive or no blinking, seeing a lot of white in the eyes, or biting one's lip or touching one's mouth - as indicators worth observing when a person's facial expression may not match their verbal message.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO306-015",subject:"CJK 0306",subjectName:"Communication",subtopic:"Intercultural Communication",difficulty:"applied",type:"scenario",
stem:"An officer notices an inmate consistently avoids direct eye contact during conversations. Per the curriculum's guidance on intercultural communication, what is the most accurate interpretation?",
choices:{A:"The inmate is definitely being dishonest, since avoiding eye contact is a universal sign of deception in every culture",B:"The inmate is showing disrespect toward the officer, since direct eye contact is the only acceptable way to address staff",C:"Avoiding eye contact may carry different cultural meanings across different groups, and should not automatically be assumed to indicate dishonesty or disrespect",D:"The inmate should be immediately referred for a mental health evaluation, since avoiding eye contact always signals a psychological issue"},
correct:"C",
explanation:"The curriculum specifically notes that gestures such as eye contact carry different cultural or social meanings across groups - in some cultures direct eye contact signals honesty, while in others it can be seen as impolite - so officers should not assume a single universal meaning.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO306-016",subject:"CJK 0306",subjectName:"Communication",subtopic:"Barriers to Communication",difficulty:"foundational",type:"recall",
stem:"Which of the following is specifically listed as a barrier to effective communication in a correctional setting?",
choices:{A:"Maintaining eye contact",B:"Use of jargon",C:"Giving clear, specific commands",D:"Using open-ended questions"},
correct:"B",
explanation:"Use of jargon is specifically listed as a barrier to effective communication, alongside stereotyping, profane or disrespectful language, stress and fatigue, and environmental distractions - unlike the other answer choices, which are recommended communication practices.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO306-017",subject:"CJK 0306",subjectName:"Communication",subtopic:"Diverse Populations",difficulty:"applied",type:"scenario",
stem:"An officer is interacting with an inmate of the opposite sex. What guidance does the curriculum give regarding this interaction?",
choices:{A:"Avoid interacting with inmates of the opposite sex entirely, whenever possible",B:"Take extra precautions to avoid any appearance of impropriety, keep conversations neutral, and avoid non-work-related personal conversations",C:"Treat the interaction no differently than any professional workplace conversation with a coworker",D:"Only male officers may supervise female inmates and vice versa, per this rule"},
correct:"B",
explanation:"The curriculum advises taking extra precautions to avoid any appearance of impropriety with inmates of the opposite sex, keeping conversations neutral, and avoiding non-work-related personal conversations to prevent manipulation or the perception of favoritism.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO306-018",subject:"CJK 0306",subjectName:"Communication",subtopic:"Manipulation Prevention",difficulty:"foundational",type:"recall",
stem:"Which of the following is a recommended behavior for officers to display in order to minimize inmate manipulation?",
choices:{A:"Addressing inmates informally by nickname to build rapport",B:"Addressing inmates by \"inmate\" or by last name to maintain a formal distance",C:"Sharing personal details to build trust more quickly",D:"Allowing one inmate limited authority over others to help maintain order"},
correct:"B",
explanation:"The curriculum specifically recommends addressing inmates by \"inmate\" or by last name to maintain formal distance, and separately warns against giving one inmate authority over another, since that dynamic can be exploited.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 3, Lesson 1 (Unit 2)",sourceType:"textbook"},

// ============ CJK 0111 - INTERVIEWING AND REPORT WRITING IN CORRECTIONS ============
{id:"CO111-001",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Interview Basics",difficulty:"foundational",type:"recall",
stem:"Which statement about interviews in a correctional setting is accurate?",
choices:{A:"An interviewee must always be a suspect",B:"An interviewee could be a victim, witness, suspect, or someone with relevant knowledge",C:"Only sworn law enforcement officers may conduct any type of interview",D:"Interviews may only take place after a written statement has been submitted"},
correct:"B",
explanation:"An interview is a conversation aimed at obtaining factual information, and the interviewee does not have to be a suspect - they could be a victim, a witness, or simply someone with relevant knowledge of the situation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO111-002",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Interrogations",difficulty:"applied",type:"scenario",
stem:"A criminal incident occurs inside a facility and requires a formal interrogation of a suspect. Who conducts this interrogation?",
choices:{A:"The correctional officer who personally witnessed the incident occur",B:"A facility investigator or law enforcement officer, not the supervising correctional officer",C:"Any officer who happens to be available at the time of the incident",D:"The inmate's assigned case manager"},
correct:"B",
explanation:"As a correctional officer, you will not conduct interrogations or formal interviews for criminal incidents - a facility investigator or law enforcement officer handles that role, while STG-related interviews go to STG coordinators and PREA-related incidents go to PREA coordinators.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO111-003",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Written Statements",difficulty:"foundational",type:"recall",
stem:"What is the preferred method of obtaining a statement from an interviewee?",
choices:{A:"An audio recording only",B:"A written statement",C:"A verbal statement that is never documented",D:"A statement provided by a third party on the interviewee's behalf"},
correct:"B",
explanation:"A written statement is identified as the preferred method for obtaining a statement from an interviewee, though for criminal incidents statements will specifically be obtained by facility investigators or law enforcement officers.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO111-004",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Statement Refusal",difficulty:"applied",type:"scenario",
stem:"An interviewee refuses to sign their completed written statement. What should the officer do?",
choices:{A:"Discard the statement since it cannot be used without a signature",B:"Sign the interviewee's name on their behalf",C:"Note \"refused to sign\" at the bottom of the statement",D:"Force the interviewee to sign through physical restraint"},
correct:"C",
explanation:"When an interviewee refuses to sign a statement, the correct procedure is to note \"refused to sign\" at the bottom of the statement, preserving an accurate record rather than discarding it or attempting to compel a signature.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO111-005",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Non-English Statements",difficulty:"applied",type:"scenario",
stem:"An interviewee who does not speak English needs to provide a statement, and an interpreter is used. What is the interpreter's correct role?",
choices:{A:"To paraphrase and summarize what the interviewee says for brevity",B:"To state exactly what the interviewee said, without paraphrasing or summarizing",C:"To translate only the parts the interpreter believes are relevant",D:"To write the statement entirely in their own words based on general understanding"},
correct:"B",
explanation:"When an interpreter is used, the interpreter should state exactly what the interviewee said - officers are specifically instructed not to paraphrase or summarize an interviewee's statement, which applies to interpreted statements as well.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO111-006",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Note-Taking Content",difficulty:"foundational",type:"recall",
stem:"At minimum, field notes should answer which set of questions?",
choices:{A:"Who, what, when, where, why, and how",B:"Who, when, and where only",C:"What and why only",D:"Who committed the crime and what the sentence should be"},
correct:"A",
explanation:"Notes should, at minimum, answer who, what, when, where, why, and how an incident occurred, along with any actions and follow-up actions taken - the same core questions that a subsequent report must also address.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO111-007",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Note-Taking Strategy",difficulty:"applied",type:"scenario",
stem:"During an interview, an officer wants to accurately record what an interviewee is saying without missing important statements. What technique does the curriculum recommend?",
choices:{A:"Writing down every word verbatim while the person is still speaking to you",B:"Listening closely, pausing the conversation to ask for clarification, then writing down the details",C:"Recording the conversation with a hidden device instead of taking any notes",D:"Relying entirely on memory and writing the report immediately afterward"},
correct:"B",
explanation:"The curriculum recommends listening closely and pausing the conversation to ask for clarification before writing down details, since trying to write everything down while someone is speaking can cause the officer to miss parts of what is being said.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO111-008",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Notes as Evidence",difficulty:"foundational",type:"recall",
stem:"Why is accurate note-taking particularly important beyond simply aiding report writing?",
choices:{A:"Notes are always destroyed after the report is filed",B:"Notes may be admitted as evidence in court proceedings",C:"Notes are only used for personal reference and have no legal significance",D:"Notes are exclusively used to evaluate the officer's handwriting"},
correct:"B",
explanation:"The curriculum specifically warns that notes or a notebook kept by an officer may be admitted as evidence in court proceedings, which is why accuracy and proper retention practices matter, in accordance with agency policy.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO111-009",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Types of Reports",difficulty:"applied",type:"scenario",
stem:"An officer needs to document a minor disciplinary violation that only requires counseling and a corrective action, not a full disciplinary hearing. Which form is most appropriate?",
choices:{A:"Disciplinary report (DR)",B:"Corrective consultation (CC) form",C:"Use of force report",D:"Special watch form"},
correct:"B",
explanation:"A corrective consultation (CC) form is used to detail counseling and corrective actions taken for minor disciplinary violations, distinct from a disciplinary report (DR), which sets in motion the formal due process hearing procedure for a more significant rule violation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO111-010",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Use of Force Report",difficulty:"foundational",type:"recall",
stem:"When is a use of force report required?",
choices:{A:"Only if the inmate is seriously injured as a result of the force used",B:"Any time there is a use of force, and it is attached to an incident or disciplinary report",C:"Only during a documented riot, not any other type of incident",D:"Use of force reports are optional at the officer's discretion"},
correct:"B",
explanation:"A use of force report is required any time force is used and is attached to the corresponding incident or disciplinary report - it is not contingent on whether the inmate was seriously injured.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO111-011",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Body Camera Footage",difficulty:"higher",type:"recall",
stem:"According to the Florida Statutes, what right does an officer wearing a body camera have before writing a report or providing a statement about an event?",
choices:{A:"No right to review any footage under any circumstance",B:"The right to request to review the recorded footage before writing a report or providing a statement",C:"The right to permanently delete the footage before submitting a report",D:"The right to have a supervisor summarize the footage instead of viewing it personally"},
correct:"B",
explanation:"The Florida Statutes specifically allow an officer wearing a body camera to request to review the recorded footage before writing a report or providing a statement regarding an event pertaining to their duties.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 2), citing s. 943.1718(2), F.S.",sourceType:"statute"},

{id:"CO111-012",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Organizing Report Information",difficulty:"applied",type:"scenario",
stem:"An officer has gathered information from multiple varied sources, including several witnesses, physical evidence, and rule violations, and wants to group the information by type rather than by timeline. Which organizational method is this?",
choices:{A:"Chronological organization",B:"Categorical organization",C:"Alphabetical organization",D:"Narrative organization"},
correct:"B",
explanation:"Categorical organization groups recorded information into types of collection sources - such as informants, victims, witnesses, weapons, and evidence - and is especially helpful when information comes from multiple, varied sources, as opposed to chronological organization, which arranges information by timeline.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO111-013",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Report Structure",difficulty:"foundational",type:"recall",
stem:"Which part of a report typically includes the date, time, and location of the incident, the identities of the people involved, and the officer's response time and initial actions?",
choices:{A:"The introduction",B:"The body",C:"The conclusion",D:"The appendix"},
correct:"A",
explanation:"The introduction of a report typically includes the date and time of the incident, its location, the identities of the people involved, the officer's response time, name, initial actions, case number, and assignment or location.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO111-014",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Falsifying Reports",difficulty:"higher",type:"scenario",
stem:"An officer is unsure of a detail in an incident and decides to alter the report slightly to make the sequence of events sound more definitive than what actually occurred. What is this considered?",
choices:{A:"Acceptable practice as long as the overall outcome is accurate",B:"Falsifying the report, which is a criminal offense",C:"A minor formatting issue that supervisors will overlook",D:"Standard practice when memory is uncertain"},
correct:"B",
explanation:"Altering information you have obtained about an incident is considered falsifying the report, which is a criminal offense - the correct approach when uncertain is to honestly state what is known, even if some details are missing, rather than guessing or altering facts.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO111-015",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Clarity in Reports",difficulty:"applied",type:"scenario",
stem:"Which sentence follows the curriculum's guidance for clarity by consistently identifying each person's role?",
choices:{A:"\"Roberts saw Williams take Brophy's book, and a piece of paper fell out.\"",B:"\"Officer Roberts saw Inmate Williams take Inmate Brophy's book, and a piece of paper fell out.\"",C:"\"He saw him take his book, and it fell out.\"",D:"\"The book incident happened near the bunks.\""},
correct:"B",
explanation:"The curriculum's own example contrasts an ambiguous version that fails to identify who is an officer and who is an inmate with a clear version that consistently labels each person's role - this prevents the kind of misinterpretation shown in the other answer choices.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO111-016",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Professional vs. Casual Language",difficulty:"applied",type:"scenario",
stem:"A report includes the sentence, 'Inmate Coker said he had the 411 on the fish who got a DR for the buck and a shank.' What is the primary problem with this sentence?",
choices:{A:"It is too long and should be shortened, regardless of what content it contains",B:"It relies on jargon and slang that should not be used in a report unless directly quoting someone",C:"It does not include the date of the incident anywhere in the report",D:"It fails to name the reporting officer"},
correct:"B",
explanation:"This sentence is built almost entirely from correctional facility slang and jargon ('411,' 'fish,' 'buck'), which the curriculum specifically warns against using in reports because it can be meaningless or confusing to readers outside the profession.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO111-017",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Report Legibility",difficulty:"foundational",type:"recall",
stem:"Unless an agency's policy specifies otherwise, what type of pen should be used for a handwritten report to ensure clear legibility and photocopying quality?",
choices:{A:"Any color pencil",B:"A black or dark blue ballpoint pen",C:"A red pen for emphasis",D:"A gel pen in any color"},
correct:"B",
explanation:"Unless an agency specifies otherwise, the curriculum recommends using a black or dark blue ballpoint pen for the best legibility and photocopying quality when handwriting a report.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO111-018",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Report Timeliness",difficulty:"foundational",type:"recall",
stem:"Unless an agency's policy states otherwise, by when should a completed report typically be turned in?",
choices:{A:"Within 30 days of the incident",B:"By the end of the officer's shift",C:"Only when specifically requested by a supervisor",D:"There is no expected timeframe"},
correct:"B",
explanation:"After completing a report, the curriculum instructs officers to turn it in by the end of their shift unless agency policy states otherwise, since timely reporting helps avoid forgotten details and allows management to act on issues promptly.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO111-019",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Report Content - Opinions",difficulty:"applied",type:"scenario",
stem:"While writing a report about a fight between two inmates, an officer is tempted to add that one inmate 'clearly started it out of spite.' Should this statement be included?",
choices:{A:"Yes, since it helps explain the officer's reasoning behind the action taken",B:"No, because it is a personal opinion or assumption rather than an observed fact, and reports should include only facts",C:"Yes, but only if a supervisor agrees with the assessment beforehand",D:"No, but only because it might offend the inmate"},
correct:"B",
explanation:"Reports must be based only on facts - personal opinions, judgments, hunches, or assumptions such as inferring an inmate's motive without direct evidence should be excluded, since including them undermines the report's objectivity and reliability.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO111-020",subject:"CJK 0111",subjectName:"Interviewing and Report Writing",subtopic:"Building Rapport",difficulty:"foundational",type:"recall",
stem:"Which of the following is listed as a way to build rapport with inmates in order to gather information more effectively?",
choices:{A:"Making promises that may not be possible to keep, to encourage cooperation",B:"Being truthful about what you can and cannot do",C:"Sharing personal opinions about other inmates",D:"Avoiding all conversation unless it involves a direct order"},
correct:"B",
explanation:"Being truthful - honest with inmates about what you can and cannot do - is specifically listed as a way to build rapport, alongside being professional, respectful, and a good listener, all of which support more open communication over time.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 4, Lesson 1 (Unit 1)",sourceType:"textbook"},


// ============ CJK 0321 - INTAKE AND RELEASE ============
{id:"CO321-001",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Intake vs. Reception Terminology",difficulty:"foundational",type:"recall",
stem:"What is the correct terminology for admission to a correctional facility in a county facility versus a state facility?",
choices:{A:"Both are called \"intake\"",B:"County facilities call it \"intake\"; state facilities call it \"reception\"",C:"County facilities call it \"reception\"; state facilities call it \"intake\"",D:"Both are called \"booking\" regardless of facility type"},
correct:"B",
explanation:"The curriculum specifically distinguishes the terms: admission to a county correctional facility is known as intake, while admission to a state institution is known as reception, and the two processes differ in several ways.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 1",sourceType:"textbook"},

{id:"CO321-002",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Medical Clearance at Admission",difficulty:"applied",type:"scenario",
stem:"An arrestee arrives at a county facility unconscious and showing signs of injury. What does the Florida Model Jail Standards (FMJS) require before this person can be admitted?",
choices:{A:"Admission may proceed immediately regardless of the person's medical condition at intake",B:"FMJS prohibits admitting unconscious, seriously ill, or injured people into a county facility without medical clearance",C:"The person must be admitted first and then transported to a hospital afterward",D:"Only a verbal assessment by the intake officer is required"},
correct:"B",
explanation:"FMJS specifically prohibits admitting an unconscious, seriously ill, or injured person into a county facility without medical clearance - if impairment or injury is present, the person must be assessed and, if necessary, transported for treatment before intake can be completed.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 1",sourceType:"textbook"},

{id:"CO321-003",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Arrest Papers",difficulty:"foundational",type:"recall",
stem:"Which of the following documents the paperwork filed by the arresting officer that results in a person being taken to a correctional facility for admission?",
choices:{A:"Commitment papers",B:"Arrest papers",C:"A discharge gratuity form",D:"A property inventory form"},
correct:"B",
explanation:"Arrest papers are the paperwork filed by the arresting officer supporting a person's arrest and admission, and may include arrest affidavits, warrants, hit confirmations, civil commits, and other court orders - distinct from commitment papers, which are court-generated documents committing someone after a guilty finding.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 1",sourceType:"textbook"},

{id:"CO321-004",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Commitment Papers",difficulty:"applied",type:"scenario",
stem:"An offender has been found guilty in court and is being sent to a correctional facility to serve their sentence. Which type of document authorizes this admission?",
choices:{A:"Arrest papers filed by the arresting agency at the time of booking",B:"Commitment papers, including judgment and sentence papers signed by a judge",C:"A property receipt issued during the intake inventory process",D:"A discharge gratuity authorization"},
correct:"B",
explanation:"Commitment papers are court-generated documents or orders that commit an offender to a correctional facility after being found guilty, and they typically include judgment and sentence papers signed by a judge, along with sentencing information and criminal history.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 1",sourceType:"textbook"},

{id:"CO321-005",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Court Paperwork Abbreviations",difficulty:"foundational",type:"recall",
stem:"What does the abbreviation \"ROR\" refer to in arrest or commitment paperwork?",
choices:{A:"Release on recognizance - pretrial release requiring a written promise to appear, with no monetary bond",B:"Report of release, a facility's internal release log kept for administrative purposes",C:"Return of records, a request for an inmate's prior institutional file",D:"Right of removal, a transfer authorization"},
correct:"A",
explanation:"ROR stands for release on recognizance (sometimes called a signature bond) - the pretrial release of an arrested person who promises in writing to appear for trial later, without any monetary bond being required.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 1",sourceType:"textbook"},

{id:"CO321-006",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Court Paperwork Abbreviations",difficulty:"applied",type:"scenario",
stem:"An inmate's file references a \"TRD.\" What does this term represent, and what is it based on?",
choices:{A:"Total release documentation, a completed release checklist",B:"Tentative release date, based on gain time earned or discipline received",C:"Transfer release document, used only for inter-facility moves",D:"Time reduction disposition, decided solely by the sentencing judge"},
correct:"B",
explanation:"TRD stands for tentative release date, which is based on the amount of gain time an inmate has earned or discipline they have received - distinct from ARD (anticipated release date), which follows a calculation applied closer to release.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 1",sourceType:"textbook"},

{id:"CO321-007",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Property Search",difficulty:"applied",type:"scenario",
stem:"During intake, an officer inspects an inmate's footwear for hidden contraband. What is the correct procedure?",
choices:{A:"Only visually inspect the outside of the shoe, without removing the insole or checking underneath it at all",B:"Remove and inspect footwear insoles and the area under the insole, and turn the footwear upside down and shake or knock it against a hard object",C:"Footwear is exempt from search if it appears new or is a recognizable brand",D:"Only inspect footwear if the inmate is flagged as high-risk in classification"},
correct:"B",
explanation:"The curriculum specifically instructs officers to remove and inspect insoles and the area beneath them, and to turn footwear upside down and shake or knock it against a hard object to dislodge any hidden contraband - a purely visual check is not sufficient.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 2",sourceType:"textbook"},

{id:"CO321-008",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Medication as Contraband",difficulty:"applied",type:"scenario",
stem:"During intake, an officer finds loose prescription pills in an inmate's pocket that are not in a labeled prescription container. How should this be handled?",
choices:{A:"Return the pills to the inmate since they claim it is their prescription",B:"Treat the loose, unlabeled medication as contraband and handle it according to facility policy",C:"Dispose of the pills immediately without documentation",D:"Give the pills to another inmate to hold temporarily"},
correct:"B",
explanation:"The curriculum specifically instructs officers to treat loose medication or medication not in a labeled prescription container as contraband, handled according to the facility's policies and procedures, rather than simply trusting the inmate's claim.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 2",sourceType:"textbook"},

{id:"CO321-009",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Property Inventory - Jewelry",difficulty:"applied",type:"scenario",
stem:"An officer is inventorying an inmate's gold ring during intake. Per the curriculum's guidance, how should this item be documented?",
choices:{A:"By its estimated monetary value only, such as writing down \"$400 ring\"",B:"By description and color, such as \"yellow metal with clear stones,\" without determining its value",C:"By the inmate's own claimed value, written down verbatim without verification",D:"Jewelry is not documented, only clothing"},
correct:"B",
explanation:"The curriculum specifically instructs officers to describe jewelry by item, description, and color - using terms such as \"yellow metal with clear stones\" - and to avoid determining or assigning a monetary value.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 2",sourceType:"textbook"},

{id:"CO321-010",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Property Refusal",difficulty:"applied",type:"scenario",
stem:"An inmate refuses to sign their property inventory form after review. What is the correct procedure?",
choices:{A:"Destroy the inventory form since it cannot be finalized",B:"Note the refusal, and have a second officer verify the inventory and sign the form",C:"Force the inmate to sign before proceeding with any further processing",D:"Discard the property since ownership cannot be confirmed"},
correct:"B",
explanation:"If an inmate refuses to sign the property inventory form, the officer should note the refusal and have a second officer verify the inventory and sign the form, preserving an accurate and witnessed record.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 2",sourceType:"textbook"},

{id:"CO321-011",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"FCIC/NCIC",difficulty:"foundational",type:"recall",
stem:"What is the Florida Crime Information Center (FCIC)?",
choices:{A:"A federal database maintained exclusively by the FBI, with no state contribution at all",B:"Florida's law enforcement and criminal justice information system, and the central repository for all criminal history records in the state",C:"A private background check service used only by employers to screen job applicants for hire",D:"A database limited to sex offender registration only, separate from any general criminal history record maintained"},
correct:"B",
explanation:"FCIC is Florida's own law enforcement and criminal justice information system and serves as the central repository for all criminal history records within the state, including wanted and missing persons information - it feeds into NCIC, the FBI's nationwide database.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 3",sourceType:"textbook"},

{id:"CO321-012",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"FCIC/NCIC Legal Requirements",difficulty:"higher",type:"scenario",
stem:"An officer wants to use FCIC/NCIC to check on the criminal history of a family member out of personal curiosity, not for a work-related purpose. Is this permitted?",
choices:{A:"Yes, as long as the officer is certified to use the database for any personal or professional purpose whatsoever, with no restriction at all",B:"No, because information from FCIC/NCIC is confidential and restricted to criminal justice purposes only - it cannot be used to check on family, friends, or coworkers for personal reasons",C:"Yes, but only during off-duty hours when the officer is not performing any official duties for the agency at that moment",D:"No, but only if the family member has no criminal record on file in the system at the exact time of the check performed"},
correct:"B",
explanation:"Even a certified user is restricted to using FCIC/NCIC information only for criminal justice purposes - using the system to check on family, friends, or coworkers for personal reasons violates the restriction requirement regardless of certification status.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 3",sourceType:"textbook"},

{id:"CO321-013",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Fingerprinting Technique",difficulty:"applied",type:"scenario",
stem:"An arrestee's hands are excessively dry, making it difficult to capture a quality fingerprint on the LiveScan machine. What does the curriculum recommend?",
choices:{A:"Apply excessive pressure to compensate for the dryness",B:"Moisten the hand with water or use an oil-free lotion",C:"Skip the print and note it as unobtainable",D:"Use a completely different finger than instructed"},
correct:"B",
explanation:"For excessively dry hands, the curriculum recommends moistening the hand with water or using an oil-free lotion to improve print quality - the opposite approach (wiping with a cloth) is used for excessively wet hands.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 3",sourceType:"textbook"},

{id:"CO321-014",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Officer Safety During Printing",difficulty:"applied",type:"scenario",
stem:"While taking an arrestee's fingerprints, where should the officer position the person for safety?",
choices:{A:"Directly in front of the officer, facing them",B:"Standing to the right or rear of the officer taking the prints",C:"Seated with their back to the officer",D:"Positioning does not matter as long as the machine is used correctly"},
correct:"B",
explanation:"For officer safety during fingerprinting, the person should be positioned to the right or rear of the officer taking the prints, while the officer maintains a good grip on the hand being rolled and stays aware of the person's other hand and movements.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 3",sourceType:"textbook"},

{id:"CO321-015",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Biometric Identification Solution (BIS)",difficulty:"applied",type:"scenario",
stem:"An arrestee's fingerprints are submitted through BIS, and no existing state identification number (SID) match is found. What does this indicate?",
choices:{A:"The fingerprints were captured incorrectly and must be retaken immediately before processing continues",B:"The system automatically generates a new SID, indicating the person is a first-time arrestee, establishing a new criminal history record",C:"The person cannot be legally processed further until a SID is manually assigned",D:"The person's identity can never be determined"},
correct:"B",
explanation:"When BIS finds no existing SID match, the system automatically generates a new SID, which indicates the person is a first-time arrestee and establishes the beginning of their criminal history record.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 3",sourceType:"textbook"},

{id:"CO321-016",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Rapid ID",difficulty:"foundational",type:"recall",
stem:"What is a key characteristic of a Rapid ID device?",
choices:{A:"It requires a full ten-print set and takes over an hour to process at a fixed station in the facility",B:"It is a small, often portable fingerprint scanner using fewer than 10 prints, with end-to-end transaction times averaging around one minute",C:"It replaces the need for LiveScan machines entirely at every facility statewide, eliminating the older system",D:"It can only be used for DNA collection, not fingerprints"},
correct:"B",
explanation:"A Rapid ID device is a small, often portable fingerprint scanner that uses fewer than 10 prints and processes an identification quickly, with average end-to-end transaction times of about one minute.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 3",sourceType:"textbook"},

{id:"CO321-017",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"DNA Collection",difficulty:"applied",type:"recall",
stem:"Under the Florida Statutes, DNA collection at booking applies to which of the following groups?",
choices:{A:"Only people convicted of a violent felony after a full jury trial, excluding pleas, arrests, or misdemeanor convictions of any kind",B:"People committed to DOC supervision, those arrested or convicted for any felony or attempted felony, those convicted of certain misdemeanors, or those held on a federal immigration detainer",C:"Only juveniles regardless of the charge, since adult arrestees are exempt from any DNA collection requirement under current state law entirely",D:"DNA collection is entirely voluntary and never required under Florida law, regardless of the charge, custody status, or prior record"},
correct:"B",
explanation:"Florida law requires DNA collection at booking for a fairly broad group: those committed to DOC supervision, anyone convicted or arrested for a felony or attempted felony, people convicted of certain misdemeanor violations, and those in custody on a federal immigration detainer.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 3, citing Fla. Stat.",sourceType:"statute"},

{id:"CO321-018",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Photographing",difficulty:"foundational",type:"recall",
stem:"In addition to standard front and side identification photos, which of the following should also be photographed during intake?",
choices:{A:"Only the inmate's shoes, excluding any other item or physical feature",B:"Bruising, injuries, bandages, medical conditions, tattoos, and distinguishing scars or marks",C:"Personal photographs are never taken beyond the standard intake ID photo",D:"Only tattoos that appear gang-related"},
correct:"B",
explanation:"The curriculum specifically instructs officers to photograph bruising, injuries, bandages, and medical conditions present at intake, along with tattoos and distinguishing scars or marks, which can also assist in identifying security threat group members.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 3",sourceType:"textbook"},

{id:"CO321-019",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Classification Purpose",difficulty:"foundational",type:"recall",
stem:"What is the primary purpose of inmate classification?",
choices:{A:"To determine an inmate's release date only, based solely on the length of their originally imposed sentence",B:"To assign security risk levels or custody grades that place inmates in housing best suited to their needs while providing reasonable protection for all inmates",C:"To decide which inmates receive visitation privileges, independent of any security concern or classification factor at all",D:"To assign work squad duties exclusively, without any regard to an inmate's classified security risk level at all"},
correct:"B",
explanation:"Classification is a management tool used to assign security risk levels or custody grades to inmates, helping place them in appropriate housing while reducing violence, escapes, and unnecessary movement, and providing reasonable protection for everyone in the facility.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 4",sourceType:"textbook"},

{id:"CO321-020",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"County Security Levels",difficulty:"applied",type:"scenario",
stem:"An inmate has adjusted well to incarceration, has a minimal criminal history, and is currently charged with a non-violent offense. Under the county custody security levels, this inmate would most likely be classified as:",
choices:{A:"Minimum",B:"Medium",C:"Maximum",D:"Close custody"},
correct:"A",
explanation:"Minimum security level in a county facility applies to low-risk inmates who have adjusted well to incarceration, have minimal criminal history, or are currently charged with a non-violent crime - matching the scenario described.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 4",sourceType:"textbook"},

{id:"CO321-021",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"State Custody Grades",difficulty:"higher",type:"scenario",
stem:"Which state custody grade specifically applies to inmates sentenced to death?",
choices:{A:"Close custody",B:"Medium custody",C:"Maximum custody",D:"Community custody"},
correct:"C",
explanation:"Under Florida Administrative Code, maximum custody grade specifically refers to inmates who are sentenced to death - the highest of the five state custody grades (community, minimum, medium, close, and maximum).",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 4, citing F.A.C.",sourceType:"statute"},

{id:"CO321-022",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"State Custody Grades",difficulty:"applied",type:"scenario",
stem:"An inmate is eligible for placement at a work camp with a secure perimeter but is not permitted to work outside that perimeter without armed supervision. Which state custody grade does this describe?",
choices:{A:"Minimum custody",B:"Medium custody",C:"Close custody",D:"Community custody"},
correct:"B",
explanation:"Medium custody grade describes inmates eligible for placement at a work camp with a secure perimeter, but who are not eligible for outside work assignments without armed supervision - distinct from close custody, which requires an armed perimeter or direct armed supervision at all times outside a secure perimeter.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 4",sourceType:"textbook"},

{id:"CO321-023",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Early Admission Risk",difficulty:"higher",type:"recall",

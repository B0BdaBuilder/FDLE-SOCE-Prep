<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDLE Corrections SOCE Mastery</title>
<style>
  :root{
    --navy:#16263D; --navy-light:#24405F; --navy-deep:#0D1826;
    --cream:#F6F4EF; --card:#FFFFFF; --ink:#201D18; --muted:#6B6558;
    --gold:#A9822F; --gold-light:#D9BB74; --red:#9A3B2E; --red-bg:#F7E9E6;
    --green:#3D6B4C; --green-bg:#E8F0E9; --line:#DEDACF;
    --font-head: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, 'Segoe UI', system-ui, Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font-body);line-height:1.5;}
  #root{max-width:880px;margin:0 auto;padding:0 20px 60px;}
  .topbar{background:var(--navy);color:#EDE7D8;padding:22px 20px;margin-bottom:28px;border-bottom:3px solid var(--gold);}
  .topbar-inner{max-width:840px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;}
  .brand{font-family:var(--font-head);font-size:22px;letter-spacing:0.3px;}
  .brand small{display:block;font-family:var(--font-body);font-size:12.5px;color:#B8C4D6;font-weight:400;margin-top:3px;letter-spacing:0.2px;}
  .disclaimer-strip{background:var(--navy-deep);color:#C9C2AE;font-size:12px;padding:6px 20px;text-align:center;}
  .card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);padding:26px 28px;margin-bottom:20px;}
  .card h2{font-family:var(--font-head);font-size:20px;margin:0 0 14px;color:var(--navy);}
  .card h3{font-family:var(--font-head);font-size:16px;margin:22px 0 10px;color:var(--navy);}
  .muted{color:var(--muted);font-size:14px;}
  .btn{display:inline-block;background:var(--navy);color:#fff;border:none;padding:11px 20px;font-size:14.5px;font-family:var(--font-body);cursor:pointer;text-decoration:none;}
  .btn:hover{background:var(--navy-light);}
  .btn-gold{background:var(--gold);color:#241C08;}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn-outline:hover{background:var(--navy);color:#fff;}
  .btn-sm{padding:7px 14px;font-size:13px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:640px){.grid-2{grid-template-columns:1fr;}}
  .home-actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px;}
  @media (max-width:640px){.home-actions{grid-template-columns:1fr;}}
  .action-tile{border:1px solid var(--line);padding:20px;cursor:pointer;background:#FCFBF8;transition:border-color .15s;}
  .action-tile:hover{border-color:var(--gold);}
  .action-tile h3{margin:0 0 6px;font-size:16.5px;color:var(--navy);font-family:var(--font-head);}
  .action-tile p{margin:0;font-size:13.5px;color:var(--muted);}
  .pill{display:inline-block;font-size:11.5px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);margin-right:6px;margin-bottom:6px;}
  .subject-check{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .subject-check:last-child{border-bottom:none;}
  .subject-count{margin-left:auto;color:var(--muted);font-size:12.5px;}
  .progress-track{background:#E9E5D8;height:6px;width:100%;margin-bottom:22px;}
  .progress-fill{background:var(--gold);height:100%;transition:width .2s;}
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--muted);}
  .qstem{font-size:16.5px;line-height:1.55;margin:0 0 20px;color:var(--ink);}
  .choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);padding:13px 16px;margin-bottom:10px;cursor:pointer;background:#fff;}
  .choice:hover{border-color:var(--navy-light);}
  .choice.selected{border-color:var(--navy);background:#EEF2F6;}
  .choice.correct{border-color:var(--green);background:var(--green-bg);}
  .choice.incorrect{border-color:var(--red);background:var(--red-bg);}
  .choice-letter{font-family:var(--font-head);font-weight:700;color:var(--navy);flex-shrink:0;width:20px;}
  .nav-row{display:flex;justify-content:space-between;margin-top:22px;align-items:center;}
  .explain-box{margin-top:18px;padding:16px 18px;background:#FAF8F2;border-left:3px solid var(--gold);font-size:14.5px;}
  .explain-box .verdict{font-weight:700;margin-bottom:6px;}
  .verdict.correct{color:var(--green);}
  .verdict.incorrect{color:var(--red);}
  .source-tag{margin-top:10px;font-size:12px;color:var(--muted);font-style:italic;}
  table.scoretab{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0 4px;}
  table.scoretab th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:0.4px;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;}
  table.scoretab td{padding:7px 8px;border-bottom:1px solid var(--line);}
  .bigscore{font-family:var(--font-head);font-size:44px;color:var(--navy);}
  .bigscore-label{font-size:13px;color:var(--muted);}
  .status-badge{display:inline-block;padding:4px 12px;font-size:13px;font-weight:600;}
  .status-pass{background:var(--green-bg);color:var(--green);}
  .status-fail{background:var(--red-bg);color:var(--red);}
  .review-item{border-bottom:1px solid var(--line);padding:12px 0;}
  .review-item:last-child{border-bottom:none;}
  .review-item .flag{font-size:12px;font-weight:600;}
  .flag.wrong{color:var(--red);}
  .flag.right{color:var(--green);}
  a.linklike{color:var(--navy);cursor:pointer;text-decoration:underline;font-size:13.5px;}
  select,input[type=number]{padding:8px 10px;border:1px solid var(--line);font-size:14px;font-family:var(--font-body);background:#fff;}
  .setup-row{margin-bottom:18px;}
  .setup-row label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px;}
  .count-opts{display:flex;gap:10px;}
  .count-opt{border:1.5px solid var(--line);padding:9px 16px;cursor:pointer;font-size:14px;}
  .count-opt.active{border-color:var(--navy);background:var(--navy);color:#fff;}
  .empty-state{text-align:center;padding:30px 10px;color:var(--muted);}
  .bank-status{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .concept-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .concept-row:last-child{border-bottom:none;}
  .miss-count{color:var(--red);font-weight:600;}
  .fb-field{margin-bottom:14px;}
  .fb-field label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px;}
  textarea.fb-input,input.fb-input{width:100%;padding:9px 11px;border:1px solid var(--line);font-size:14px;font-family:var(--font-body);background:#fff;}
  textarea.fb-input{min-height:92px;resize:vertical;}
  .fb-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .fb-chip{border:1.5px solid var(--line);padding:8px 14px;cursor:pointer;font-size:13.5px;}
  .fb-chip.active{border-color:var(--navy);background:var(--navy);color:#fff;}
  .fb-status{margin-top:10px;font-size:13.5px;}
  .fb-status.ok{color:var(--green);}
  .fb-status.err{color:var(--red);}
  .scope-book{margin-bottom:14px;}
  .scope-book:last-child{margin-bottom:0;}
  .scope-book-head{font-weight:600;color:var(--navy);border-bottom:1px solid var(--line);}
  .subject-check.scope-chapter{padding-left:22px;}
  .quiz-timer-bar{display:flex;align-items:baseline;justify-content:space-between;background:var(--navy);color:#EDE7D8;padding:8px 14px;margin-bottom:12px;}
  .quiz-timer-label{font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:#B8C4D6;}
  .quiz-timer{font-family:var(--font-head);font-size:22px;font-variant-numeric:tabular-nums;color:#fff;}
  .quiz-timer.warn{color:var(--gold-light);}
  .quiz-timer.danger{color:#F4B6AB;}
  .timer-banner{background:var(--red-bg);color:var(--red);border:1px solid var(--red);font-size:13px;font-weight:600;padding:8px 14px;margin-bottom:12px;}
  .account-bar{display:flex;justify-content:flex-end;align-items:center;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;padding-top:14px;margin-bottom:14px;}
  .auth-notice{color:var(--green);font-size:13.5px;margin:0 0 14px;}
  .auth-error{color:var(--red);font-size:13.5px;margin:0 0 14px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">FDLE Corrections SOCE Mastery<small>Original practice exam system &mdash; not an official FDLE product</small></div>
  </div>
</div>
<div id="root"></div>

<!-- Static stub so Netlify detects the feedback form at deploy time.
     The live form is rendered by JS on the results screen and submits to this via fetch. -->
<form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden aria-hidden="true">
  <input type="hidden" name="form-name" value="feedback">
  <input type="text" name="bot-field">
  <input type="text" name="feedback-type">
  <textarea name="message"></textarea>
  <input type="email" name="email">
  <textarea name="context"></textarea>
</form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const QUESTION_BANK =
[

// ============ CJK 0301 - INTRODUCTION TO CORRECTIONS ============
{id:"CO301-001",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Officer Role Definition",difficulty:"foundational",type:"recall",
stem:"According to the Florida Statutes, which of the following best defines a 'correctional officer'?",
choices:{A:"Any full-time or part-time employee of a correctional institution, including clerical and secretarial staff members on payroll",B:"A person whose primary responsibility is the supervision, protection, care, custody, and control, or investigation, of inmates within a correctional institution",C:"Any sworn law enforcement officer assigned to a correctional facility, regardless of actual job duties there",D:"A clerical employee who processes inmate records as their sole primary responsibility at the facility"},
correct:"B",
explanation:"The Florida Statutes specifically define a correctional officer by their primary responsibility for the supervision, protection, care, custody, and control, or investigation, of inmates. The definition explicitly excludes secretarial, clerical, or professionally trained personnel, which rules out option D.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 1 (citing Fla. Stat.)",sourceType:"textbook"},

{id:"CO301-002",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Officer Roles",difficulty:"applied",type:"scenario",
stem:"An officer is the first to respond to a fight between two inmates. The officer immediately steps in with confidence, gives clear orders, and calms the surrounding inmates. In this moment, the officer is primarily functioning in which role?",
choices:{A:"Leader",B:"Enforcer",C:"Stabilizer",D:"Mediator"},
correct:"C",
explanation:"The stabilizer role is defined by displaying confidence to calm those around you during critical incidents and settling conflicts. While leader and enforcer are also legitimate officer roles, the specific behavior described (calming others during a crisis) matches the stabilizer role most closely.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 1",sourceType:"textbook"},

{id:"CO301-003",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Duty to Intervene",difficulty:"applied",type:"scenario",
stem:"An officer overhears two inmates discussing that another officer arranged to smuggle in a cell phone for money. What is the correct course of action?",
choices:{A:"Ignore the conversation since it was only overheard secondhand from inmates",B:"Confront the accused officer directly and demand an explanation",C:"Report the information to the appropriate authorities in accordance with agency policy",D:"Wait until there is direct proof before taking any action"},
correct:"C",
explanation:"Correctional officers have a duty to report incidents of staff misconduct to appropriate authorities, and this duty to intervene extends across all officer ranks. Failing to report can place the officer and the agency at risk of liability. Waiting for personal proof or confronting the officer directly bypasses proper reporting channels.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO301-004",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Misuse of Position",difficulty:"applied",type:"scenario",
stem:"An off-duty officer wears their uniform to a restaurant and receives a free meal because the staff recognizes them as a correctional officer. This is an example of:",
choices:{A:"Acceptable off-duty courtesy",B:"Misuse of position and authority",C:"Quid pro quo harassment",D:"A conflict of interest requiring agency notification only if repeated"},
correct:"B",
explanation:"Using one's official position, even passively by wearing a uniform, to secure a personal benefit such as a free or discounted meal is a textbook example of misusing one's position and authority under the Florida Statutes' standards of conduct for public officers.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO301-005",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Bias",difficulty:"applied",type:"scenario",
stem:"An officer finds themselves more willing to give an older inmate the benefit of the doubt than a younger inmate in the same situation, without consciously deciding to do so. This best illustrates:",
choices:{A:"Explicit bias",B:"Implicit bias",C:"Procedural justice",D:"Discriminatory intent"},
correct:"B",
explanation:"Implicit bias refers to unconscious beliefs about groups of people that can affect behavior without the person being aware of it, unlike explicit bias, which involves a conscious, openly held dislike or preference.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO301-006",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Procedural Justice",difficulty:"foundational",type:"recall",
stem:"Which framework is used to help correctional officers apply procedural justice in daily interactions with inmates?",
choices:{A:"PREA, the federal framework governing sexual abuse prevention in custody",B:"LEED (Listen, Explain, Equity, Dignity)",C:"CJSTC, the state commission that certifies correctional officers",D:"FMJS"},
correct:"B",
explanation:"The LEED framework - Listen, Explain, Equity, Dignity - is the practical tool the curriculum teaches for applying the four pillars of procedural justice in daily interactions.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO301-007",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Stress Response",difficulty:"foundational",type:"recall",
stem:"An officer freezes and fails to react when confronted with a sudden physical threat. This is an example of which component of the body's automatic stress response?",
choices:{A:"Fight",B:"Flight",C:"Freeze",D:"Fatigue"},
correct:"C",
explanation:"The fight-flight-freeze response is the body's physiological reaction to a perceived or real threat. 'Freeze' specifically describes the body failing to react, as distinct from confronting the threat (fight) or fleeing from it (flight).",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO301-008",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Categories of Stress",difficulty:"applied",type:"scenario",
stem:"An officer's spouse passes away unexpectedly. The intense grief and disruption the officer experiences in the weeks that follow is best categorized as which type of stress?",
choices:{A:"Routine stress",B:"Acute stress",C:"Traumatic stress",D:"Chronic stress"},
correct:"B",
explanation:"Acute stress is typically short-lived and occurs in response to unexpected life changes, such as the death of a family member, the end of a relationship, or sudden unemployment - distinct from the day-to-day nature of routine stress or the safety-threatening nature of traumatic stress.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO301-009",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"PTSD",difficulty:"foundational",type:"recall",
stem:"An officer describes always feeling 'on guard' and struggles to relax even at a family dinner, constantly scanning for danger. This symptom is best described as:",
choices:{A:"Hypervigilance",B:"Compassion fatigue",C:"Secondary trauma",D:"Situational awareness"},
correct:"A",
explanation:"Hypervigilance is a symptom of PTSD characterized by a persistent sense of being on guard, making it difficult to disengage from a heightened stress state even in non-stressful situations.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO301-010",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Peer Support",difficulty:"higher",type:"scenario",
stem:"A fellow officer tells you, 'I just wish I could die, I can't take this anymore,' but says they have no specific plan. Per the curriculum's guidance on peer support, what is the most appropriate immediate response?",
choices:{A:"Reassure them everyone feels that way sometimes and change the subject to something less serious",B:"Thank them for being honest, let them know you are listening and support them, and help connect them with a mental health professional or agency resource",C:"Wait to see if the feelings pass on their own before saying anything at all, since intervening might make the situation worse",D:"Immediately report them for fitness-for-duty removal without offering any support or having a conversation first"},
correct:"B",
explanation:"The curriculum instructs officers to thank the person for their honesty, express support, and help them access professional help such as by offering to help schedule an appointment. This is a protocol question about supporting a colleague, not a substitute for professional crisis intervention.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 3 (Unit 3)",sourceType:"textbook"},

{id:"CO301-011",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Sexual Harassment",difficulty:"foundational",type:"recall",
stem:"A supervisor implies that a subordinate officer must go on a date with them to keep their current assignment. This is an example of:",
choices:{A:"Hostile work environment only",B:"Quid pro quo harassment",C:"Procedural injustice",D:"A conflict of interest"},
correct:"B",
explanation:"Quid pro quo harassment - Latin for 'something for something' - occurs when a person in a position of power demands sexual favors in exchange for a workplace benefit, such as continued employment or a favorable assignment.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO301-012",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Ethics",difficulty:"foundational",type:"recall",
stem:"Which of the following is defined in the curriculum as lying in court after taking an oath?",
choices:{A:"Bribery",B:"Perjury",C:"Misuse of confidential information",D:"Discrimination"},
correct:"B",
explanation:"Perjury is specifically the offense of lying in court after taking an oath and is treated as a felony in proceedings such as testifying in court or giving a deposition.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 1 (Unit 2)",sourceType:"textbook"},

// ============ CJK 0355 - LEGAL FOR CORRECTIONAL OFFICERS ============
{id:"CO355-001",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Contraband Definition",difficulty:"foundational",type:"recall",
stem:"Which of the following best defines contraband in a correctional facility?",
choices:{A:"Any item an inmate did not personally purchase, regardless of how it was obtained at all",B:"Any unauthorized article foreign to the facility, or any authorized article in excessive quantity or altered from its intended purpose",C:"Only items that are illegal for any civilian to possess, excluding altered or excessive authorized items",D:"Any item that has monetary value to another inmate, regardless of whether authorized"},
correct:"B",
explanation:"Contraband is defined broadly to include both items that are entirely unauthorized as well as authorized items that are altered or possessed in excessive quantities, which is why even everyday items like extra food can become contraband.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO355-002",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Search Authority",difficulty:"higher",type:"scenario",
stem:"An officer wants to search an inmate's cell for contraband but has no specific reason to suspect this particular inmate. Which statement is accurate?",
choices:{A:"The officer needs probable cause, just as with a civilian search",B:"The officer needs reasonable suspicion but not full probable cause",C:"The officer does not need probable cause to search an inmate due to the inmate's reduced expectation of privacy",D:"The officer must obtain a supervisor's written authorization before any cell search"},
correct:"C",
explanation:"Because inmates have a reduced expectation of privacy due to the facility's obligation to maintain order and security, an officer does not need probable cause to search an inmate or their living area, unlike a search of a private citizen outside a correctional setting.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO355-003",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Visitor Searches",difficulty:"applied",type:"scenario",
stem:"A visitor entering a facility refuses to submit to a search. What is the most accurate statement of the visitor's rights and the likely consequence?",
choices:{A:"Visitors have no right to refuse a search under any circumstance whatsoever",B:"Visitors have the right to refuse a search, but refusal may result in denial or termination of the visit",C:"Visitors must be searched by force if they refuse",D:"Visitor refusal automatically triggers a criminal trespassing charge on the spot"},
correct:"B",
explanation:"Unlike inmates, visitors retain the right to refuse a search; however, that refusal carries a consequence - the facility may deny or terminate the current or a future visit as a result.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO355-004",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Miranda in Corrections",difficulty:"higher",type:"scenario",
stem:"A crime occurs inside a correctional facility and a suspect needs to be interrogated. What is the officer's correct role regarding Miranda warnings?",
choices:{A:"The correctional officer should issue the Miranda warning themselves before questioning the suspect directly about the crime committed",B:"Miranda does not apply at all inside a correctional facility, since inmates have no custodial rights while incarcerated there",C:"A correctional officer is not a law enforcement officer and does not issue Miranda warnings; interrogation should be completed by a law enforcement officer or a facility inspector/investigator",D:"Miranda only applies if the suspect specifically requests an attorney before any questioning begins at all, not automatically upon booking or arrest"},
correct:"C",
explanation:"Although a correctional officer does not issue Miranda warnings, Miranda protections still apply to inmates in a correctional setting. Interrogation of a suspect in an in-facility crime should be handled by a law enforcement officer or a facility inspector/investigator, not the supervising correctional officer.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO355-005",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"HIPAA",difficulty:"applied",type:"scenario",
stem:"An inmate is being transported and has a known infectious disease such as tuberculosis. What is the correct application of HIPAA in this situation?",
choices:{A:"The transport officer may not be told about the inmate's condition under any circumstances",B:"The transport officer may be told limited, relevant health information necessary to take appropriate precautions",C:"The inmate's full medical file must be provided to the transport officer",D:"HIPAA does not apply to inmates at all"},
correct:"B",
explanation:"Officers may receive limited health information when it is necessary for a specific health and safety purpose, such as a transport officer needing to know about an infectious disease to use appropriate PPE - but they are not entitled to the inmate's complete health record.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO355-006",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Privileged Communication",difficulty:"foundational",type:"recall",
stem:"Regarding attorney-client visits in a correctional facility, which statement is accurate?",
choices:{A:"Attorney-client phone conversations may be recorded like any other inmate call made",B:"Attorney visits must occur during normal visiting hours only",C:"Attorney-client phone conversations may not be recorded, and visits may occur within an officer's sight but out of hearing",D:"An attorney may never meet with a client without an officer standing directly next to the pair"},
correct:"C",
explanation:"The attorney-client privilege, rooted in the Sixth Amendment right to counsel, means attorney-client calls may not be recorded, and while officers may observe the visit visually for security, they should not be within hearing range of the conversation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO355-007",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"PREA",difficulty:"higher",type:"scenario",
stem:"An inmate claims that a sexual encounter with a correctional officer was consensual. Under PREA standards, which statement is correct?",
choices:{A:"Consent is valid if the inmate is an adult and initiated contact with the staff member themselves first, without any coercion",B:"Any sexual activity between an inmate and staff is considered abuse, because an inmate can never consent to sexual activity with staff due to the power imbalance",C:"Consent is valid only if documented in writing by both parties before the sexual activity ever occurs between them",D:"Consent is valid unless the officer is a direct supervisor of the housing unit where the inmate is housed"},
correct:"B",
explanation:"PREA standards make clear that because of the inherent imbalance of power between staff and inmates, it is never possible for an inmate to legally consent to sexual activity with correctional staff - any such activity is classified as abuse regardless of the inmate's stated willingness.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO355-008",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"PREA Voyeurism",difficulty:"foundational",type:"recall",
stem:"Which of the following best describes 'voyeurism' as defined under PREA standards?",
choices:{A:"An inmate refusing a strip search, regardless of whether staff were watching for an unrelated reason",B:"A staff member invading an inmate's privacy for reasons unrelated to official duties, such as watching an inmate perform bodily functions",C:"An inmate photographing another inmate without permission during a scheduled recreation period",D:"A visitor taking photos inside the facility lobby without any staff authorization"},
correct:"B",
explanation:"Under PREA, voyeurism specifically refers to staff invading an inmate's privacy for reasons unrelated to their official duties - such as unnecessarily watching an inmate use the bathroom or taking photos of an inmate's body.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO355-009",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"PREA Detection",difficulty:"applied",type:"scenario",
stem:"An officer notices an inmate has begun waiting until the last three minutes of shower time to shower and appears to be avoiding a particular cellmate. Per PREA training, this behavior pattern should prompt the officer to:",
choices:{A:"Discipline the inmate for not following the shower schedule promptly, since punctuality is a facility requirement",B:"Assume the inmate is simply being difficult and ignore it, since minor schedule changes rarely indicate anything serious",C:"Consider that this unusual behavior could be a sign the inmate is coping with sexual abuse, and investigate further without making assumptions",D:"Immediately transfer the inmate to a different facility, since a schedule change alone justifies a transfer request"},
correct:"C",
explanation:"The curriculum specifically warns officers not to assume an inmate exhibiting unusual behavior, such as avoiding a certain staff member or timing activities to avoid another inmate, is simply breaking rules - such patterns may indicate the inmate is coping with sexual abuse and warrant careful, non-judgmental follow-up.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO355-010",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Use of Force Authority",difficulty:"foundational",type:"recall",
stem:"Which two chapters of the Florida Statutes govern the use of force by a correctional officer?",
choices:{A:"Chapters 776 and 944",B:"Chapters 943 and 951",C:"Chapters 112 and 111",D:"Chapters 893 and 985"},
correct:"A",
explanation:"Chapter 776, F.S. governs justifiable use of force generally, and Chapter 944, F.S. governs the state correctional system, including the specific authority for correctional officer use of force under section 944.35.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO355-011",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Deadly Force Definition",difficulty:"higher",type:"scenario",
stem:"During an escape attempt, an officer fires a warning shot at a vehicle being used in the escape, but no one is struck. Under Florida law, how is this act classified?",
choices:{A:"It is not deadly force because no one was hit, so the statutory definition never applies to a missed shot",B:"It is deadly force, because firing a firearm at a vehicle in which the person to be arrested is riding meets the statutory definition regardless of injury",C:"It is only considered less-lethal force, since firing at a vehicle rather than a person lowers the classification entirely",D:"It cannot be classified without knowing the caliber of the firearm used in the escape attempt"},
correct:"B",
explanation:"Section 776.06, F.S. explicitly includes firing a firearm at a vehicle in which the person to be arrested is riding within the definition of deadly force, even without intent to kill or an actual hit - this is a commonly misunderstood, legally significant distinction.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 4 (Unit 2), citing s. 776.06, F.S.",sourceType:"statute"},

{id:"CO355-012",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Case Law - Graham v. Connor",difficulty:"foundational",type:"recall",
stem:"The 'objective reasonableness' standard for evaluating an officer's use of force, established in Graham v. Connor, requires that force be judged from which perspective?",
choices:{A:"The perspective of the inmate who received the force",B:"The perspective of a reasonable officer on the scene, without the benefit of 20/20 hindsight",C:"The perspective of an outside investigator reviewing body camera footage weeks later",D:"The perspective of the officer's subjective intent at the time"},
correct:"B",
explanation:"Graham v. Connor established that use-of-force cases must be judged from the perspective of what a reasonable officer would do under the same circumstances, without the benefit of hindsight - not from the injured party's perspective or the officer's own subjective state of mind.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 4 (Unit 2), citing Graham v. Connor, 490 U.S. 386 (1989)",sourceType:"court_case"},

{id:"CO355-013",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Case Law - Kingsley v. Hendrickson",difficulty:"higher",type:"scenario",
stem:"A pretrial detainee brings an excessive force claim after officers used force to move him between cells. Per Kingsley v. Hendrickson, what must the detainee show to succeed?",
choices:{A:"That the officers subjectively intended to punish him personally",B:"That the force purposely or knowingly used against him was objectively unreasonable",C:"That he suffered a permanent physical injury as a result",D:"That a supervisor personally approved the use of force"},
correct:"B",
explanation:"Kingsley v. Hendrickson held that a pretrial detainee need only show the force used was objectively unreasonable - they do not need to prove the officers' subjective intent to punish, which was the flawed jury instruction originally applied in that case.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 4 (Unit 2), citing Kingsley v. Hendrickson, 576 U.S. 389 (2015)",sourceType:"court_case"},

{id:"CO355-014",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Case Law - Hudson v. McMillian",difficulty:"higher",type:"recall",
stem:"According to Hudson v. McMillian, an inmate's excessive force claim under the Eighth Amendment can succeed even when:",
choices:{A:"The inmate suffered only minor injuries, as long as force was applied maliciously and sadistically rather than in a good-faith effort to maintain discipline",B:"The inmate cannot identify which specific officer used the force, even though multiple officers were clearly involved in the incident",C:"No force was actually applied, and the inmate's claim rests entirely on a documented injury with no use-of-force report filed",D:"The incident occurred more than one year before the claim was filed, exceeding the statute of limitations for an excessive force claim"},
correct:"A",
explanation:"Hudson v. McMillian established that the extent of injury is not the deciding factor - the key question is whether the force was applied in a good-faith effort to maintain or restore discipline, or maliciously and sadistically to cause harm. Even minor injuries can support a claim if the force was malicious.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 4 (Unit 2), citing Hudson v. McMillian, 503 U.S. 1 (1992)",sourceType:"court_case"},

{id:"CO355-015",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Case Law - Whitley v. Albers",difficulty:"applied",type:"recall",
stem:"In Whitley v. Albers, the Supreme Court found no Eighth Amendment violation when an officer shot an inmate during a riot because:",
choices:{A:"The inmate had a prior disciplinary record on file at the facility",B:"The force was applied in a good-faith effort to restore discipline and was not malicious or sadistic",C:"The inmate consented to the use of force against them in advance",D:"Riots automatically waive all constitutional protections"},
correct:"B",
explanation:"The Court found that officers acted in a good-faith effort to restore order during a hostage/riot situation, and there was no wanton willingness to inflict unjustified suffering - meeting the good-faith standard rather than acting maliciously or sadistically.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 4 (Unit 2), citing Whitley v. Albers, 475 U.S. 312 (1986)",sourceType:"court_case"},

{id:"CO355-016",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Negligence",difficulty:"foundational",type:"recall",
stem:"Which of the following are the four elements required to establish negligence?",
choices:{A:"Intent, motive, action, and consequence, established in that order",B:"A duty to act with care, failure to perform that duty, proof that the failure caused damages, and actual damages resulted",C:"Malice, recklessness, harm, and a witness",D:"A written policy violation, a supervisor's report, an internal investigation, and discipline imposed"},
correct:"B",
explanation:"Negligence requires all four elements: a duty to act with care, a failure to perform that duty, proof that the failure caused damages, and actual damages resulting. Missing any one of these elements defeats a negligence claim.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO355-017",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Damages",difficulty:"applied",type:"scenario",
stem:"A jury awards an inmate additional money specifically to punish an officer for recklessness and to deter similar future conduct, beyond compensating the inmate for actual harm. This type of award is called:",
choices:{A:"General damages",B:"Special damages",C:"Nominal damages",D:"Punitive damages"},
correct:"D",
explanation:"Punitive damages are intended to punish the defendant for reckless, malicious, or deceitful conduct and to deter others from the same behavior - they are awarded in addition to, not instead of, compensatory damages.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO355-018",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Civil Rights / Double Jeopardy",difficulty:"higher",type:"scenario",
stem:"An officer is acquitted of state aggravated battery charges after using excessive force on an inmate. The federal government then indicts the officer for a criminal civil rights violation arising from the same incident. Is this a double jeopardy violation?",
choices:{A:"Yes, because it is the same set of facts, and double jeopardy bars any second prosecution regardless of which government or court system brings it forward",B:"No, because state and federal governments are separate sovereigns with their own criminal court systems, so prosecuting a distinct federal offense after a state acquittal does not violate double jeopardy",C:"Yes, but only if the officer is convicted at the federal level after already being acquitted by the state on identical underlying facts",D:"No, but only because the federal charge was filed within 30 days of the state court's acquittal in the same underlying case entirely"},
correct:"B",
explanation:"The dual sovereignty doctrine means the Fifth Amendment's double jeopardy clause does not bar a federal civil rights prosecution following a state acquittal, because the state and federal governments are treated as separate sovereigns even when the charges arise from the same facts.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO355-019",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Agency Liability",difficulty:"applied",type:"scenario",
stem:"An agency is sued after an officer negligently operates an agency vehicle and injures a pedestrian while on duty. The agency, despite not directly causing the injury, is held responsible for the officer's actions. This is an example of:",
choices:{A:"Direct liability",B:"Vicarious liability",C:"Sovereign immunity waiver",D:"Qualified immunity"},
correct:"B",
explanation:"Vicarious liability holds a person or entity responsible for the negligent actions of another - here, the agency for its employee - even though the agency itself did not directly cause the injury, because the officer was acting within the scope of employment.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO355-020",subject:"CJK 0355",subjectName:"Legal for Correctional Officers",subtopic:"Sovereign & Qualified Immunity",difficulty:"higher",type:"recall",
stem:"Which statement correctly distinguishes qualified immunity from Florida's sovereign immunity protections?",
choices:{A:"They are identical protections that apply equally to every officer, public or private, with no distinction based on employer, conduct, or clearly established law, in every court",B:"Qualified immunity protects officers from federal civil rights claims absent a clearly established law violation, but excludes officers at private prisons, unlike sovereign immunity's broader public-employee coverage",C:"Sovereign immunity protects officers only from federal lawsuits, while qualified immunity covers all state tort claims brought against public employees in state court proceedings only",D:"Qualified immunity applies automatically to any officer's conduct, public or private, regardless of whether clearly established law was violated, bad faith, or intent"},
correct:"B",
explanation:"Qualified immunity specifically shields government officials from civil damages for conduct that did not violate clearly established law - and importantly, it does not extend to correctional officers employed by private prisons, a distinction that matters given Florida's mix of public and private correctional facilities.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 2, Lesson 2 (Unit 3)",sourceType:"textbook"},

// ============ CJK 0327 - SHIFT MANAGEMENT AND SAFETY ============
{id:"CO327-001",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Search Equipment",difficulty:"applied",type:"scenario",
stem:"An officer is searching a bunk and wants to avoid the risk of a hidden shank cutting their hand while also preventing damage to the mattress. Which tool should the officer use?",
choices:{A:"A screwdriver, used to pry open the mattress seam for inspection",B:"A handheld or walk-through metal detector to scan the mattress",C:"A mirror, angled to view underneath the bunk frame",D:"A probing wire"},
correct:"B",
explanation:"The curriculum specifically recommends scanning a mattress with a metal detector rather than physically handling it, which protects the officer from injury and prevents unnecessary damage to facility property.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO327-002",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Person Searches",difficulty:"applied",type:"scenario",
stem:"Which of the following is listed as a legitimate indicator that may warrant an impromptu pat search of an inmate?",
choices:{A:"The inmate is wearing a facility-issued uniform correctly",B:"The inmate is hiding their hands or has unusual bulges in their clothing",C:"The inmate greets the officer by name",D:"The inmate is sitting quietly in the dayroom"},
correct:"B",
explanation:"Hiding hands and unusual bulges in clothing are both specifically listed as behavioral and physical indicators that may warrant an impromptu pat search for weapons or contraband.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO327-003",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Search Patterns",difficulty:"applied",type:"scenario",
stem:"A single officer is assigned to search a large outdoor recreation yard alone. Which search pattern is designed specifically for one person searching outward from a central point?",
choices:{A:"Strip/line search pattern",B:"Grid search pattern",C:"Spiral search pattern",D:"Zone/quadrant search pattern"},
correct:"C",
explanation:"The spiral search pattern is specifically designed for use by one person, who begins at a central point and moves in increasingly larger circles outward to the boundary of the search area.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO327-004",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Contraband Categories",difficulty:"applied",type:"scenario",
stem:"An officer discovers an inmate has an excessive number of unaltered canteen snack bags under a bunk, with no immediate safety threat evident. This is most accurately categorized as:",
choices:{A:"Hard contraband",B:"Nuisance contraband",C:"Not contraband, since food is always authorized",D:"Evidence requiring criminal charges"},
correct:"B",
explanation:"Nuisance contraband is an authorized item found in excessive amounts or altered from its original state that does not typically pose an immediate safety or security threat. Excess snack food fits this category, unlike hard contraband such as weapons or drugs.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO327-005",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Contraband Handling",difficulty:"foundational",type:"recall",
stem:"When an officer confiscates money from an inmate, what is the correct handling procedure?",
choices:{A:"The money should be discarded as contraband without any further documentation",B:"The money should be counted in the presence of the inmate, and a receipt should be signed and given to the inmate",C:"The officer may keep the money as evidence indefinitely without any documentation",D:"The money should be mailed directly to the inmate's family without record"},
correct:"B",
explanation:"Confiscated money is not simply discarded - it should be counted in the presence of the inmate, with a signed receipt given to the inmate, and then deposited into the Inmate Welfare Fund or the inmate's personal account.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO327-006",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Search Types",difficulty:"higher",type:"scenario",
stem:"An arrestee is taken into custody in an unsecured environment, such as at a scene outside the facility. Which search method - which involves physically patting and squeezing the clothing in a systematic pattern - is specifically used in this unsecured setting?",
choices:{A:"Clothed search",B:"Custodial search",C:"Strip search",D:"Cell search"},
correct:"B",
explanation:"A custodial search involves physically patting and squeezing clothing in a systematic pattern and is specifically used when a subject is taken into custody in an unsecured environment, distinguishing it from a clothed search, which is used within a secure environment like a facility.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO327-007",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Mail Types",difficulty:"foundational",type:"recall",
stem:"Which three categories of mail are inmates permitted to receive?",
choices:{A:"Routine, legal, and privileged mail",B:"Personal, business, and government mail",C:"Local, state, and federal mail",D:"Certified, priority, and standard mail"},
correct:"A",
explanation:"The curriculum identifies three types of inmate mail: routine mail (general correspondence), legal mail (from courts and attorneys), and privileged mail (from public officials, government agencies, and news media).",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO327-008",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Legal Mail Handling",difficulty:"applied",type:"scenario",
stem:"An inmate receives a piece of legal mail from their attorney. What is the correct procedure for handling this mail?",
choices:{A:"The officer may open and read it before delivery to check for contraband or any coded messages hidden inside the envelope",B:"The officer may inspect the outside but may only open it in the presence of the inmate, and must not read its content, and it must be delivered within 24 hours of receipt",C:"Legal mail does not need to be inspected at all, since attorney correspondence is always fully exempt from any check",D:"Legal mail may be held indefinitely pending a security review before it reaches the inmate, regardless of the resulting delay involved"},
correct:"B",
explanation:"Legal mail receives special handling: it may only be opened in the inmate's presence for a contraband check, its content may not be read by staff, and Florida procedure requires delivery within 24 hours of receipt - it cannot be withheld for disciplinary reasons.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO327-009",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Kickback Scheme",difficulty:"higher",type:"scenario",
stem:"An officer notices an envelope addressed to Inmate A is being returned due to insufficient postage, but the return address on the envelope is Inmate B's housing unit, not the original sender's address. What scheme does this most likely indicate?",
choices:{A:"A simple postage error with no security concern, common with routine outgoing mail from any inmate at the facility each day",B:"Kickback, or three-way mail, in which the return address is falsified so the returned envelope reaches the intended inmate recipient instead of the original sender",C:"A visitor mailing privilege violation, since visitors are not permitted to address mail to inmates",D:"An authorized digital mail transfer routed through the facility's approved electronic messaging system for inmates"},
correct:"B",
explanation:"Kickback, or three-way mail, is a scheme where an inmate uses another inmate's location as the false return address and includes a deficiency like insufficient postage, so the envelope is returned to the intended recipient instead of going back to the original sender - officers should check the return address before returning any mail.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO327-010",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Outgoing Mail",difficulty:"foundational",type:"recall",
stem:"How must approved outgoing inmate mail be forwarded?",
choices:{A:"It may be personally carried by staff off facility grounds as a routine courtesy",B:"It must be processed only through the U.S. Postal Service and never personally carried out of the facility",C:"It may be handed to any visitor who happens to be leaving the facility",D:"It must be delivered by the inmate's family"},
correct:"B",
explanation:"Outgoing mail must be processed only through the U.S. Postal Service; it should never be personally carried out of the facility by staff, which helps preserve a documented chain of custody and prevents the introduction or removal of contraband.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO327-011",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Weapons/Shanks",difficulty:"foundational",type:"recall",
stem:"What is the most common type of homemade inmate weapon?",
choices:{A:"Firearms",B:"Shanks",C:"Chemical agents",D:"Explosives"},
correct:"B",
explanation:"Shanks - homemade bladed or pointed weapons that can be fashioned from an enormous variety of everyday items - are identified as the most common type of inmate weapon.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO327-012",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Contraband Disposal",difficulty:"applied",type:"scenario",
stem:"An officer confiscates a set of excess bedsheets that an inmate is not permitted to keep. Per proper disposal procedures, these reusable items should most likely be:",
choices:{A:"Destroyed by incineration",B:"Returned to facility supply for reuse",C:"Given to another inmate as a reward",D:"Held indefinitely as evidence"},
correct:"B",
explanation:"Reusable, non-consumable items issued by the facility - such as linens, clothing, books, and pens - may be returned to supply, unlike consumable items like food, which must be destroyed.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO327-013",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Facility Search Technique",difficulty:"foundational",type:"recall",
stem:"When conducting a hands-on inspection during a facility search, what technique does the curriculum recommend to avoid missing concealed items while also protecting officer safety?",
choices:{A:"Rubbing or sliding hands rapidly over surfaces",B:"A pat or pat-and-squeeze method, never placing hands where the contents cannot be seen",C:"Using only visual inspection with no physical contact",D:"Wearing no protective equipment to maximize tactile sensitivity"},
correct:"B",
explanation:"The curriculum specifically warns against rubbing or sliding hands over objects and instead recommends a pat or pat-and-squeeze method, along with the rule of never placing your hands somewhere you cannot also see, to avoid both missed contraband and injury.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 3 (Unit 2)",sourceType:"textbook"},

{id:"CO327-014",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Digital Mail",difficulty:"applied",type:"recall",
stem:"According to the Florida Administrative Code, which of the following digital mail content types would be disapproved for delivery to an inmate?",
choices:{A:"A letter describing a family birthday party",B:"A newsletter written in code that describes methods of escape",C:"A photo of a landscape",D:"A letter discussing a sports team's recent game"},
correct:"B",
explanation:"F.A.C. specifically prohibits digital mail that mentions methods of escape or is written in code, among other categories such as content describing weapon construction or encouraging criminal activity.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 5 (Unit 2)",sourceType:"textbook"},

// ============ CJK 0031 - FIRST AID FOR CRIMINAL JUSTICE OFFICERS ============
{id:"CO031-001",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Duty to Act",difficulty:"higher",type:"scenario",
stem:"A correctional officer is off duty and witnesses a medical emergency in public. Compared to a law enforcement officer's duty to act, what is the correctional officer's obligation?",
choices:{A:"Correctional officers have a duty to act 24/7 exactly like law enforcement officers, regardless of jurisdiction, employment status, or agency policy in place",B:"Correctional officers have an obligation to provide care to a consenting patient only when they are on duty, unlike law enforcement officers who have a duty to act 24/7 within their jurisdiction",C:"Correctional officers never have any duty to act, whether on or off duty, inside or outside the facility, under any circumstance at all",D:"The duty to act only applies inside the correctional facility, never to any patient outside it while the officer happens to be on duty"},
correct:"B",
explanation:"The curriculum draws a clear distinction: correctional and correctional probation officers have a duty to act only while on duty, whereas law enforcement officers carry a 24/7 duty to act within their jurisdictional boundaries.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO031-002",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Good Samaritan Act",difficulty:"applied",type:"scenario",
stem:"An officer provides emergency first aid in good faith, following their level of training, but the patient later sues. What protection does the Good Samaritan Act provide?",
choices:{A:"It guarantees the lawsuit will be automatically dismissed before it ever reaches a courtroom, regardless of the care given or the officer's actual training",B:"It prevents anyone from ever filing a lawsuit against the officer for care rendered in good faith, no matter the outcome, standard of care, or training level involved",C:"It does not prevent a lawsuit from being filed, but it may provide a legal defense if the officer performed according to the standard of care expected of a similarly trained first-aid provider",D:"It only applies to sworn law enforcement officers, never to correctional officers providing first aid in good faith at all"},
correct:"C",
explanation:"The Good Samaritan Act does not stop someone from filing a lawsuit, but it can provide a defense if the officer acted in good faith and within the standard of care expected of a provider with equivalent training - and it can protect correctional officers providing care off-duty as well.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO031-003",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Abandonment",difficulty:"applied",type:"scenario",
stem:"An officer begins first aid on an inmate but leaves before EMS arrives and before any other qualified person takes over care. This could expose the officer to a claim of:",
choices:{A:"Abandonment",B:"Implied consent violation",C:"HIPAA violation",D:"Battery"},
correct:"A",
explanation:"Abandonment occurs when a provider stops giving care without ensuring the patient continues to receive the same or a higher level of care - emergency first aid must continue until relieved by someone with equal or greater training, or until the provider is physically unable to continue.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO031-004",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Types of Consent",difficulty:"applied",type:"scenario",
stem:"An unresponsive inmate is found in medical distress and cannot verbally agree to treatment. The officer begins life-saving care based on the assumption the inmate would want it. This is an example of:",
choices:{A:"Expressed consent",B:"Implied consent",C:"Informed consent",D:"Involuntary consent"},
correct:"B",
explanation:"Implied consent applies when a patient is unresponsive and at risk of death, disability, or deterioration - the provider assumes the patient would agree to life-saving care if able to do so, distinct from expressed consent (a clear verbal or written statement) or informed consent (a fully explained decision by a competent patient).",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO031-005",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Minors and Consent",difficulty:"applied",type:"scenario",
stem:"A 16-year-old in custody suffers a life-threatening injury and no parent or guardian is immediately available. What should the officer do?",
choices:{A:"Wait until a parent or guardian can be reached before providing any care",B:"Provide emergency first aid based on the principle of implied consent",C:"Refuse to provide care since the patient is a minor",D:"Only provide care if another inmate agrees to consent on the minor's behalf"},
correct:"B",
explanation:"When a parent or legal guardian is not available in a life-threatening emergency or one that could result in disability, the curriculum instructs providers to render emergency first aid based on implied consent rather than delaying care.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO031-006",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"DNR/Advance Directives",difficulty:"higher",type:"scenario",
stem:"An officer learns a patient in medical distress has a do-not-resuscitate order (DNR/DNRO) on file. What is the correct action for the criminal justice first-aid provider?",
choices:{A:"Honor the DNR and withhold CPR, exactly as an EMT would under the same circumstances",B:"The DNR/DNRO does not apply to criminal justice officers, so the officer still has a duty to act and cannot withhold CPR or first aid",C:"Contact a judge before making any decision, since only a court order can resolve a DNR conflict on scene",D:"Always defer entirely to family members present at the scene over the officer's own judgment"},
correct:"B",
explanation:"While licensed medical professionals such as EMTs and paramedics may be legally bound to honor a DNR/DNRO, this does not apply to criminal justice officers - as a first-aid provider, the officer retains a duty to act and cannot withhold CPR or first aid regardless of a DNR order, though they should consult agency policy further.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO031-007",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"HIPAA in First Aid",difficulty:"applied",type:"scenario",
stem:"Under which of the following circumstances may an officer release a patient's protected health information without a signed release?",
choices:{A:"Whenever a coworker asks out of curiosity, since HIPAA only restricts disclosure to people outside the agency",B:"When another health-care provider needs the information to continue medical care, or as part of a criminal investigation such as suspected abuse",C:"Only if the media requests it, since press inquiries are treated as an automatic exception under HIPAA",D:"HIPAA never allows disclosure without signed consent, in any circumstance, including ongoing medical care or investigations"},
correct:"B",
explanation:"HIPAA permits disclosure without a signed release when another health-care provider needs the information to continue care, or when providing information is part of a legitimate criminal investigation such as suspected child, elder, or spousal abuse, or pursuant to a legal subpoena.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO031-008",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Scene Evidence",difficulty:"applied",type:"scenario",
stem:"An officer responds to a suspected sexual assault that is also a medical emergency. Regarding evidence preservation, the officer should:",
choices:{A:"Advise the victim not to bathe or wash, and explain the importance of preserving evidence, while showing empathy for the trauma experienced",B:"Immediately have the victim shower to make them more physically comfortable before any further steps are taken",C:"Focus solely on evidence collection and delay any medical care until it is finished",D:"Avoid discussing evidence preservation to prevent upsetting the victim"},
correct:"A",
explanation:"Any medical emergency scene involving suicide, homicide, overdose, domestic dispute, abuse, or assault can also be a crime scene. Officers should advise the victim not to bathe or wash to preserve evidence while also providing appropriate, empathetic care for the trauma involved - the two responsibilities are not mutually exclusive.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO031-009",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Respiratory System",difficulty:"foundational",type:"recall",
stem:"Which small, leaf-shaped structure at the top of the windpipe prevents food and foreign objects from entering the lower airway?",
choices:{A:"The larynx",B:"The trachea",C:"The epiglottis",D:"The diaphragm"},
correct:"C",
explanation:"The epiglottis is the small, leaf-shaped flap located at the upper end of the airway passage that closes off the windpipe (trachea) to keep food and foreign objects from entering the lungs.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 1)",sourceType:"textbook"},

{id:"CO031-010",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Circulatory System",difficulty:"foundational",type:"recall",
stem:"Which major artery is felt in the groin area and supplies blood to the upper thigh and leg?",
choices:{A:"Carotid artery",B:"Brachial artery",C:"Femoral artery",D:"Radial artery"},
correct:"C",
explanation:"The femoral artery supplies blood to the upper thigh and leg and is felt in the groin area, distinct from the carotid (neck), brachial (upper arm), and radial (wrist) pulse points.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 4 (Unit 1)",sourceType:"textbook"},

{id:"CO031-011",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Infection Control - Precaution Levels",difficulty:"higher",type:"recall",
stem:"Which infection control concept goes beyond blood and bodily fluids to include isolating oneself from ALL body substances of a patient undergoing medical treatment?",
choices:{A:"Universal precautions",B:"Body substance isolation (BSI)",C:"Standard precautions",D:"Contact tracing"},
correct:"B",
explanation:"Body substance isolation (BSI) goes further than universal precautions - which focus on blood and bodily fluids - by isolating the provider from all body substances of a patient, relying heavily on PPE and risk-reducing personal behaviors.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 1)",sourceType:"textbook"},

{id:"CO031-012",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Hand Hygiene",difficulty:"foundational",type:"recall",
stem:"When soap and water are unavailable and hands are not visibly soiled, what minimum alcohol concentration should a hand sanitizer contain to be effective?",
choices:{A:"At least 20%",B:"At least 40%",C:"At least 60%",D:"At least 90%"},
correct:"C",
explanation:"The curriculum specifies using an alcohol-based hand rub or sanitizer with at least 60% alcohol when soap and water are not available and hands are not visibly soiled.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 1)",sourceType:"textbook"},

{id:"CO031-013",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Bloodborne Pathogens",difficulty:"foundational",type:"recall",
stem:"Which three bloodborne pathogens are identified as the primary concern for criminal justice officers?",
choices:{A:"Hepatitis B, hepatitis C, and HIV",B:"Influenza, tuberculosis, and MRSA",C:"COVID-19, hepatitis A, and pneumonia",D:"E. coli, salmonella, and norovirus"},
correct:"A",
explanation:"Hepatitis B virus, hepatitis C virus, and HIV are specifically identified as the primary bloodborne pathogens of concern, distinguished from airborne diseases like tuberculosis or COVID-19, or pathogens transmitted through other routes.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 1)",sourceType:"textbook"},

{id:"CO031-014",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Tuberculosis",difficulty:"applied",type:"scenario",
stem:"An officer has a single, brief hallway encounter with an inmate who is later diagnosed with active tuberculosis. Based on how TB is transmitted, what should the officer understand about their risk?",
choices:{A:"A brief encounter almost certainly resulted in infection, since TB spreads easily through even momentary contact",B:"Brief exposure to a TB source rarely results in infection; TB typically spreads through close, confined contact over extended periods",C:"TB can only spread through direct blood contact, similar to bloodborne pathogens like hepatitis or HIV",D:"TB is not contagious under any circumstances, since it only affects people with a pre-existing lung condition"},
correct:"B",
explanation:"Tuberculosis is an airborne disease, but brief exposure to a TB source rarely results in infection - it typically transmits between people who share close, confined spaces over an extended period, which is why prolonged exposure risk is elevated in correctional settings.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 1)",sourceType:"textbook"},

{id:"CO031-015",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Hepatitis A",difficulty:"higher",type:"scenario",
stem:"Unlike hepatitis B and hepatitis C, which are spread through blood and bodily fluids, hepatitis A is primarily spread through which route?",
choices:{A:"Airborne respiratory droplets spread during close, prolonged conversation",B:"Person-to-person contact through fecal contamination and oral ingestion",C:"Sexual contact only, excluding any other route of transmission",D:"Insect bites"},
correct:"B",
explanation:"Hepatitis A is distinct from hepatitis B and C in its transmission route - it spreads primarily through fecal-oral contamination, often facilitated by poor personal hygiene or sanitation, rather than through blood or bodily fluid contact.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 1)",sourceType:"textbook"},

{id:"CO031-016",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"MRSA Prevention",difficulty:"foundational",type:"recall",
stem:"Which of the following is a recommended precaution to help prevent MRSA transmission?",
choices:{A:"Sharing towels only with people who appear generally healthy at the time",B:"Keeping all skin wounds completely covered with a bandage and not sharing personal care items",C:"Avoiding handwashing to prevent the skin from becoming too dry",D:"Sharing drinking containers only during physical training"},
correct:"B",
explanation:"MRSA prevention specifically includes covering all skin wounds completely and never sharing towels, soap, personal care items, or drinking containers, since MRSA spreads through contact with open wounds or drainage.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 5 (Unit 1)",sourceType:"textbook"},

{id:"CO031-017",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Communicating with Patients - Vision Impairment",difficulty:"applied",type:"scenario",
stem:"An officer is providing first aid to a patient who is blind and has a guide dog present. What is the recommended approach?",
choices:{A:"Immediately remove the dog from the area for the safety of responders, regardless of the patient's own stated wishes",B:"Take full control of the dog without direction, since it is trained to obey any officer",C:"Keep the patient and dog together when possible and let the patient direct the dog, since taking charge of the dog without direction can confuse it",D:"Ignore the dog entirely and focus only on the patient's medical needs without addressing the animal at all"},
correct:"C",
explanation:"The curriculum recommends keeping the patient and their guide dog together when possible, and letting the patient direct the dog, since most guide dogs are protective and can become confused if an unfamiliar person tries to take charge without the patient's direction.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO031-018",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Standard of Care",difficulty:"foundational",type:"recall",
stem:"The 'standard of care' for a criminal justice first-aid provider is best described as:",
choices:{A:"The highest level of medical care available anywhere, regardless of the provider's training",B:"The care that would be provided by any other first-aid provider with the same level of training under the same conditions",C:"Whatever care the officer personally feels is appropriate in the moment, without a fixed standard",D:"Care equivalent to that of a licensed physician"},
correct:"B",
explanation:"Standard of care is defined as the care expected from any provider with the same level of training under the same circumstances - for example, providing CPR is within a criminal justice officer's scope of care, but performing open-heart surgery clearly is not.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO031-019",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Negligence in First Aid",difficulty:"applied",type:"scenario",
stem:"Which combination of factors must be present for a criminal justice first-aid provider to be found negligent?",
choices:{A:"Duty to act, breach of the standard of care, causation, and damages",B:"Only the presence of an injury",C:"Only a failure to act, regardless of whether harm resulted",D:"Intent to harm the patient"},
correct:"A",
explanation:"Negligence in a first-aid context requires all four elements: a duty to act existed, the standard of care was breached, that breach directly caused the injury (causation), and the patient suffered compensable damages as a result.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO031-020",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Emancipated Minors",difficulty:"applied",type:"scenario",
stem:"A 17-year-old inmate who is married and financially independent needs medical treatment. Whose consent is required?",
choices:{A:"A parent or legal guardian must still consent, since the patient is under 18",B:"The emancipated minor's own consent is sufficient; a parent or guardian's permission is not required",C:"The facility warden must consent on the minor's behalf",D:"No one may consent, and treatment must be delayed until age 18"},
correct:"B",
explanation:"An emancipated minor - someone who is financially independent, married, an active member of the military, or does not live with a parent or caregiver - can provide their own consent for treatment, and a parent or guardian's permission is not required.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 1)",sourceType:"textbook"},

// ============ CJK 0040 - CRIMINAL JUSTICE FIREARMS ============
{id:"CO040-001",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"General Safety Rules",difficulty:"foundational",type:"recall",
stem:"Which of the following is one of the general rules of firearms safety that applies to all firearms at all times?",
choices:{A:"Keep your finger on the trigger while holstering",B:"Treat every firearm as if it were loaded",C:"Point the firearm at anything except a person",D:"Assume the range instructor has already verified the firearm is unloaded"},
correct:"B",
explanation:"Treating every firearm as if it were loaded is one of the fundamental, universal firearms safety rules, along with never pointing a firearm at anything you do not intend to shoot and keeping your finger off the trigger until ready to fire.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO040-002",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Range Safety",difficulty:"applied",type:"scenario",
stem:"During range training, the range instructor gives the 'unload' command. The recruit's firearm is already unloaded. What should the recruit do?",
choices:{A:"Do nothing, since the firearm is already confirmed to be unloaded",B:"Perform the unloading procedure anyway, even though the firearm is already unloaded",C:"Ask the instructor if the command still applies in this situation",D:"Report to the instructor that the command is unnecessary"},
correct:"B",
explanation:"The curriculum specifically instructs recruits to perform unloading procedures whenever the 'unload' command is given, even if the firearm is already unloaded, ensuring a consistent and verifiable safety practice across the entire range.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO040-003",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Range Safety",difficulty:"foundational",type:"scenario",
stem:"A recruit accidentally drops their firearm on the firing line. What is the correct action?",
choices:{A:"Quickly pick it up and re-holster it before anyone notices",B:"Leave it where it fell and raise a hand to immediately notify the range instructor",C:"Kick it out of the way to a safe distance",D:"Continue the drill and retrieve it afterward"},
correct:"B",
explanation:"If a firearm is dropped, the recruit should not pick it up - instead, they should raise a hand to notify the range instructor immediately, allowing the instructor to control the situation safely.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO040-004",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Dry Fire",difficulty:"foundational",type:"recall",
stem:"What is 'dry fire'?",
choices:{A:"Firing live ammunition at a target with no water present in the containment system",B:"Discharging a firearm with an empty chamber and no magazine inserted, done only under the range instructor's supervision",C:"Cleaning a firearm without any lubricant applied to the moving parts",D:"Firing blank rounds during a training exercise"},
correct:"B",
explanation:"Dry fire refers to discharging a firearm's action with an empty chamber and no magazine inserted, and it should only be performed on the firing line under the direct supervision of the range instructor.",

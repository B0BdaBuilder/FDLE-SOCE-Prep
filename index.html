stem:"An officer encounters what appears to be a typical street-level amount of sealed, intact fentanyl pills, with no airborne risk. Per the curriculum's exposure risk table, what is the appropriate PPE response?",
choices:{A:"Full evacuation and hazmat team response for any quantity encountered",B:"Put on gloves, wear long sleeves if possible, and use a mask and eye protection if appropriate - this is a low-risk exposure",C:"No precautions of any kind are needed",D:"Double gloving and full torso covering is mandatory regardless of the quantity present"},
correct:"B",
explanation:"A small, sealed, intact quantity consistent with street-level possession matches the low-risk exposure category, which calls for gloves, long sleeves if possible, and a mask and eye protection if appropriate - a more limited response than the moderate or high-risk categories.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 1 (Unit 4)",sourceType:"textbook"},

{id:"CO031-047",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Fentanyl Skin Exposure",difficulty:"higher",type:"scenario",
stem:"An officer's skin is accidentally exposed to fentanyl powder. What is the correct decontamination method?",
choices:{A:"Immediately scrub the area vigorously with hand sanitizer or alcohol to break down the powder as quickly as humanly possible",B:"Remove contaminated clothing and wash the skin with soap and water for fifteen minutes, without scrubbing, and without alcohol, hand sanitizer, or other solvents",C:"Apply ice directly to the exposed skin to slow absorption of the powder into the bloodstream before it spreads",D:"Cover the area with a bandage without washing it first, to contain any remaining powder residue on the exposed skin"},
correct:"B",
explanation:"The curriculum specifically warns against using alcohol, hand sanitizer, or other solvents to remove fentanyl, since these can increase the skin's ability to absorb the drug - instead, wash with soap and water for fifteen minutes without scrubbing.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 1 (Unit 4)",sourceType:"textbook"},

{id:"CO031-048",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Bleeding Types",difficulty:"foundational",type:"recall",
stem:"An officer observes bright red blood spurting from a wound. What type of bleeding does this indicate?",
choices:{A:"Venous bleeding",B:"Arterial bleeding",C:"Capillary bleeding",D:"Internal bleeding only"},
correct:"B",
explanation:"Arterial bleeding is characterized by bright red blood spurting or flowing from a wound, indicating a severed or damaged artery - distinct from venous bleeding (dark red, flowing steadily) or capillary bleeding (dark red, oozing slowly).",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO031-049",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Tourniquet Application",difficulty:"higher",type:"scenario",
stem:"An officer is applying a tourniquet to a severely bleeding arm wound. Where should the tourniquet be positioned?",
choices:{A:"Directly over the wound itself, regardless of how close it is to a joint",B:"As high on the extremity as possible ('high and tight'), at a right angle, never over a joint or a solid object in a pocket",C:"As close to the hand or foot as possible, near the extremity's very furthest point from the body",D:"Directly on the elbow or knee joint for maximum stability"},
correct:"B",
explanation:"A tourniquet should be positioned high and tight on the extremity, at a right angle, avoiding placement over a joint (like a knee, ankle, elbow, or wrist) or over a solid object such as a pen or phone that might be in a pocket.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO031-050",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Tourniquet Removal",difficulty:"foundational",type:"recall",
stem:"Once a tourniquet has been applied and secured, who may remove or loosen it?",
choices:{A:"The officer who applied it, once bleeding appears to have stopped",B:"Only medical personnel",C:"The patient themselves, if they feel able to",D:"Any officer on scene, at any time"},
correct:"B",
explanation:"Once a tourniquet is in place, it should not be removed or loosened by the applying officer - only medical personnel should remove or loosen a tourniquet, since doing so prematurely could cause life-threatening blood loss.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO031-051",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Shock Signs",difficulty:"foundational",type:"recall",
stem:"Which of the following is a listed sign of shock?",
choices:{A:"Flushed, warm, dry skin with a strong, regular pulse throughout",B:"Pale, cool, or moist (clammy) skin with a weak, rapid, or absent pulse",C:"Slow, deep, and regular breathing with no other notable sign",D:"Increased alertness and focus"},
correct:"B",
explanation:"Signs of shock include pale, cool, or moist (clammy) skin, along with a weak, rapid, or absent pulse, shallow and irregular breathing, and altered mental status - the opposite of warm, flushed skin or increased alertness.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO031-052",subject:"CJK 0031",subjectName:"First Aid for Criminal Justice Officers",subtopic:"Shock Treatment - Leg Elevation",difficulty:"higher",type:"scenario",
stem:"A patient is showing signs of shock after a fall. The officer is preparing to elevate the patient's legs as part of shock treatment. Under what circumstance should the officer NOT elevate the legs?",
choices:{A:"Never - legs should always be elevated for any patient in shock",B:"If the officer suspects the patient has serious head, neck, spinal, or pelvic injuries",C:"Only if the patient is a minor",D:"Only if the patient is conscious"},
correct:"B",
explanation:"While elevating the lower extremities 6-12 inches is a standard shock treatment step, the curriculum specifically instructs officers not to elevate the legs if serious head, neck, spinal, or pelvic injuries are suspected, since movement could worsen those injuries.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 2, Lesson 1 (Unit 3)",sourceType:"textbook"},


// ============ CJK 0051 - DEFENSIVE TACTICS DEEPENING BATCH (Force Guidelines) ============
{id:"CO051-017",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Use of Force Statutes",difficulty:"higher",type:"recall",
stem:"Which statute establishes that the Department of Corrections has jurisdiction over the supervisory and protective care, custody, and control of inmates and offenders?",
choices:{A:"Chapter 776, F.S.",B:"Chapter 944, F.S.",C:"Chapter 945, F.S.",D:"Chapter 951, F.S."},
correct:"C",
explanation:"Chapter 945, F.S. specifically establishes the Department of Corrections' jurisdiction over the supervisory and protective care, custody, and control of inmates and offenders, distinct from Chapter 944 (use of force authority) and Chapter 776 (general justifiable use of force).",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"statute"},

{id:"CO051-018",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Passive Resistance Definition",difficulty:"foundational",type:"recall",
stem:"Per the official force guidelines definition, passive resistance is:",
choices:{A:"A subject's verbal or physical refusal to comply with an officer's lawful direction, causing the officer to use physical techniques to establish control",B:"Any resistance involving a weapon, regardless of whether the subject complies with any verbal commands given at all",C:"A subject running away from an officer at full speed without any physical contact at all",D:"A subject striking an officer with a closed fist during an otherwise compliant encounter"},
correct:"A",
explanation:"Passive resistance is specifically defined as a subject's verbal or physical refusal to comply with an officer's lawful direction, which requires the officer to use physical techniques to establish control - examples include refusing to move or refusing to remove hands from pockets.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO051-019",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Active Resistance Definition",difficulty:"applied",type:"scenario",
stem:"An inmate braces against a doorframe and pulls away when an officer grips their arm, but does not strike the officer. Per the official force guidelines, this is:",
choices:{A:"Passive resistance",B:"Active resistance",C:"Aggressive resistance",D:"Deadly force resistance"},
correct:"B",
explanation:"Active resistance is specifically defined as physically evasive movements - such as bracing, tensing, pushing, or pulling - used to prevent an officer from establishing control, without rising to the level of an attacking movement.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO051-020",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Aggressive Resistance Definition",difficulty:"applied",type:"scenario",
stem:"An inmate balls up their fist and pushes an officer back while being taken into custody, but the movement is not likely to cause death or great bodily harm. This is:",
choices:{A:"Passive resistance",B:"Active resistance",C:"Aggressive resistance",D:"Deadly force resistance"},
correct:"C",
explanation:"Aggressive resistance is defined as hostile, attacking movements that may cause injury but are not likely to cause death or great bodily harm - examples include balling a fist and approaching an officer, pushing an officer, or grabbing an officer's body.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO051-021",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Officer Response Options",difficulty:"foundational",type:"recall",
stem:"What is 'physical control' as defined in the force guidelines?",
choices:{A:"Any use of a firearm, whether drawn, displayed, or discharged against a subject during an encounter of any kind whatsoever on duty",B:"Achieving compliance or custody through empty-hand or leverage-enhanced techniques, such as pain compliance, transporters, restraint devices, takedowns, and striking techniques",C:"Only verbal commands with no physical component, used before any hands-on technique is ever attempted on a subject",D:"A term used exclusively for vehicle pursuits involving an escaping inmate outside the facility grounds or perimeter fence"},
correct:"B",
explanation:"Physical control is defined as achieving compliance or custody through empty-hand or leverage-enhanced techniques - including pain compliance, transporters, restraint devices, takedowns, and striking techniques - as distinct from less lethal weapons or deadly force.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO051-022",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Less Lethal Weapon Definition",difficulty:"foundational",type:"recall",
stem:"Which of the following is specifically listed as an example of a less lethal weapon?",
choices:{A:"A firearm loaded with standard ammunition",B:"An expandable baton",C:"An eye gouge",D:"An empty-hand strike to the throat"},
correct:"B",
explanation:"An expandable baton is specifically listed as an example of a less lethal weapon, along with electronic control devices (ECD), conducted electrical weapons (CEW), flashlights, and chemical agent sprays - none of which are fundamentally designed to cause death or great bodily harm.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO051-023",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Deadly Force Examples",difficulty:"higher",type:"scenario",
stem:"Which of the following techniques is specifically classified as deadly force, even without necessarily resulting in death?",
choices:{A:"A firm verbal command issued before any physical technique is attempted",B:"An empty-hand strike to the throat, or an impact-weapon strike to the side of the neck",C:"Applying a pain compliance hold to the wrist of the resistant subject",D:"Using a restraint chair"},
correct:"B",
explanation:"Empty-hand strikes to the throat and impact-weapon strikes to the side of the neck are specifically classified as deadly force techniques, along with firearm use and eye gouges - deadly force does not require an actual death to occur, only the likelihood of death or great bodily harm.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO051-024",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Duty to Intervene",difficulty:"higher",type:"scenario",
stem:"An on-duty officer observes a fellow officer engaging in what appears to be excessive use of force. Per s. 943.1735, F.S., what three conditions govern the observing officer's duty to intervene?",
choices:{A:"The officer must be senior in rank, have a body camera running, and file a report within 24 hours of the incident",B:"The officer must observe the excessive force, choose an intervention reasonable based on the totality of circumstances, and not jeopardize their own health or safety",C:"The officer must wait for a supervisor's explicit permission before intervening in the ongoing use of force at all costs",D:"The officer has no legal duty to intervene under Florida law, even when witnessing excessive force firsthand"},
correct:"B",
explanation:"Under s. 943.1735, F.S., an on-duty officer's duty to intervene requires observing another officer engaging or attempting to engage in excessive use of force, choosing an intervention reasonable based on the totality of circumstances, and not jeopardizing their own health or safety in doing so.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2), citing s. 943.1735, F.S.",sourceType:"statute"},

{id:"CO051-025",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Ability, Opportunity, Intent",difficulty:"higher",type:"scenario",
stem:"A 6'4\", 250-pound inmate with no visible weapon threatens to seriously harm an officer. Does this inmate have the 'ability' element of the deadly force decision criteria?",
choices:{A:"No, ability requires a firearm or edged weapon in the subject's hand under every circumstance, without exception",B:"Yes - a weapon is not required for ability; if the subject appears physically able to cause death or great bodily harm by virtue of their size and physical condition, they have the ability",C:"Ability only applies to armed subjects, never to an unarmed subject under any condition, regardless of size or apparent strength",D:"Ability cannot be assessed without a documented prior history of violence on record, even when the subject's size and threat are visibly obvious"},
correct:"B",
explanation:"The curriculum specifically gives this exact example: a subject's apparent physical size and condition alone, without a weapon, can establish the 'ability' element of the deadly force decision - a weapon is not strictly required.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO051-026",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Ability, Opportunity, Intent",difficulty:"applied",type:"scenario",
stem:"An inmate armed with a knife is standing far across a large yard from an officer, making no move to close the distance. Which element of the deadly force decision is most clearly missing?",
choices:{A:"Ability",B:"Opportunity",C:"Intent",D:"Totality of circumstances"},
correct:"B",
explanation:"Opportunity refers to whether the subject is capable of acting on a plan to cause death or great bodily harm - a knife-armed subject standing far away may not have the opportunity to act, whereas the same subject standing closer, or armed with a firearm, would.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO051-027",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Totality of Circumstances Factors",difficulty:"applied",type:"scenario",
stem:"Which of the following is specifically listed as a situational factor relevant to the totality of circumstances in a use-of-force decision?",
choices:{A:"The subject's favorite television show",B:"The number of subjects versus the number of officers present",C:"The color of the subject's uniform",D:"The time of day the subject was born"},
correct:"B",
explanation:"The number of subjects versus officers is specifically listed as a situational factor relevant to the totality of circumstances, along with the severity of the crime, immediate threat level, subject's size and physical condition, environmental factors, and known history of violence.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO051-028",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Use of Force Reporting",difficulty:"higher",type:"scenario",
stem:"An officer writes in a use-of-force report simply, \"the suspect threatened me,\" as the sole justification for the force used. Is this sufficient documentation?",
choices:{A:"Yes, a single-sentence statement of the threat is complete and sufficient justification on its own, since the report need only name the threat",B:"No - the curriculum specifically states this is not a sufficient basis for justification; the officer must clearly articulate the specific facts, actions, and perceptions that established ability, opportunity, and intent",C:"Yes, as long as a supervisor later reviews and agrees with the officer's assessment, even without any documented facts, actions, or perceptions in the written report",D:"No, but only because the sentence is grammatically incomplete, not because it fails to articulate any specific fact, action, or perception at all"},
correct:"B",
explanation:"The curriculum explicitly states that simply writing \"the suspect threatened me\" is not sufficient justification in a report - officers must articulate the specific facts and perceptions, including what they saw, felt, and the subject's specific actions and behaviors that created the perception of ability, opportunity, and intent.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO051-029",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Escalation, De-escalation, Disengagement",difficulty:"applied",type:"scenario",
stem:"An officer is significantly outnumbered and injured during a confrontation, and chooses to disengage and wait for backup rather than continue the encounter. Is this an appropriate tactical option?",
choices:{A:"No, officers must never disengage once a use-of-force encounter has begun, regardless of injury or the number of subjects involved",B:"Yes - disengagement, discontinuing a command or physical use of force, may be the best tactical option when an officer is injured, outnumbered, or waiting for backup",C:"No, disengagement is only legally permitted for supervisors, not line officers, under written agency policy",D:"Yes, but only if a written policy specifically names this exact scenario in advance"},
correct:"B",
explanation:"Disengagement - discontinuing a command or physical use of force - is specifically identified as potentially the best tactical option under circumstances like being outnumbered, injured, or waiting for backup, rather than continuing to escalate a losing encounter.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO051-030",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Survival Stress Reactions",difficulty:"foundational",type:"recall",
stem:"According to the curriculum, what are the four instinctual reactions people are likely to have when experiencing survival stress?",
choices:{A:"Fight, flight, posture, or submit",B:"Laugh, cry, freeze, or run",C:"Attack, retreat, negotiate, or surrender",D:"Panic, calm, ignore, or comply"},
correct:"A",
explanation:"The curriculum identifies four instinctual reactions to survival stress: fight, flight, posture (displaying a threatening or intimidating stance without acting), or submit (completely relinquishing control to another) - this applies to both subjects and officers.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO051-031",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Posturing",difficulty:"applied",type:"scenario",
stem:"An officer responds to a resistant subject by raising their voice and drawing an intermediate weapon such as a baton, without actually using force, in an attempt to gain compliance. This officer behavior is best described as:",
choices:{A:"Submitting",B:"Posturing - a show of force without actually using force",C:"Fleeing",D:"Deadly force"},
correct:"B",
explanation:"Posturing involves displaying a higher level of force - such as raised voice commands and drawing an intermediate weapon - without actually applying that force, often used to try to gain compliance before physical force becomes necessary.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO051-032",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Physiological Changes Under Stress",difficulty:"applied",type:"scenario",
stem:"During a high-stress confrontation, an officer experiences tunnel vision and has trouble seeing close objects with detail. What category of physiological change does this represent?",
choices:{A:"Loss of bladder and bowel control",B:"Distorted vision",C:"Increased fine motor skill precision",D:"Slowed heart rate"},
correct:"B",
explanation:"Distorted vision - including tunnel vision, difficulty seeing close objects with detail, or fixating on one location - is a specifically listed physiological change that can occur under survival stress, along with increased heart rate, amplified or diminished hearing, and loss of fine motor skills.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO051-033",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Fine vs. Gross Motor Skills",difficulty:"higher",type:"scenario",
stem:"Under extreme survival stress, an officer struggles to unlock handcuffs with a small key but can still run and strike effectively. What does this illustrate?",
choices:{A:"The officer is simply poorly trained and needs additional handcuff-manipulation practice, since survival stress has no measurable effect on fine or gross motor coordination in any officer",B:"Loss of fine motor skills (precise movements like key manipulation) combined with heavier reliance on gross motor skills (large muscle movements like running or striking), both recognized physiological effects of survival stress",C:"This has no connection to survival stress and is purely a coincidental equipment malfunction unrelated to the officer's physiological or psychological state",D:"The officer is intentionally sabotaging the task to avoid completing the arrest, a deliberate choice rather than any involuntary stress response to the encounter"},
correct:"B",
explanation:"This is a textbook example of the documented physiological effects of survival stress: fine motor skills requiring small, precise muscle control (like key manipulation) degrade, while gross motor skills involving large muscle movements (running, striking, kicking) are more heavily relied upon.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO051-034",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Pummeling Technique",difficulty:"foundational",type:"recall",
stem:"What is the goal of the 'pummeling' grappling technique?",
choices:{A:"To apply a chokehold to a resistant subject during a standing confrontation",B:"To gain the double underhook position, a dominant control position used in various takedowns and grappling techniques",C:"To draw a firearm more quickly during a deadly force encounter",D:"To escape from a seated position on the ground"},
correct:"B",
explanation:"Pummeling is a grappling technique used to gain the double underhook position - a dominant control position - by alternating between overhook (arm over the subject's arm) and underhook (arm under the subject's arm) positions.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Unit 1 (Drills)",sourceType:"textbook"},

{id:"CO051-035",subject:"CJK 0051",subjectName:"Criminal Justice Defensive Tactics",subtopic:"Objective Reasonableness",difficulty:"applied",type:"scenario",
stem:"Per Graham v. Connor as applied in the Defensive Tactics curriculum, what must courts consider when evaluating whether an officer's use of force was objectively reasonable?",
choices:{A:"Only what a supervisor later determined to be appropriate after reviewing the completed incident report weeks or months afterward",B:"The facts and circumstances the officer knew when the incident occurred, judged from the perspective of a reasonable officer on the scene, not from 20/20 hindsight",C:"Only the outcome and severity of the subject's injuries, regardless of what the officer actually perceived",D:"The officer's personal opinion of the subject, formed and given only after the incident had already fully concluded"},
correct:"B",
explanation:"Objective reasonableness requires courts to judge the reasonableness of a use of force from the perspective of a reasonable officer on the scene, based on the facts and circumstances known to the officer at the time - not from the benefit of hindsight after the fact.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 4, Lesson 1 (Unit 2), citing Graham v. Connor, 490 U.S. 386 (1989)",sourceType:"court_case"},


// ============ CJK 0327 - SHIFT MANAGEMENT AND SAFETY DEEPENING BATCH ============
{id:"CO327-015",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Situational Awareness Definition",difficulty:"foundational",type:"recall",
stem:"What is situational awareness?",
choices:{A:"Being constantly fearful of becoming a victim of violence, even during routine, low-risk interactions with inmates",B:"The ability to pay attention to your surroundings, process what you observe, and make sound decisions based on those observations",C:"A state of complete relaxation while on duty, free from any active scanning of the surrounding environment",D:"A formal disciplinary process for inmates who fail to comply with a direct order from staff"},
correct:"B",
explanation:"Situational awareness is defined as the ability to pay attention to your surroundings, process what you observe, and make sound decisions based on those observations - a major component of maintaining security that is distinct from both complacency and hypervigilance.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO327-016",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Situational Awareness vs. Hypervigilance",difficulty:"higher",type:"scenario",
stem:"An officer is constantly on guard and fearful of becoming a victim of violence, even in low-risk moments, which clouds their judgment. This describes:",
choices:{A:"Healthy situational awareness, a calm and continuous scanning of the environment for genuine threats",B:"Hypervigilance, which can put the officer in danger since fear and nervousness can cloud judgment and lead to poor decision-making",C:"Complacency, a relaxed mental state that develops after repeated exposure to low-risk situations",D:"Command presence, a confident bearing projected outward to influence how others perceive the officer"},
correct:"B",
explanation:"Hypervigilance - a symptom of PTSD - differs from healthy situational awareness because it involves being constantly on guard out of fear, which clouds judgment and can result in poor decision-making, rather than the calm, information-based observation of true situational awareness.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO327-017",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Three Steps of Situational Awareness",difficulty:"foundational",type:"recall",
stem:"What are the three primary steps of situational awareness, in order?",
choices:{A:"React, assess, report",B:"Observe, understand, decide",C:"Listen, speak, act",D:"Plan, execute, review"},
correct:"B",
explanation:"The three primary steps of situational awareness are to observe (perceive the situation using your senses), understand (think about what is typical versus unusual), and then decide (determine and take any warranted action).",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO327-018",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Positioning",difficulty:"applied",type:"scenario",
stem:"An officer supervising a large dormitory moves to a different spot in the room at random times throughout the shift rather than always standing in the same place. Why is this recommended?",
choices:{A:"It has no security purpose and is simply an officer's personal preference on the job",B:"Establishing a predictable pattern could allow inmates to anticipate the officer's position and gain a tactical advantage",C:"It is required only during scheduled fire drills, not routine patrol",D:"It reduces the number of inmates the officer needs to supervise"},
correct:"B",
explanation:"The curriculum specifically warns against establishing a set, predictable pattern of positioning, since if inmates can predict what position an officer will take, they may be able to gain a tactical advantage.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO327-019",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Disengaging After Shift",difficulty:"applied",type:"scenario",
stem:"An officer has trouble 'turning off' their heightened alertness after finishing a shift and going home. What technique does the curriculum recommend?",
choices:{A:"Continue maintaining a high level of situational awareness at all times, even while at home",B:"Spend a few minutes taking deep breaths and focusing on breathing to take attention away from constantly monitoring surroundings",C:"Avoid all social interaction until the hypervigilant feeling passes entirely on its own",D:"Immediately request a transfer to a different facility"},
correct:"B",
explanation:"The curriculum specifically recommends taking a few minutes to focus on deep breathing as a way to disengage from a heightened state of situational awareness after a shift ends, helping the officer relax to match a lower-stress home environment.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO327-020",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Equipment Inspection",difficulty:"foundational",type:"recall",
stem:"Which of the following items is specifically listed as requiring inspection to determine it is in working condition?",
choices:{A:"An inmate's personal photographs kept in their individually assigned property locker",B:"Automatic external defibrillators (AEDs), fire extinguishers, batteries, and handcuffs in each pod",C:"The facility's landscaping along the outer perimeter fence line",D:"Visitor parking signage"},
correct:"B",
explanation:"AEDs, fire extinguishers, batteries, and handcuffs in each pod are specifically listed as items that must be inspected to determine they are in working condition, functioning, and not past any expiration date.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO327-021",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Issuing Equipment",difficulty:"applied",type:"scenario",
stem:"An officer checks out a piece of security equipment from the control room. Which of the following should be documented as part of the issuing process?",
choices:{A:"Only the item's name, without any other identifying detail recorded",B:"The item, item number, date, time, reason the item is being checked out, and the names of the issuing and receiving officers",C:"Only the receiving officer's badge number, without any other detail recorded on the checkout form",D:"Documentation is not required for routine equipment checkouts"},
correct:"B",
explanation:"The curriculum specifically lists documenting the item, item number, date, time, reason for checkout, and the names of both the issuing and receiving officers as the common steps to properly issuing equipment.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO327-022",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Shadow Boards",difficulty:"applied",type:"scenario",
stem:"A tool room uses a board with an outline traced around each tool's designated spot, making it immediately obvious when a tool has not been returned. What is this inventory technique called?",
choices:{A:"A master inventory log",B:"A shadow board",C:"A sanitation plan",D:"A security discrepancy report"},
correct:"B",
explanation:"A shadow board is an inventory control technique where an outline of each item is traced onto a board where the item is normally hung, making it easy to visually identify when an item is missing and has not been returned.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO327-023",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Firearms Inside the Facility",difficulty:"higher",type:"scenario",
stem:"Under normal circumstances, may a correctional officer carry a firearm while on duty inside a correctional facility?",
choices:{A:"Yes, at all times, without restriction, as long as the officer completed firearms qualification earlier that calendar year",B:"No - correctional officers cannot carry firearms while on duty inside a facility unless there is an emergency and command has approved the issuance of firearms",C:"Only officers with 10+ years of experience may carry firearms inside the facility under any circumstance",D:"Only during scheduled firearms qualification days, and nowhere else inside the facility"},
correct:"B",
explanation:"The curriculum is explicit that correctional officers cannot carry firearms while on duty inside a correctional facility, except during an emergency where command has specifically approved the issuance of firearms.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO327-024",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Facility-Issued Firearm Storage",difficulty:"applied",type:"scenario",
stem:"An officer is issued a firearm by their agency to carry off duty. When the officer enters the correctional facility for a shift, what must they do with that firearm?",
choices:{A:"Keep it on their person at all times, including inside the secure facility",B:"Secure it in a designated storage area or secured locker, and retrieve it when leaving the facility",C:"Leave it in their personal vehicle unsecured in the parking lot",D:"Hand it to any coworker for the duration of the shift"},
correct:"B",
explanation:"Officers issued a firearm to carry off duty or while performing official duties outside the facility are required to secure it in a designated storage area or secured locker upon entering the facility, and must retrieve it when they leave.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO327-025",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Radio Malfunction",difficulty:"applied",type:"scenario",
stem:"An officer experiences radio transmission difficulties while on duty. What should the officer do?",
choices:{A:"Wait until the end of the shift to report it",B:"Immediately use a landline telephone to report the malfunction",C:"Ignore it since radios rarely malfunction",D:"Attempt to repair the radio themselves regardless of training"},
correct:"B",
explanation:"The curriculum specifically instructs officers to immediately use a landline telephone to report a radio malfunction, since the radio may be the officer's lifeline in a dangerous situation and cannot be relied upon if not working properly.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO327-026",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"FCC Radio Restrictions",difficulty:"applied",type:"scenario",
stem:"Which of the following radio uses is specifically prohibited by the Federal Communications Commission (FCC)?",
choices:{A:"Using plain, clear language during an emergency",B:"Using profane, indecent, or obscene language over the radio",C:"Requesting assistance from another unit",D:"Identifying an inmate by name over the radio"},
correct:"B",
explanation:"The FCC specifically prohibits using profane, indecent, or obscene language over agency radios, along with other prohibited uses such as transmitting non-essential signals, maliciously interfering with another unit's transmission, and using the radio for personal business.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO327-027",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Radio Transmission Technique",difficulty:"foundational",type:"recall",
stem:"Before speaking into a portable radio, how long should an officer press and hold the transmit button, and how close should the microphone be to their mouth?",
choices:{A:"No need to hold before speaking; mouth should be 12 inches away",B:"About one second before speaking; mouth should be one to three inches from the microphone",C:"Five seconds before speaking; mouth should touch the microphone directly",D:"There is no standard technique for radio transmission"},
correct:"B",
explanation:"The curriculum specifically instructs pressing and holding the transmit button for about one second before speaking, and keeping the mouth one to three inches from the microphone, speaking directly into it.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO327-028",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Radio Codes",difficulty:"applied",type:"scenario",
stem:"A facility uses a communication system where the word 'signal' is followed by a number that conveys a specific meaning. What type of radio code is this?",
choices:{A:"Phonetic-alphabet code",B:"Signals",C:"10 or numeric code",D:"Numeric-alpha code"},
correct:"B",
explanation:"Signals are a system of communication using numbers that are preceded by the word 'signal,' distinct from 10-codes (where '10' precedes numbers), phonetic-alphabet codes (letters only), and numeric-alpha codes (combining numbers and letters).",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO327-029",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Radio Base Station",difficulty:"foundational",type:"recall",
stem:"What is a key capability of a radio base station operator during an emergency?",
choices:{A:"The ability to override the portable radio system",B:"The ability to physically lock down housing units",C:"The ability to issue disciplinary reports",D:"The ability to approve visitor requests"},
correct:"A",
explanation:"Radio base station operators, typically located in the control room or command center, have the ability to override the portable radio system in an emergency while monitoring frequencies for all operational units.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO327-030",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Sally Port Operation",difficulty:"higher",type:"scenario",
stem:"An officer is operating a sally port to admit a vehicle. What is the critical safety rule regarding the two gates?",
choices:{A:"Both gates should be opened simultaneously to speed up the process",B:"Never have both gates open at the same time unless emergency situations dictate otherwise",C:"Only the second gate needs to be monitored",D:"Gates may remain open indefinitely once unlocked"},
correct:"B",
explanation:"A sally port is specifically designed so only one gate opens at a time, creating a secure area between the two openings - the curriculum explicitly warns never to have both gates open simultaneously except in an emergency.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO327-031",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Security Equipment Types",difficulty:"foundational",type:"recall",
stem:"Which of the following is a type of facility security equipment specifically designed to disable or turn away unmanned aircraft?",
choices:{A:"Razor wire",B:"Drone barrier",C:"Sally port",D:"Thermal heat camera"},
correct:"B",
explanation:"A drone barrier is specifically designed to disable drones or cause them to turn around when they encounter a no-fly zone around the facility - a more modern addition to the traditional list of perimeter security equipment.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO327-032",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Security Inspections vs. Security Checks",difficulty:"higher",type:"scenario",
stem:"What is the key distinction between a security inspection and a security check?",
choices:{A:"They are the same procedure with different names used by different agencies across the state",B:"A security inspection verifies known elements of security, while a security check accounts for unknown or unexpected elements that could pose a risk",C:"Security inspections are done by supervisors only; security checks are done only by line staff on patrol at all times",D:"Security checks are only performed once per year"},
correct:"B",
explanation:"Security inspections are performed to verify known elements involved in security (like testing locks or examining fences), while security checks are performed to account for unknowns or the unexpected, and should be varied in schedule so inmates cannot predict them.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO327-033",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Medical Area Security Risk",difficulty:"higher",type:"scenario",
stem:"An inmate is receiving treatment at an outside mental health clinic that does not allow mechanical restraints. What security concern does this create?",
choices:{A:"None - clinics are always low-risk environments regardless of whether mechanical restraints are permitted there",B:"The lack of restraints, combined with new routines and requirements, can create an increased security risk and more opportunities for escape",C:"This only matters if the inmate has no prior disciplinary history documented in their classification file",D:"This concern only applies to state facilities, not county facilities, regardless of the clinic's own restraint policy"},
correct:"B",
explanation:"The curriculum specifically gives this example: when a clinic does not require or allow mechanical restraints, security is reduced, and the introduction of new routines and requirements creates more opportunities for escape - officers must inspect upon arrival, during the stay, and after leaving.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO327-034",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Basic Inspection Guidelines",difficulty:"foundational",type:"recall",
stem:"After completing a basic inspection, what should an officer do with the area they inspected?",
choices:{A:"Leave it exactly as it was found, never in disorder",B:"Rearrange it to make future inspections easier",C:"Lock it and prevent anyone from entering until the next scheduled inspection",D:"Leave a written note describing the inspection for the next shift only"},
correct:"A",
explanation:"One of the specific guidelines for completing a basic inspection is to leave the area the way it was found, never in disorder, in addition to inspecting in an orderly sequence and recording any deficiencies found.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO327-035",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Perimeter Patrol Documentation",difficulty:"applied",type:"scenario",
stem:"While patrolling the perimeter, an officer notices an unfamiliar vehicle parked near the fence with a person photographing the facility. What should the officer specifically document?",
choices:{A:"Nothing, since this is not a security concern unless the person is seen entering the facility itself",B:"The condition of gates, fences, lights, and cameras, and any unfamiliar or unauthorized people or vehicles observed near the perimeter",C:"Only the make and model of the vehicle, without noting the fence or lighting condition",D:"Only the physical description of the person, without noting the vehicle at all"},
correct:"B",
explanation:"The curriculum specifically lists documenting unfamiliar and unsecured vehicles in the parking lot and unfamiliar or unauthorized people filming or photographing the facility as required elements of perimeter patrol documentation, along with the general condition of gates, fences, lights, and cameras.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 3 (Unit 3)",sourceType:"textbook"},

{id:"CO327-036",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Responding to a Security Breach",difficulty:"applied",type:"scenario",
stem:"A confirmed breach in the facility's perimeter fence is discovered. What is one of the listed initial steps to resolve the breach?",
choices:{A:"Wait for the next scheduled shift to investigate the discrepancy found",B:"Immediately locking down the facility, performing a thorough security check, and formally counting the inmates",C:"Releasing all inmates from their housing units to search for the breach",D:"Disabling all security cameras to conserve resources during the response"},
correct:"B",
explanation:"Steps to resolve a confirmed security breach specifically include immediately locking down the facility, performing a thorough security check, and formally counting the inmates, with additional staff or specialized response teams called in as needed.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 3 (Unit 3)",sourceType:"textbook"},

{id:"CO327-037",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Safety Standards Organizations",difficulty:"foundational",type:"recall",
stem:"Which federal agency governs general workplace safety standards that may apply to a correctional facility?",
choices:{A:"OSHA (Occupational Safety and Health Administration)",B:"FDLE",C:"FCAC (Florida Corrections Accreditation Commission)",D:"ACA (American Correctional Association)"},
correct:"A",
explanation:"OSHA is the federal agency specifically listed among the organizations governing facility safety standards, alongside state and professional organizations like FCAC, ACA, FMJS, and NDS.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 1 (Unit 4)",sourceType:"statute"},

{id:"CO327-038",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Safety Deficiency Response",difficulty:"applied",type:"scenario",
stem:"An officer discovers frayed electrical cords in a common area, posing a potential safety hazard. What is the correct response?",
choices:{A:"Ignore it since it is a facilities maintenance issue only, unrelated to officer or inmate safety at all",B:"Notify the supervisor immediately and follow their directions to resolve the safety deficiency, with a follow-up inspection afterward",C:"Personally attempt to rewire the cords using whatever tools happen to be available",D:"Wait for the next scheduled facility inspection in several weeks"},
correct:"B",
explanation:"When a dangerous or hazardous item like frayed electrical cords is found, the officer must notify the supervisor immediately and follow their directions - after the deficiency is addressed, a follow-up inspection is conducted to confirm the issue is resolved.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 1 (Unit 4)",sourceType:"textbook"},

{id:"CO327-039",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Environmental Health Program",difficulty:"applied",type:"scenario",
stem:"Which of the following is specifically listed as a component of a facility's environmental health program?",
choices:{A:"A weekly inmate talent show held in the facility's recreation yard for morale",B:"Effective elimination of rodents and pests, and measures to prevent the spread of infectious diseases",C:"A mandatory annual raise for correctional staff tied to facility inspection scores",D:"A visitor rewards program"},
correct:"B",
explanation:"Effective pest and rodent elimination, along with measures to prevent the spread of infectious diseases, are specifically listed as components of a complete environmental health program, alongside sanitary food preparation, adequate ventilation, and proper waste disposal.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 4)",sourceType:"textbook"},

{id:"CO327-040",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Common Facility Health Hazards",difficulty:"foundational",type:"recall",
stem:"Which of the following is specifically listed as a common health hazard found in a correctional facility?",
choices:{A:"Broken vending machines located in the inmate dayroom or recreation area",B:"Parasitic outbreaks such as scabies and lice, and viral/bacterial illnesses such as TB, HIV, and MRSA",C:"Outdated recreational equipment used during scheduled yard time",D:"Excessive noise from construction"},
correct:"B",
explanation:"The curriculum specifically lists parasitic outbreaks like scabies and lice, along with viral and bacterial illnesses such as tuberculosis, HIV, MRSA, and COVID-19, as common health hazards found in a correctional facility.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 4)",sourceType:"textbook"},

{id:"CO327-041",subject:"CJK 0327",subjectName:"Shift Management and Safety",subtopic:"Hazardous Equipment Supervision",difficulty:"applied",type:"scenario",
stem:"An inmate work crew is issued power tools, including an electric drill and a chainsaw, for a maintenance project. What is required while these tools are in use?",
choices:{A:"No special supervision is required as long as the tools are returned at the end of the day",B:"Direct supervision must always be provided when hazardous equipment is transported and in use",C:"Only a written log of tool checkout is required, with no supervision necessary",D:"Supervision is only required for cutting tools, not power tools"},
correct:"B",
explanation:"The curriculum specifically requires that direct supervision must always be provided when hazardous equipment - such as power tools, cutting tools, or culinary instruments - is transported and in use, given the risk that inmates could use these tools to commit an assault or aid an escape.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 5, Lesson 2 (Unit 1)",sourceType:"textbook"},


// ============ CJK 0301 - INTRODUCTION TO CORRECTIONS DEEPENING BATCH ============
{id:"CO301-013",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Emotional Intelligence",difficulty:"applied",type:"scenario",
stem:"An officer wants to strengthen their emotional intelligence. Which strategy does the curriculum specifically recommend?",
choices:{A:"Suppressing all emotions while on duty so they never show, even to trusted colleagues off duty or during a debrief",B:"Naming your emotions by asking yourself what you are feeling and how you normally respond, and asking colleagues for honest feedback on how you handle tense situations",C:"Avoiding any situation that might cause a strong emotional reaction, on or off duty, rather than naming or processing the feeling at all",D:"Relying solely on a supervisor to manage emotional reactions for you, rather than any self-reflection at all"},
correct:"B",
explanation:"The curriculum specifically recommends naming your emotions - reflecting on what you are feeling and how you typically respond - and asking fellow officers or command staff for honest feedback on how you handle tense situations, as concrete ways to strengthen emotional intelligence.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO301-014",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"CJSTC Oversight",difficulty:"foundational",type:"recall",
stem:"Which entity specifically oversees the certification, employment, training, and maintenance of officer records, as well as the conduct of all criminal justice officers in Florida?",
choices:{A:"The Florida Department of Corrections (FDC)",B:"The Criminal Justice Standards and Training Commission (CJSTC)",C:"The Florida Model Jail Standards (FMJS) Working Group",D:"The American Correctional Association (ACA)"},
correct:"B",
explanation:"The CJSTC specifically oversees the certification, employment, training, and maintenance of officer records, along with the conduct of all criminal justice officers in Florida, supported administratively by the Criminal Justice Professionalism Division within FDLE.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO301-015",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"State Officer Certification Examination",difficulty:"foundational",type:"recall",
stem:"How many attempts does a recruit have to pass the SOCE after completing the basic recruit training program before being required to retake the entire training program?",
choices:{A:"One attempt only",B:"Two attempts",C:"Three attempts",D:"Unlimited attempts"},
correct:"C",
explanation:"A recruit must pass the SOCE within three attempts after completing basic recruit training - if they do not pass within three attempts, they must retake the entire basic recruit training program.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO301-016",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Certification Deadline",difficulty:"higher",type:"scenario",
stem:"A recruit begins basic recruit training on July 1, 2025. By what date must they meet all requirements and become actively employed as a sworn officer, or else be required to repeat basic recruit training?",
choices:{A:"December 31, 2025",B:"July 1, 2027",C:"June 30, 2029",D:"There is no deadline as long as they eventually pass the SOCE"},
correct:"C",
explanation:"A recruit has four years from the start date of their basic recruit training - not from the date they pass the SOCE - to complete the full certification process. Starting July 1, 2025, this deadline would fall on June 30, 2029.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO301-017",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Mandatory Certification Revocation",difficulty:"higher",type:"scenario",
stem:"An officer is convicted of a felony offense, but the court withholds adjudication and suspends the sentence. What must the CJSTC do regarding this officer's certification?",
choices:{A:"Nothing, since adjudication was withheld and the officer was never formally convicted of the underlying felony offense",B:"The CJSTC must revoke the officer's certification, since Florida law requires revocation for any felony conviction even when adjudication is withheld or the sentence is suspended",C:"The CJSTC may issue only a written reprimand, leaving the officer's certification fully intact regardless of the felony conviction on record",D:"The CJSTC must wait until the officer completes any probation before taking action of any kind on the certification"},
correct:"B",
explanation:"Under Florida law, the CJSTC must revoke certification for any felony conviction, guilty plea, or nolo contendere plea, even when adjudication is withheld or the sentence is suspended - this is a mandatory, not discretionary, action.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 1)",sourceType:"statute"},

{id:"CO301-018",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"CJSTC Discipline Range",difficulty:"foundational",type:"recall",
stem:"Which of the following is NOT one of the possible penalties the CJSTC may impose on an officer's certification?",
choices:{A:"A written reprimand",B:"Probation of up to two years",C:"A monetary fine paid directly to the inmate involved",D:"Revocation of certification"},
correct:"C",
explanation:"The curriculum lists the possible CJSTC penalties as a written reprimand, probation of up to two years, suspension of up to two years, and revocation of certification - a monetary fine paid to an inmate is not among the listed disciplinary options.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO301-019",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Three Components of Criminal Justice",difficulty:"foundational",type:"recall",
stem:"What are the three main components of the U.S. criminal justice system?",
choices:{A:"Police, prosecutors, and defense attorneys",B:"Law enforcement, the courts, and corrections",C:"Local, state, and federal government",D:"Prevention, intervention, and rehabilitation"},
correct:"B",
explanation:"The U.S. criminal justice system is made up of three main components that work together: law enforcement (which enforces laws and protects rights), the courts (which interpret laws and set sentencing guidelines), and corrections (which enforces sentences and provides rehabilitation).",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO301-020",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Law Enforcement Levels",difficulty:"applied",type:"scenario",
stem:"Which type of law enforcement agency traditionally handles unincorporated areas, the county jail, and civil processing?",
choices:{A:"Municipal law enforcement",B:"County law enforcement, such as a sheriff's office",C:"State law enforcement",D:"Federal law enforcement"},
correct:"B",
explanation:"County law enforcement agencies, such as a sheriff's office, traditionally handle unincorporated areas, the county jail, and civil processing, in addition to enforcing county ordinances and state laws within the county.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO301-021",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Court Jurisdiction",difficulty:"applied",type:"scenario",
stem:"A court hears only traffic offenses and landlord-tenant disputes, not the full range of criminal and civil cases. This type of court has:",
choices:{A:"General jurisdiction",B:"Limited jurisdiction",C:"Appellate jurisdiction only",D:"Federal jurisdiction"},
correct:"B",
explanation:"Courts of limited jurisdiction decide only a limited set of case types, such as traffic offenses, violations of municipal and county ordinances, and landlord-tenant disputes - distinct from courts of general jurisdiction, which hear a wide range of civil and criminal cases.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO301-022",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Probation vs. Parole vs. Community Control",difficulty:"higher",type:"scenario",
stem:"Which community-based correction is the MOST restrictive, and is also known as house arrest?",
choices:{A:"Probation",B:"Parole",C:"Community control",D:"Pretrial release"},
correct:"C",
explanation:"Community control, also known as house arrest, is specifically described as more restrictive than probation or parole - it is a form of closely monitored community supervision, distinct from probation (a court-ordered sentence under supervision) or parole (conditional release from incarceration).",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO301-023",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Florida Department of Corrections Structure",difficulty:"applied",type:"scenario",
stem:"Which division of the Florida Department of Corrections (FDC) oversees supervision programs including probation and community control, as distinct from the division managing facilities where inmates reside?",
choices:{A:"The Office of Institutions",B:"The Office of Community Corrections",C:"The Criminal Justice Professionalism Division",D:"The Office of Inspector General"},
correct:"B",
explanation:"The Office of Community Corrections oversees supervision programs including probation and community control, while the Office of Institutions manages the facilities where inmates actually reside - these are FDC's two main divisions overseeing inmates and offenders.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO301-024",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"County Jails vs. Prisons",difficulty:"applied",type:"scenario",
stem:"An offender is convicted of a felony and sentenced to 3 years of incarceration. Which type of facility is this offender most likely sent to?",
choices:{A:"A county jail, since all felony sentences of any length are served there",B:"A prison, since prisons confine people convicted of felonies with sentence lengths exceeding one year",C:"A juvenile assessment center, regardless of the offender's actual age",D:"A treatment and evaluation center only"},
correct:"B",
explanation:"Prisons confine people convicted of felonies with sentence lengths that exceed one year, unlike county jails, which handle intake processing, pretrial detention, and short-term sentences of a year or less.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO301-025",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Chain of Command Definition",difficulty:"foundational",type:"recall",
stem:"What is the 'chain of command'?",
choices:{A:"A list of every rule in the facility's inmate handbook, organized by housing unit and disciplinary category",B:"The order of authority within an organization, providing the links of authority and responsibility joining one level to another",C:"A term used only during emergency evacuations, unrelated to the facility's everyday reporting structure",D:"A written log of visitor entries, maintained separately from the facility's organizational structure"},
correct:"B",
explanation:"The chain of command is defined as the order of authority within an organization - it provides the links of authority and responsibility that join one level of an organization to another, clarifying who is responsible for which decisions.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 4 (Unit 1)",sourceType:"textbook"},

{id:"CO301-026",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Vertical vs. Lateral Communication",difficulty:"applied",type:"scenario",
stem:"At shift change, an outgoing officer tells the oncoming officer that an inmate was recently informed of a family member's death and may need closer observation. What type of communication is this?",
choices:{A:"Vertical communication, since the information is being passed from one shift to the officer replacing them",B:"Lateral communication - information shared between people at the same level in the organization",C:"Delegation of authority, since the outgoing officer is assigning a task to the oncoming officer",D:"Insubordination, since the outgoing officer is instructing the oncoming officer on how to do their job"},
correct:"B",
explanation:"Lateral communication is information shared between people at the same level in the organization, and the curriculum specifically gives shift-change reports about a distraught inmate as an example - distinct from vertical communication, which flows between different levels of the chain of command.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 4 (Unit 1)",sourceType:"textbook"},

{id:"CO301-027",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Bypassing the Chain of Command",difficulty:"higher",type:"scenario",
stem:"During a medical emergency, an officer's direct supervisor is not immediately available. What is the correct action?",
choices:{A:"Wait indefinitely for the direct supervisor to become available before taking any action, even during an active medical emergency",B:"Contact medical or the communications center immediately, since this is an appropriate reason to bypass the normal chain of command, and then notify the supervisor as soon as possible",C:"Never bypass the chain of command under any circumstances, regardless of how urgent the medical situation becomes for the patient",D:"Only a supervisor may contact medical services directly; a line officer must wait for that specific authorization first, even in an emergency situation"},
correct:"B",
explanation:"The curriculum specifically allows bypassing the chain of command in emergency situations like a medical emergency when the direct supervisor is unavailable - the officer should contact medical or the communications center immediately, then notify the supervisor as soon as possible afterward.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 4 (Unit 1)",sourceType:"textbook"},

{id:"CO301-028",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Insubordination",difficulty:"applied",type:"scenario",
stem:"An officer receives a lawful order from one supervisor but delays acting on it while searching for a different supervisor who might give a more favorable order. This behavior is best described as:",
choices:{A:"Appropriate use of the chain of command to escalate a legitimate disagreement",B:"Insubordination - the intentional refusal to follow lawful orders from supervisors in the chain of command",C:"Lateral communication between officers at the same organizational level",D:"Delegation of authority"},
correct:"B",
explanation:"This is the curriculum's own example of insubordination - the intentional refusal to follow a lawful order by delaying action while seeking a more favorable order from someone else in the chain of command.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 4 (Unit 1)",sourceType:"textbook"},

{id:"CO301-029",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Delegation of Authority",difficulty:"higher",type:"scenario",
stem:"A warden assigns a specific task and its associated decision-making authority to a captain. If the task is later handled incorrectly, who is ultimately responsible for the outcome?",
choices:{A:"Only the captain who was delegated the task, not anyone above them in rank",B:"The warden - the person who delegates authority is ultimately responsible for the outcome, even if the task was given to a subordinate",C:"No one, since responsibility passes entirely once authority has been delegated downward to a subordinate",D:"Only the officer who directly executed the task"},
correct:"B",
explanation:"The curriculum specifically states that the person who delegates authority is ultimately responsible for the outcome, even when they have assigned the task to a subordinate - delegation does not eliminate the delegator's own accountability.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 4 (Unit 1)",sourceType:"textbook"},

{id:"CO301-030",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Basic Recruit Training Requirements",difficulty:"foundational",type:"recall",
stem:"What minimum passing score must a recruit achieve on each end-of-course examination to complete the basic recruit training program?",
choices:{A:"60%",B:"70%",C:"80%",D:"90%"},
correct:"C",
explanation:"The curriculum specifically requires recruits to achieve a passing score of 80% on each of the end-of-course examinations to complete the basic recruit training program, in addition to demonstrating proficiency in High Liability courses and completing the Physical Fitness Program.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO301-031",subject:"CJK 0301",subjectName:"Introduction to Corrections",subtopic:"Governing Law by Facility Type",difficulty:"applied",type:"scenario",
stem:"A correctional officer works at a county jail rather than a state prison. Which set of standards, in addition to the Florida Statutes, specifically governs this officer's facility?",
choices:{A:"The Florida Administrative Code (F.A.C.) only",B:"The Florida Model Jail Standards (FMJS)",C:"Federal Bureau of Prisons regulations",D:"No standards beyond general Florida Statutes apply to county facilities"},
correct:"B",
explanation:"County facility officers are governed by the Florida Statutes and the Florida Model Jail Standards (FMJS), the minimum standards all local jails must comply with - state facility officers, by contrast, are governed by the Florida Statutes and F.A.C.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 1, Lesson 2 (Unit 1)",sourceType:"textbook"},


// ============ CJK 0040 - FIREARMS DEEPENING BATCH ============
{id:"CO040-013",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Pistol Nomenclature",difficulty:"foundational",type:"recall",
stem:"Which part of a semiautomatic pistol houses the firing pin, barrel, recoil spring, sights, and extractor?",
choices:{A:"The frame",B:"The slide",C:"The magazine",D:"The trigger guard"},
correct:"B",
explanation:"The slide is the component that houses the firing pin, barrel, recoil spring, sights, and extractor, and it moves rearward and forward during the pistol's cycle of operation.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO040-014",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Magazine Parts",difficulty:"foundational",type:"recall",
stem:"Which magazine part pushes the follower upward so ammunition can be stripped off by the forward movement of the slide?",
choices:{A:"The magazine tube",B:"The spring",C:"The magazine insert",D:"The floor/butt plate"},
correct:"B",
explanation:"The spring pushes the follower upward, which in turn positions the round to be stripped off by the slide's forward movement - the follower itself activates the slide stop once the magazine is empty.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO040-015",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Cycle of Operation",difficulty:"applied",type:"scenario",
stem:"During the cycle of operation, which step specifically involves the breech or back end of the barrel locking into the slide?",
choices:{A:"Feeding/chambering",B:"Locking",C:"Extraction",D:"Cocking"},
correct:"B",
explanation:"Locking is the specific step in the cycle of operation where the breech or back end of the barrel locks into the slide, occurring after feeding/chambering and before firing.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO040-016",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Handing Off a Firearm",difficulty:"applied",type:"scenario",
stem:"An officer needs to safely hand their semiautomatic pistol to another person. In what condition should the firearm be when handed over?",
choices:{A:"Loaded with a full magazine and a round already chambered and ready",B:"With the slide locked to the rear and the magazine well empty, handed over grip first",C:"With the safety off and the hammer fully cocked back",D:"With the magazine inserted but the chamber empty"},
correct:"B",
explanation:"To safely hand off a semiautomatic pistol, the magazine should be removed and secured, the chamber cleared, and the slide locked to the rear with the magazine well empty - the firearm is then handed over grip first, and the receiving person should independently verify it is unloaded.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO040-017",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Squib Load",difficulty:"higher",type:"scenario",
stem:"An officer fires a round that sounds like a quiet 'pop' instead of a normal 'bang,' with noticeably less recoil. What malfunction does this most likely indicate, and why is it dangerous?",
choices:{A:"A failure to feed, caused by a damaged magazine, which is not a significant safety concern at all beyond reliability",B:"A squib load - the primer ignites with no or only partial powder burn, which can cause the bullet to become lodged in the bore, creating a major safety hazard if another round is fired",C:"A double feed, caused by two cartridges entering the chamber at once, which only affects reliability, not safety, and clears itself easily",D:"Normal ammunition variation from a different manufacturer, requiring no special response of any kind from the officer"},
correct:"B",
explanation:"A squib load produces a distinctly quieter pop sound and less recoil because the primer ignites with no or only partial powder burn - this can leave the bullet lodged in the bore, creating a serious safety hazard if the officer attempts to fire another round without clearing it.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 4 (Unit 3)",sourceType:"textbook"},

{id:"CO040-018",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Squib Load Response",difficulty:"applied",type:"scenario",
stem:"During range training, a recruit experiences what they suspect is a squib load. What is the correct response?",
choices:{A:"Try to clear it themselves using Phase I clearance without instructor involvement or approval of any kind",B:"Stop firing, keep the firearm pointed downrange, raise the support hand, and wait for the range instructor to take the firearm",C:"Continue firing to clear the obstruction with the next round chambered",D:"Disassemble the firearm immediately to inspect the barrel"},
correct:"B",
explanation:"A squib load requires the recruit to stop firing, keep the firearm pointed downrange, raise their support hand, and wait for the range instructor - squib loads are the one malfunction type recruits are not expected to clear themselves, since range instructors are specifically responsible for clearing this malfunction.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 4 (Unit 3)",sourceType:"textbook"},

{id:"CO040-019",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Malfunction Types",difficulty:"applied",type:"scenario",
stem:"An officer's pistol experiences a malfunction where a fired cartridge case does not completely eject and becomes caught in the ejection port. This specific malfunction is commonly called:",
choices:{A:"A double feed",B:"A stovepipe (failure to eject)",C:"A squib load",D:"A failure to feed"},
correct:"B",
explanation:"A stovepipe, or failure to eject, occurs when a fired cartridge case does not completely eject - common causes include a weak powder charge, a dry (under-lubricated) weapon, or the shooter limp-wristing the firearm.",
source:"Florida Basic Recruit Training Program: High Liability, Vol. 2, Ch. 3, Lesson 4 (Unit 3)",sourceType:"textbook"},

{id:"CO040-020",subject:"CJK 0040",subjectName:"Criminal Justice Firearms",subtopic:"Leading Cause of Malfunctions",difficulty:"foundational",type:"recall",
stem:"What is identified as the leading cause of malfunctions in semiautomatic pistols?",
choices:{A:"Using the wrong caliber of ammunition",B:"Failure to properly seat the magazine",C:"Firing too rapidly",D:"Using a weapon-mounted flashlight"},
correct:"B",

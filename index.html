stem:"According to the curriculum, when is the risk of inmate death elevated following jail admission?",
choices:{A:"There is no elevated period; risk is constant throughout incarceration",B:"In the first seven days of admission, and especially for inmates under the influence",C:"Only during the final week before release",D:"Only for inmates over the age of 65"},
correct:"B",
explanation:"The curriculum specifically notes there is a higher risk of inmate deaths in the first seven days of admission to jail, and that inmates who are under the influence face an even higher risk - a key safety consideration during intake and initial housing decisions.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 4",sourceType:"textbook"},

{id:"CO321-024",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Gain-Time",difficulty:"foundational",type:"recall",
stem:"What is gain-time?",
choices:{A:"Extra visitation hours awarded for good grades earned in an educational or vocational program during the entire term of the sentence served",B:"Time off an inmate's sentence, earned through participation in work programs, completing education or classes, or performing an outstanding deed, and subject to forfeiture for poor behavior",C:"A mandatory minimum extension added to a sentence whenever an inmate commits any disciplinary infraction, no matter how minor",D:"Overtime pay awarded to correctional officers who supervise extra work squad hours beyond a scheduled normal shift assignment"},
correct:"B",
explanation:"Gain-time allows eligible inmates to receive time off their sentence for participation in work programs, completing programs or classes such as a GED, or performing an outstanding deed - and just as it can be earned, it can also be forfeited or withheld for misconduct.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 5",sourceType:"textbook"},

{id:"CO321-025",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Types of Release",difficulty:"applied",type:"scenario",
stem:"An arrestee pays a designated fee to the court to guarantee their appearance at a later trial date. If they fail to appear, the money is forfeited and a warrant is issued. This describes:",
choices:{A:"Release on own recognizance (ROR)",B:"Posting of bond",C:"Expiration of sentence (EOS)",D:"A discharge gratuity"},
correct:"B",
explanation:"Posting of bond requires the arrestee to pay a designated fee to the court to ensure their court appearance; if they fail to appear, the posted money is forfeited and a warrant for arrest is issued - unlike ROR, which requires no payment at all.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 5",sourceType:"textbook"},

{id:"CO321-026",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Pre-Release Procedures",difficulty:"applied",type:"scenario",
stem:"Before physically releasing an inmate, which of the following is a required part of the process?",
choices:{A:"Checking for outstanding warrants or detainers through NCIC/FCIC background screening",B:"Automatically expunging the inmate's criminal record",C:"Issuing a new state-issued firearm license",D:"Releasing the inmate before any documentation is completed, to save time"},
correct:"A",
explanation:"Common pre-release procedures specifically include checking for outstanding warrants or detainers through NCIC/FCIC background screening, along with notifying medical staff, checking that special conditions have been satisfied, and documenting any grievances.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 5",sourceType:"textbook"},

{id:"CO321-027",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Property Release",difficulty:"applied",type:"scenario",
stem:"When releasing an inmate, what must an officer specifically verify to avoid an improper release of property?",
choices:{A:"That the inmate is not released with any unauthorized property, including facility-issued items like a uniform or identification card",B:"That the inmate's property has increased in value while stored in the property room",C:"That the inmate has signed a waiver releasing the facility from all liability entirely upon release",D:"That another inmate has verified the property inventory"},
correct:"A",
explanation:"Officers must make sure an inmate is not released while still possessing unauthorized property, which includes facility-issued items such as their uniform or identification card, in addition to properly returning the inmate's own stored personal property.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 5",sourceType:"textbook"},

{id:"CO321-028",subject:"CJK 0321",subjectName:"Intake and Release",subtopic:"Discharge Gratuity",difficulty:"applied",type:"scenario",
stem:"An inmate being released from a state facility is found to be indigent. What may this inmate be entitled to receive?",
choices:{A:"A full refund of all court costs paid during the sentence",B:"A discharge gratuity, as required by F.A.C., which may assist with basic necessities or a bus ticket",C:"Automatic expungement of the inmate's entire criminal record",D:"A guaranteed job placement through the Department of Corrections"},
correct:"B",
explanation:"An indigent inmate released from a state facility may be entitled to a discharge gratuity - money required by F.A.C. to assist qualified inmates with basic necessities such as a bus ticket - and the amount issued must be documented.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 6, Lesson 5, citing F.A.C.",sourceType:"statute"},


// ============ CJK 0324 - SUPERVISION IN A CORRECTIONAL FACILITY ============
{id:"CO324-001",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Complacency",difficulty:"applied",type:"scenario",
stem:"An officer has worked the same housing unit for years and has begun to feel that nothing unusual ever happens there, resulting in less attentive rounds. This state of declined vigilance and false sense of security is called:",
choices:{A:"Situational awareness",B:"Complacency",C:"Command presence",D:"De-escalation"},
correct:"B",
explanation:"Complacency is specifically defined as a state of declined vigilance and a false sense of security that can develop from the repetitive nature of correctional duties, and it can result in contraband entering the facility, inmate manipulation, and other dangerous incidents.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO324-002",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Observation - Hearing",difficulty:"applied",type:"scenario",
stem:"During sleeping hours, an officer hears repeated flushing of a toilet and scraping noises coming from a cell. What should the officer do?",
choices:{A:"Ignore it since noise at night is normal and rarely worth investigating at all",B:"Investigate the sounds immediately, since they could indicate a fight, sexual assault, the sharpening of a shank, or an escape attempt",C:"Wait until the morning shift to check on it, since nighttime noise complaints are a lower priority",D:"Assume it is simply plumbing noise and take no action of any kind"},
correct:"B",
explanation:"The curriculum specifically warns that unusual or excessive noise during sleeping hours - such as scraping or repeated toilet flushing - could indicate a fight, sexual assault, the sharpening of a shank, or an escape attempt, and must be investigated.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO324-003",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Blind Spots",difficulty:"foundational",type:"recall",
stem:"What are 'blind spots' in a correctional facility?",
choices:{A:"Areas that are always monitored by two officers stationed together at once",B:"Locations within a facility that have limited visibility, such as corners, closets, doorways, and stairwells",C:"Areas reserved exclusively for administrative staff during business hours",D:"Zones where cameras are intentionally disabled for privacy"},
correct:"B",
explanation:"Blind spots are locations with limited visibility, such as corners, closets, doorways, the rear of inmate dorms, and stairwells - these are difficult to monitor and pose a security concern, which is why surveillance equipment is used to help reduce them.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO324-004",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Types of Inmate Counts",difficulty:"applied",type:"scenario",
stem:"A count verifies positive identification of every inmate through armband or photo ID, is conducted at least once daily, and accounts for all admissions, releases, and returns over the previous 24 hours. This describes a:",
choices:{A:"Formal count",B:"Informal count",C:"Master count",D:"Out count"},
correct:"C",
explanation:"A master count specifically involves positive identification of each inmate through items like armbands or photo ID cards, is conducted at a specified time at least once daily, and accounts for everyone admitted, released, returned, or detained in the previous 24-hour period.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO324-005",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Types of Inmate Counts",difficulty:"applied",type:"scenario",
stem:"An inmate escape is suspected and a count is immediately ordered outside the normal count schedule to resolve the discrepancy. This is an example of a(n):",
choices:{A:"Informal count",B:"Out count",C:"Emergency count",D:"Master count"},
correct:"C",
explanation:"An emergency count - sometimes called a recount at some facilities - is conducted when unusual situations arise, such as a possible escape, a disturbance, an evacuation, or when a count total cannot be confirmed against the facility total.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO324-006",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Count Discrepancy",difficulty:"applied",type:"scenario",
stem:"Two officers conducting a count together arrive at different totals for the same area. What should they do first?",
choices:{A:"Report the higher of the two numbers to be safe",B:"Immediately recount the inmates in their count area before reporting the count",C:"Average the two numbers and report that figure",D:"Report the discrepancy without recounting and let the supervisor investigate"},
correct:"B",
explanation:"When two officers' counts do not match, they should immediately recount the inmates in their area before reporting - the count should only be reported to the next level once the officers' totals agree.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO324-007",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Count Slip",difficulty:"foundational",type:"recall",
stem:"What is a requirement for a formal count slip regarding how it may be completed?",
choices:{A:"It may contain erasures as long as they are initialed",B:"It cannot contain erasures, strikeouts, or alterations",C:"It must be typed and never handwritten",D:"It only requires a supervisor's signature, not the counting officer's"},
correct:"B",
explanation:"The curriculum specifically states that a count slip cannot contain erasures, strikeouts, or alterations, preserving the integrity of this critical safety and security document.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO324-008",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Signs of Disturbance",difficulty:"applied",type:"scenario",
stem:"An officer notices several inmates wearing boots in the shower and at night, and another inmate hoarding commissary items. Per the curriculum, these behaviors may indicate:",
choices:{A:"Normal personal preference with no security significance, similar to any other clothing or hygiene choice",B:"A possible impending incident - boots at night may indicate expectation of an incident, and hoarding may indicate an inmate expects lockdown",C:"A scheduled facility inspection, since boots and hoarded items are commonly checked routinely",D:"Preparation for a religious observance that requires special footwear and stored food items"},
correct:"B",
explanation:"The curriculum specifically lists wearing boots during showers and at night as a possible indicator of an expected incident, and hoarding commissary items as a possible sign an inmate expects to be placed in lockdown - both warrant closer attention.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO324-009",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Direct vs. Indirect Supervision",difficulty:"foundational",type:"recall",
stem:"What is the difference between direct and indirect supervision of a housing area?",
choices:{A:"Direct supervision uses only cameras with no officer physically present; indirect supervision uses only officers stationed inside the unit at all times instead",B:"Direct supervision occurs when correctional officers are physically present supervising inmates; indirect supervision occurs when a control room operator monitors from a central station, with or without cameras",C:"They are the same term used interchangeably, describing any officer's general awareness of a unit's activity at any given moment in a shift",D:"Indirect supervision is illegal in Florida correctional facilities and may never be used under any written agency policy whatsoever"},
correct:"B",
explanation:"Direct supervision means correctional officers are physically present with inmates, while indirect supervision means a control room operator monitors the facility from a central station, with or without the use of cameras - facilities may use one or a combination of both.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO324-010",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Escape Indicators",difficulty:"applied",type:"scenario",
stem:"During a housing area round, an officer notices an inmate possesses an excessive number of sheets and towels, and there is evidence of digging near a wall. These are indicators of:",
choices:{A:"A scheduled laundry exchange",B:"A possible escape attempt",C:"Normal inmate hoarding behavior with no security concern",D:"A religious ritual"},
correct:"B",
explanation:"Excessive sheets or towels and evidence of digging through walls or floors are both specifically listed as indicators of a possible escape, along with missing screws, broken windows, loose security bars, and maps drawn on walls or paper products.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO324-011",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Call Outs",difficulty:"foundational",type:"recall",
stem:"What is a 'call out' in a correctional facility?",
choices:{A:"A verbal warning issued during an inmate count when a discrepancy is first discovered by staff",B:"Authorization for a supervising officer or program supervisor to issue an inmate a pass to go to a location different from their housing unit",C:"A term for reporting a fire alarm to the facility's communications center directly during an active emergency",D:"A disciplinary hearing summons issued after a rule violation report is filed"},
correct:"B",
explanation:"A call out authorizes a supervising officer or program supervisor to issue an inmate a pass to a location other than their housing unit, such as for medical visits, programs, the library, visitation, or work assignments.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 1 (Unit 2)",sourceType:"textbook"},

{id:"CO324-012",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Common Area Searches",difficulty:"applied",type:"scenario",
stem:"During a security check of the library, what should an officer specifically inspect for potential concealment or tampering?",
choices:{A:"Only the entrance and exit doors of the library during a routine check",B:"Computers for signs of tampering, books for hidden objects, and book carts for hidden compartments",C:"Only the librarian's desk, excluding the surrounding shelving and furniture",D:"Nothing, since libraries are considered low-risk areas"},
correct:"B",
explanation:"The curriculum specifically lists checking library computers for signs of tampering or hidden programs, books for hidden objects, and book carts for hidden compartments that could be used to transfer contraband.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 2)",sourceType:"textbook"},

{id:"CO324-013",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Medical Devices as Contraband Concealment",difficulty:"higher",type:"scenario",
stem:"During a pre-meal security check, an officer wants to examine an inmate's cast for hidden contraband. Per F.A.C., who may examine bandages or casts?",
choices:{A:"Any correctional officer on duty",B:"Only medical staff",C:"Only the shift supervisor",D:"Any officer with at least one year of experience"},
correct:"B",
explanation:"According to F.A.C., bandages or casts may be examined only by medical staff - correctional officers should not attempt to inspect medical devices like casts themselves, given the medical expertise required and injury risk involved.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 3 (Unit 2), citing F.A.C.",sourceType:"statute"},

{id:"CO324-014",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Special Management Meal Status",difficulty:"applied",type:"scenario",
stem:"An inmate repeatedly throws food trays and uses utensils to fling waste at staff. Per FMJS, what may this inmate be placed on, and who must approve it?",
choices:{A:"A hunger strike protocol, approved by a supervisor rather than medical staff",B:"Special management meal status, with approval from a physician or other qualified medical staff member",C:"An automatic loss of all meals for 24 hours, approved by any officer on duty",D:"A permanent transfer to another facility, approved by the warden"},
correct:"B",
explanation:"FMJS allows inmates who misuse food, beverages, utensils, or trays - including using them to throw waste - to be placed on special management meal status, but this requires approval from a physician or other qualified medical staff member and must still meet minimum daily nutrition requirements.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 3 (Unit 2), citing FMJS",sourceType:"statute"},

{id:"CO324-015",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Infirmary Care Definition",difficulty:"foundational",type:"recall",
stem:"Infirmary-level care is generally required for a patient who:",
choices:{A:"Has a routine dental cleaning scheduled for later in the week",B:"Requires intensive care for 24 hours or more, or skilled nursing care, without needing hospitalization",C:"Requests an over-the-counter pain reliever for a minor headache",D:"Is scheduled for a standard annual physical"},
correct:"B",
explanation:"Infirmary-level care applies to patients who require intensive care for a period of 24 hours or more, or need skilled nursing care without requiring hospitalization - covering chronic illness care, acute injury care, wound care, and non-ambulatory inmates.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO324-016",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Sick Call",difficulty:"foundational",type:"recall",
stem:"Regarding an inmate's right to a sick call, which statement is accurate?",
choices:{A:"All inmates have a right to a sick call, but they are required to pay for sick call visits",B:"Sick calls are completely free and unlimited for every inmate at the facility",C:"Only inmates in the infirmary may request a sick call",D:"Sick calls require a court order to be formally approved beforehand"},
correct:"A",
explanation:"All inmates have a right to a sick call, but the curriculum specifically notes that inmates are required to pay for sick call visits - fabricating a medical condition or need to request one can result in a disciplinary report.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO324-017",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Infirmary Security",difficulty:"applied",type:"scenario",
stem:"What are identified as the main security concerns when supervising inmates in the infirmary?",
choices:{A:"Excessive noise and overcrowding within the assigned housing unit itself",B:"Contraband and staff assaults, since medical tools and devices can be used as weapons",C:"Only visitation scheduling conflicts arising from staff shortages",D:"Loss of paperwork"},
correct:"B",
explanation:"The infirmary is identified as a high-risk area specifically because contraband and staff assaults are major concerns - medical tools and devices such as needles and small scissors can be used as weapons and easily concealed.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 4 (Unit 2)",sourceType:"textbook"},

{id:"CO324-018",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Contact vs. Non-Contact Visits",difficulty:"foundational",type:"recall",
stem:"What distinguishes a contact visit from a non-contact visit?",
choices:{A:"Contact visits are reserved only for attorneys, while non-contact visits are reserved only for family members visiting on weekends or state holidays, per this rule",B:"In a contact visit, the visitor and inmate are in the same room with limited physical contact and no physical barrier; in a non-contact visit, they are physically separated by a barrier or communicate electronically",C:"Contact visits always occur online through a scheduled video platform, while non-contact visits are always conducted fully in person with no barrier",D:"There is no meaningful legal or procedural distinction between the two; the terms are used interchangeably across every Florida facility and agency"},
correct:"B",
explanation:"Contact visits occur in the same room without a physical barrier between visitor and inmate, allowing limited physical contact, while non-contact visits physically separate the two by a barrier or require electronic communication such as audio/video systems.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO324-019",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Visitation Rights",difficulty:"higher",type:"scenario",
stem:"An inmate's social visitation privileges are revoked following a rule violation, but the inmate insists their attorney visit must also be canceled as a related consequence. Is this correct?",
choices:{A:"Yes, all visitation - social and professional - can be revoked together as a single combined privilege following any rule violation at all",B:"No, because social visitation is a privilege that can be restricted, but attorney visits are considered a right and are generally not restricted absent a safety or security conflict",C:"Yes, but only if a judge specifically approves revoking the attorney visit along with the social visitation privilege",D:"No, because neither type of visitation can ever be restricted under any circumstance at all, regardless of the violation"},
correct:"B",
explanation:"The curriculum draws a clear distinction: social visitation is a privilege (not a right) and can be lost due to rule violations, while professional visits with attorneys are considered a right and are not restricted unless there is a genuine conflict with facility safety and security.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO324-020",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Visitor Identification",difficulty:"applied",type:"scenario",
stem:"An attorney arrives to visit a client and presents a driver's license but not their Bar card. What is the correct procedure?",
choices:{A:"Allow entry since a driver's license alone is always sufficient for any visitor, including attorneys, regardless of Bar membership",B:"Deny entry entirely with no further discussion, since visiting attorneys are specifically required to show their Bar card along with other identification",C:"Allow entry only if the officer personally recognizes the attorney from a previous visit to the facility",D:"Allow entry and address the missing Bar card afterward, since the visit itself takes priority over the paperwork"},
correct:"B",
explanation:"Visiting attorneys are specifically required to show their Bar card in addition to other forms of identification - presenting only a driver's license, without the Bar card, does not meet this requirement.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO324-021",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Ballooning",difficulty:"higher",type:"scenario",
stem:"What does the term 'ballooning' refer to in the context of visitation contraband smuggling?",
choices:{A:"Using a balloon animal as a distraction technique during a scheduled visitation",B:"Placing contraband in a sealed balloon and concealing it in a body cavity or swallowing it for later expulsion",C:"Inflating a facility alarm system manually to signal an emergency",D:"A method of passing written notes disguised as party decorations"},
correct:"B",
explanation:"Ballooning is a specific smuggling method where contraband is placed inside a sealed balloon and concealed in a body cavity or swallowed, to be retrieved later - officers should pay particular attention to visitor and inmate activity after a visitor uses the restroom.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 5 (Unit 2)",sourceType:"textbook"},

{id:"CO324-022",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Inside vs. Outside Work Squads",difficulty:"foundational",type:"recall",
stem:"What distinguishes an inside work squad from an outside work squad?",
choices:{A:"Inside squads work only at night; outside squads only during the daytime hours",B:"Inside squads do not go beyond the facility's security perimeter; outside squads work beyond that perimeter",C:"Inside squads are unpaid; outside squads are always compensated financially",D:"There is no meaningful difference between the two"},
correct:"B",
explanation:"Inside work squads perform duties that do not go beyond the security perimeter of the facility - such as maintenance, food service, or laundry - while outside work squads work beyond the perimeter, such as on road or grounds maintenance.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 6 (Unit 2)",sourceType:"textbook"},

{id:"CO324-023",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Work Squad Accountability",difficulty:"applied",type:"scenario",
stem:"An officer is supervising an outside work squad. How often should the officer call in security checks to the facility's control room?",
choices:{A:"Every 5 minutes",B:"Every 30 minutes",C:"Only once at the start of the work detail",D:"Only if a problem occurs"},
correct:"B",
explanation:"The curriculum specifically requires the supervising officer to call in security checks to the facility's control room every 30 minutes during a work squad detail, to maintain staff and inmate accountability and safety precautions.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 6 (Unit 2)",sourceType:"textbook"},

{id:"CO324-024",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Work Squad Escape",difficulty:"higher",type:"scenario",
stem:"An inmate escapes during an outside work detail while other inmates remain present. What is the officer's correct immediate priority?",
choices:{A:"Pursue the escaping inmate immediately, even if it means leaving the remaining inmates unsupervised in the work area",B:"Immediately assemble and secure the remaining inmates, then notify the facility with as much information as possible - do not abandon the remaining inmates to chase the escapee",C:"Wait for law enforcement to arrive before taking any action, including securing the remaining inmates who are present on scene at the time",D:"Order all inmates to chase down the escapee themselves while the officer separately radios the facility for backup"},
correct:"B",
explanation:"The curriculum explicitly instructs officers not to abandon the remaining inmates in an attempt to capture an escaping inmate - the priority is to immediately assemble and secure the remaining inmates and notify the facility of the escape with as much information as possible.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 6 (Unit 2)",sourceType:"textbook"},

{id:"CO324-025",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Hospital Restraints",difficulty:"applied",type:"scenario",
stem:"An inmate is restrained in a hospital bed. Per common practice, how should the leg restraint be applied?",
choices:{A:"One leg restraint to the inmate and the other to the bed rail",B:"One leg restraint to the inmate and the other to the bed frame, not the bed rail",C:"Both legs restrained to each other only, with no connection to the bed",D:"Restraints are never used in a hospital setting"},
correct:"B",
explanation:"Common practice is to apply one leg restraint to the inmate and the other to the bed frame - specifically not the bed rail, since a bed rail is not a secure enough anchor point to reliably prevent unauthorized movement.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 7 (Unit 2)",sourceType:"textbook"},

{id:"CO324-026",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Clinical Restraints vs. Security Restraints",difficulty:"higher",type:"scenario",
stem:"A physician orders that an inmate be placed in a padded room for their own safety following a medical crisis. Who has sole discretion over this decision?",
choices:{A:"The supervising correctional officer, who may order clinical seclusion during any medical crisis on shift",B:"The attending physician, who has sole discretion on clinical restraints and clinical seclusion based on specific medical needs",C:"The facility warden, who must personally approve any clinical restraint or seclusion order",D:"The inmate's family, who must consent before clinical seclusion or restraint may ever be used"},
correct:"B",
explanation:"Clinical seclusion - such as placing an inmate in a padded room - along with clinical restraints, is at the sole discretion of the attending physician based on medical needs, distinct from security restraint devices like handcuffs, which are controlled by correctional staff.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 7 (Unit 2)",sourceType:"textbook"},

{id:"CO324-027",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Escort Types",difficulty:"foundational",type:"recall",
stem:"What is the difference between an internal escort and an external escort?",
choices:{A:"Internal escorts are conducted within a facility's secure perimeter; external escorts occur outside that perimeter",B:"Internal escorts require no search; external escorts always require a strip search",C:"Internal escorts apply only to female inmates",D:"There is no meaningful difference"},
correct:"A",
explanation:"Internal escorts are conducted within a facility's secure perimeter, while external escorts occur outside of it - such as during an outside work detail or a chase vehicle following an ambulance.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO324-028",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Escort Positioning",difficulty:"applied",type:"scenario",
stem:"While escorting a single inmate through a hallway, where should the officer position themselves to best control movement?",
choices:{A:"Directly in front of the inmate",B:"To the rear and slightly to one side of the inmate",C:"Walking side by side, arm in arm",D:"At least 20 feet behind, out of sight"},
correct:"B",
explanation:"The curriculum recommends positioning yourself to the rear and slightly to one side of the inmate during an escort, which allows the officer to control movement and observe the inmate for diversionary tactics or escape attempts.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 1 (Unit 3)",sourceType:"textbook"},

{id:"CO324-029",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Transport Vehicle Segregation",difficulty:"applied",type:"scenario",
stem:"Which pair of inmates must be transported in separate compartments per the curriculum?",
choices:{A:"Two inmates from the same housing unit with no disciplinary history",B:"Co-defendant inmates",C:"Two inmates who work the same job assignment",D:"Two inmates who are the same age"},
correct:"B",
explanation:"Co-defendant inmates are specifically listed among the groups that must be transported in separate compartments, along with male and female inmates, juveniles and adults, high-profile inmates, violent inmates, suicidal inmates, and inmates with mental health conditions.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO324-030",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Chase Vehicle",difficulty:"foundational",type:"recall",
stem:"What is a 'chase vehicle' in the context of inmate transport?",
choices:{A:"A vehicle used exclusively for staff commuting between the facility and off-site training locations each week of the year",B:"An armed escort vehicle that follows or trails a transport vehicle to provide additional security, often used for high-level threats such as a death-row inmate",C:"A backup vehicle used only if the primary transport vehicle happens to break down somewhere en route",D:"A vehicle used to transport visitors, not inmates, to and from the facility"},
correct:"B",
explanation:"A chase vehicle, also called a trailing vehicle, is an armed escort vehicle that follows a transport vehicle to provide additional security, commonly used for high-threat transports such as death-row inmates or extremely violent inmates.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO324-031",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Restraining Inmates in Vehicles",difficulty:"higher",type:"scenario",
stem:"During transport, what is the correct method for restraining an inmate to the vehicle itself?",
choices:{A:"Handcuffing the inmate directly to a fixed point on the vehicle's frame",B:"Only standard seat belts and shoulder harnesses may be used to restrain an inmate to the vehicle",C:"Leg irons attached directly to the floor of the transport vehicle",D:"No restraint to the vehicle is ever permitted"},
correct:"B",
explanation:"The curriculum is explicit that inmates must not be restrained to the vehicle except through the use of standard seat belts and shoulder harnesses - other restraint devices like cuffs and waist chains restrain the inmate's body but are not used to fasten them to the vehicle structure itself.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO324-032",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Transport Disruption",difficulty:"higher",type:"scenario",
stem:"During transport, an inmate becomes disorderly and complains of a medical condition. What does the curriculum instruct regarding stopping the transport?",
choices:{A:"Always stop the transport immediately regardless of the circumstances present at the time",B:"Do not stop the transport; instead, immediately contact your agency with appropriate information and follow instructions",C:"Only stop if a supervisor gives written pre-approval before the transport departs",D:"Pull over and provide first aid regardless of location or safety"},
correct:"B",
explanation:"The curriculum specifically notes that during transport, if an inmate becomes non-compliant, combative, disorderly, or complains of a medical condition, the officer should not stop the transport, but should immediately contact the agency and follow instructions.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 3)",sourceType:"textbook"},

{id:"CO324-033",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Referral Language",difficulty:"applied",type:"scenario",
stem:"An officer is making a referral for an inmate showing psychological distress. Which description would be most useful to the service provider?",
choices:{A:"\"The inmate was acting weird.\" - a vague, unhelpful description of behavior",B:"\"The inmate was talking to the wall and appeared unresponsive, staring off into space.\"",C:"\"Something seemed off about the inmate today.\" - a vague, unhelpful description",D:"\"The inmate seemed like they needed help.\""},
correct:"B",
explanation:"The curriculum specifically warns against vague generalizations like \"acting weird\" and instead recommends specific, observable descriptions - such as noting the inmate was talking to the wall or unresponsive - which give the service provider more useful information.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 1 (Unit 4)",sourceType:"textbook"},

{id:"CO324-034",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Progressive Discipline",difficulty:"foundational",type:"recall",
stem:"What is 'progressive discipline' in a correctional facility?",
choices:{A:"A one-time maximum penalty applied to every rule violation regardless of severity or history",B:"A disciplinary process that progressively increases the penalty for an inmate who does not correct their behavior",C:"A discipline process reserved only for staff, not inmates, under this policy",D:"A system where all penalties are decided by a jury of inmates"},
correct:"B",
explanation:"Progressive discipline is the process by which penalties progressively increase for an inmate who fails to correct their behavior, designed to correct behavior while maintaining the safety, security, and order of the facility.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 4)",sourceType:"textbook"},

{id:"CO324-035",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Minor vs. Major Violations",difficulty:"applied",type:"scenario",
stem:"An inmate is found wearing their uniform improperly, with no other aggravating factors. This is generally considered:",
choices:{A:"A major rule violation requiring immediate isolation",B:"A minor infraction, an example of unacceptable behavior generally considered minor",C:"A criminal offense requiring outside law enforcement involvement",D:"Grounds for automatic transfer to a maximum-security facility"},
correct:"B",
explanation:"Wearing a uniform improperly is specifically given as an example of a minor infraction - a rule violation that results in a consequence beyond a verbal warning but does not rise to the level of maximum disciplinary sanctions.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 4)",sourceType:"textbook"},

{id:"CO324-036",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Major Rule Violations",difficulty:"applied",type:"scenario",
stem:"Which of the following is classified as a major rule violation?",
choices:{A:"Wearing a uniform slightly untucked",B:"Use of a weapon during an altercation",C:"Requesting an extra napkin at mealtime",D:"Arriving a few minutes late to a call out"},
correct:"B",
explanation:"Use of a weapon is specifically listed as a major rule violation, along with disorderly conduct, disrespectful behavior, violence, sexual activity, use of drugs or intoxicants, battery, and extortion - these carry the possibility of maximum disciplinary sanctions.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 4)",sourceType:"textbook"},

{id:"CO324-037",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Corrective Consultation Refusal",difficulty:"higher",type:"scenario",
stem:"An inmate refuses to sign a corrective consultation form after being counseled about a rule violation. What is the correct procedure?",
choices:{A:"The form is void and cannot be used once an inmate declines to sign it",B:"Document the refusal on the form; two officer signatures are required, and a copy is provided to the inmate within 24 hours",C:"The officer signs the inmate's name for them without any further documentation of the refusal",D:"No further documentation is needed if the inmate refuses"},
correct:"B",
explanation:"If an inmate refuses to sign a corrective consultation form, the officer documents the refusal, and in that case two officer signatures are required; a copy of the completed form must still be provided to the inmate within 24 hours.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 4)",sourceType:"textbook"},

{id:"CO324-038",subject:"CJK 0324",subjectName:"Supervision in a Correctional Facility",subtopic:"Disciplinary Report Timing",difficulty:"foundational",type:"recall",
stem:"Within what time frame must a disciplinary report (DR) generally be written after an incident is discovered?",
choices:{A:"Within 1 hour",B:"Within 24 hours",C:"Within 7 days",D:"Within 30 days"},
correct:"B",
explanation:"The curriculum specifies that a disciplinary report must be written within 24 hours from when the incident is discovered, ensuring timely documentation while the details remain fresh and reliable.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 7, Lesson 2 (Unit 4)",sourceType:"textbook"},


// ============ CJK 0326 - SUPERVISING CORRECTIONAL POPULATIONS ============
{id:"CO326-001",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Special Populations Overview",difficulty:"foundational",type:"recall",
stem:"Which statement about special populations in a correctional facility is accurate?",
choices:{A:"An inmate can only belong to one special population category at a time, since categories are treated as mutually exclusive by policy",B:"An inmate may belong to more than one special population group at the same time, such as having both a mental health condition and a physical disability",C:"Special populations are limited exclusively to inmates with physical disabilities, excluding mental health or other medical conditions",D:"Classification as a special population is permanent and cannot change"},
correct:"B",
explanation:"The curriculum specifically notes that while special populations are discussed individually, inmates may belong to more than one group simultaneously - for example, an inmate could have both a mental health condition and a physical disability.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO326-002",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Inmate Society Hierarchy",difficulty:"applied",type:"scenario",
stem:"Which group of inmates typically does NOT maintain a hierarchical leadership structure, according to the curriculum?",
choices:{A:"Security threat groups",B:"Elderly inmates and youthful offender societies",C:"Inmates from the same geographical region",D:"Inmates with similar socioeconomic status"},
correct:"B",
explanation:"The curriculum specifically notes that elderly inmates typically do not have a leader, and youthful offender societies often do not maintain the discipline required to keep a leadership structure, unlike other inmate societies that may follow hierarchical leadership.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 1 (Unit 1)",sourceType:"textbook"},

{id:"CO326-003",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"ADA Reasonable Accommodation",difficulty:"applied",type:"scenario",
stem:"An agency has a blanket policy that automatically excludes all inmates taking psychological medication from any work detail. Under the ADA, this policy is:",
choices:{A:"Fully compliant, since safety always outweighs ADA considerations in a correctional setting regardless of the accommodation available",B:"Likely a violation of the ADA, since it categorically excludes a group with disabilities rather than making individualized reasonable accommodations",C:"Compliant as long as it applies equally to all inmates taking psychological medication, regardless of their individual condition",D:"Irrelevant to ADA, since ADA does not apply to correctional facilities or their work-detail assignments"},
correct:"B",
explanation:"The curriculum specifically gives this exact example - a blanket policy declaring all inmates on psychological medications ineligible for work details - as an example that would likely violate the ADA, since it fails to consider individualized reasonable accommodations.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO326-004",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"ADA Determination",difficulty:"foundational",type:"recall",
stem:"Who determines whether an inmate has a disability covered by the ADA?",
choices:{A:"The correctional officer supervising the inmate at the time symptoms are reported to the housing unit",B:"This is generally determined during initial screenings or as needed by medical staff, not by the supervising correctional officer",C:"The inmate's cellmate, based on their own observation of the symptoms",D:"The inmate alone, through self-declaration with no verification"},
correct:"B",
explanation:"As a correctional officer, you do not determine whether an inmate has an ADA-covered disability - this determination is generally made during initial screenings or as needed during incarceration, typically by medical staff.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 2 (Unit 1)",sourceType:"textbook"},

{id:"CO326-005",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Suicidal Ideation Response",difficulty:"higher",type:"scenario",
stem:"An officer suspects an inmate may be experiencing suicidal ideation. What is the recommended direct question to ask?",
choices:{A:"\"Are you feeling okay today?\"",B:"\"Are you thinking about killing yourself?\"",C:"\"Do you need anything from the canteen?\"",D:"Officers should never ask directly, only observe"},
correct:"B",
explanation:"The curriculum specifically recommends a direct, clear question such as \"Are you thinking about killing yourself?\" - even if the inmate denies it, the officer should not assume there is no risk, and should still remove potential threats, increase supervision, and alert medical/mental health/supervisory staff.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO326-006",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Suicide Risk Timing",difficulty:"foundational",type:"recall",
stem:"When is the risk of suicide among inmates generally highest?",
choices:{A:"There is no elevated period; risk is constant throughout incarceration",B:"Within the first seven days of admission to a facility",C:"Only in the final week before a scheduled release",D:"Only among inmates over age 60"},
correct:"B",
explanation:"Consistent with the risk noted for overall inmate mortality, the curriculum specifically notes there is a higher risk of suicide within the first seven days of admission to a correctional facility.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO326-007",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Psychosis",difficulty:"applied",type:"scenario",
stem:"An inmate firmly believes they are a government agent despite no evidence supporting this and clear evidence to the contrary. This is best described as:",
choices:{A:"A hallucination",B:"A delusion",C:"Mania",D:"A panic attack"},
correct:"B",
explanation:"A delusion is a false belief that is firmly held despite obvious proof or evidence to the contrary - distinct from a hallucination, which is a sensory experience (seeing, hearing, etc.) of something that is not actually there.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO326-008",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Communicating During Psychosis",difficulty:"higher",type:"scenario",
stem:"An officer needs to enter the cell of an inmate experiencing a psychotic episode. What is the correct approach?",
choices:{A:"Enter alone quickly to minimize the inmate's stress during a psychological crisis",B:"Never approach alone - have a back-up officer available, and announce yourself and your reason for entering before doing so",C:"Wait outside indefinitely without ever entering to check on the inmate's condition at all",D:"Immediately restrain the inmate before saying anything"},
correct:"B",
explanation:"The curriculum specifically instructs officers to never approach an inmate experiencing psychosis alone - a back-up officer must be present - and to announce themselves and explain their actions before entering, since psychosis can make a person act erratically and an unexpected touch could escalate the situation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO326-009",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Psychosis - Do Not",difficulty:"applied",type:"scenario",
stem:"An inmate experiencing psychosis insists there are other people in their otherwise empty cell. What should the officer avoid doing?",
choices:{A:"Trying to convince the inmate they are wrong, since what they perceive is reality to them and arguing will only cause more distress",B:"Contacting mental health staff immediately, before attempting any direct conversation with the inmate at all",C:"Speaking slowly and clearly, using short sentences so the inmate can process what is being said",D:"Explaining their actions before approaching, so the inmate is never startled by movement"},
correct:"A",
explanation:"The curriculum specifically warns against trying to change an inmate's mind during a psychotic episode - since what they perceive is their reality, arguing will only push them away and cause more distress, rather than resolving the situation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO326-010",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Mania",difficulty:"foundational",type:"recall",
stem:"Which of the following is a common symptom of a manic episode?",
choices:{A:"Excessive sleeping with little activity throughout the observed period",B:"Being overly talkative at a very fast pace, with excessive movements and little need for sleep",C:"Complete social withdrawal and silence from any conversation",D:"Loss of appetite with no other symptoms"},
correct:"B",
explanation:"Mania is typically characterized by extreme hyperactivity, staying awake for days with little need for sleep, being overly talkative and fast-paced, and having excessive movements such as pacing or fidgeting.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO326-011",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Panic Attacks",difficulty:"applied",type:"scenario",
stem:"An inmate tells an officer they cannot breathe and feel like they are dying. What should the officer do first?",
choices:{A:"Assume it is a panic attack and use breathing techniques without seeking any further medical evaluation or assessment",B:"Ensure the inmate receives proper medical attention as soon as possible, since only a medical professional can distinguish a panic attack from a cardiac condition with similar symptoms",C:"Ignore the complaint since panic attacks are never fatal and do not require any medical attention at all, regardless of the symptoms being described",D:"Tell the inmate to calm down and walk away, since most breathing complaints resolve entirely on their own without any evaluation"},
correct:"B",
explanation:"Because panic attacks and cardiac conditions share similar symptoms, only a medical professional can determine which is occurring - if an inmate says they cannot breathe or feel they are dying, the officer must ensure they receive proper medical attention as soon as possible.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO326-012",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Use of Force and Mental Illness",difficulty:"higher",type:"scenario",
stem:"During a violent incident involving an inmate with a known mental illness, what does the curriculum say about the use of chemical agents, ECDs, and other less lethal weapons?",
choices:{A:"They should be used first, before any attempt at de-escalation, whenever mental illness is even suspected, since de-escalation is considered unreliable with this population",B:"They should generally be avoided unless de-escalation attempts have failed and it is reasonably necessary to prevent an inmate from taking control of a unit, taking a hostage, or escaping, or to stop an ongoing assault",C:"They can never be used on any inmate with a mental illness, even to stop an ongoing deadly assault, prevent an escape in progress, or protect another inmate",D:"They may be used freely without restriction on any inmate once a violent incident has merely begun, regardless of mental illness, de-escalation, or the level of resistance shown at any point"},
correct:"B",
explanation:"The curriculum instructs officers to avoid using less lethal weapons on a person with mental illness unless de-escalation attempts have been unsuccessful and it is reasonably necessary to prevent specific serious outcomes, or to stop an active assault when other methods are ineffective.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO326-013",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Baker Act",difficulty:"higher",type:"recall",
stem:"Who may transport an inmate to a receiving facility for involuntary examination under the Baker Act?",
choices:{A:"Any correctional officer, regardless of training",B:"Only a law enforcement officer",C:"Any facility medical staff member",D:"The inmate may transport themselves with supervision"},
correct:"B",
explanation:"The curriculum specifically states that only a law enforcement officer may take an inmate to a receiving facility for involuntary examination under the Baker Act - a correctional officer alone is not authorized to perform this transport.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 3 (Unit 1)",sourceType:"textbook"},

{id:"CO326-014",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Substance Withdrawal",difficulty:"applied",type:"scenario",
stem:"An inmate is experiencing seizures, tremors, and extreme paranoia several days after intake. How should this be treated?",
choices:{A:"As routine behavior that requires no special response from staff at all",B:"As a medical emergency, requiring immediate notification of the supervisor and medical staff per agency policy",C:"As a disciplinary infraction requiring immediate confinement of the inmate",D:"As a sign of malingering to avoid work assignments"},
correct:"B",
explanation:"These are specifically listed as indicators of substance withdrawal, and the curriculum instructs officers to always treat withdrawal symptoms as a medical emergency, immediately notifying the supervisor and medical staff per agency policy.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 4 (Unit 1)",sourceType:"textbook"},

{id:"CO326-015",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Marchman Act",difficulty:"higher",type:"recall",
stem:"What does the Marchman Act specifically authorize?",
choices:{A:"Mandatory life sentences for repeat drug offenders convicted of a third qualifying felony involving any controlled substance whatsoever",B:"Law enforcement officers to take a person into protective custody, without consent, when there is reasonable belief the person's ability to make rational decisions is diminished due to substance abuse",C:"Automatic release of any inmate who requests substance abuse treatment, regardless of remaining sentence length or the severity of the underlying offense committed",D:"Correctional officers to prescribe medication for withdrawal symptoms without a physician's order or any medical supervision whatsoever"},
correct:"B",
explanation:"The Marchman Act grants law enforcement officers authority to take a person into protective custody, without consent, when there is reasonable belief the person's ability to make rational decisions is diminished due to substance abuse, providing access to emergency services and temporary protective custody.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 4 (Unit 1)",sourceType:"statute"},

{id:"CO326-016",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Autism Spectrum Disorder",difficulty:"applied",type:"scenario",
stem:"An inmate with autism spectrum disorder (ASD) avoids eye contact during a conversation with an officer. What is the correct interpretation?",
choices:{A:"This should be interpreted as clear evidence the inmate is being deceptive",B:"Lack of eye contact should not be interpreted as evidence of deception, since it is a common characteristic of ASD",C:"This behavior should result in an automatic disciplinary referral without further review",D:"This means the inmate cannot be housed with other inmates"},
correct:"B",
explanation:"The curriculum specifically warns officers not to interpret a lack of eye contact from a person with ASD as evidence of deception, since limited eye contact is a common characteristic of the condition rather than a sign of dishonesty.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 5 (Unit 1)",sourceType:"textbook"},

{id:"CO326-017",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"ASD Stimming",difficulty:"applied",type:"scenario",
stem:"An inmate with ASD is rocking back and forth and flapping their hands while otherwise calm and not causing harm. What is the recommended response?",
choices:{A:"Immediately order the inmate to stop the behavior without further assessment",B:"Allow the safe coping mechanism or stimming behavior, since it is not causing harm to the inmate or others",C:"Physically restrain the inmate to stop the movement right away",D:"Refer the inmate for immediate disciplinary action"},
correct:"B",
explanation:"The curriculum specifically recommends allowing safe coping mechanisms and stimming behaviors, such as hand flapping or rocking, unless they are causing harm to the inmate or others - these are self-regulating behaviors, not rule violations.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 5 (Unit 1)",sourceType:"textbook"},

{id:"CO326-018",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"ASD Legal Right",difficulty:"higher",type:"recall",
stem:"Under the Florida Statutes, what right does an inmate with autism spectrum disorder have regarding interviews?",
choices:{A:"No special rights apply to interviews involving inmates with ASD beyond those given to any other general population inmate at the facility overall",B:"Upon request by the inmate or their parent/guardian, the inmate has the right to have a mental health or related professional present at interviews, whether they are a victim or suspect",C:"The inmate may refuse to be interviewed under any circumstance, whether a victim, witness, or suspect, with no exception permitted",D:"Only a judge may authorize any interview of an inmate with ASD, even for routine administrative or medical matters entirely"},
correct:"B",
explanation:"Florida Statutes give an inmate with ASD the right, upon their request or that of a parent/guardian, to have a mental health or other related professional present during interviews, whether the inmate is a victim or a suspect - officers must make a good-faith effort to accommodate this.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 5 (Unit 1), citing Fla. Stat.",sourceType:"statute"},

{id:"CO326-019",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Intellectual Disability Communication",difficulty:"applied",type:"scenario",
stem:"An officer is unsure whether an inmate with an intellectual disability truly understood an instruction, even though the inmate said 'yes.' What is a recommended technique?",
choices:{A:"Assume understanding and move on",B:"Ask the inmate to repeat back what they heard to confirm understanding",C:"Speak more loudly to ensure comprehension",D:"Use more complex vocabulary to clarify the point"},
correct:"B",
explanation:"The curriculum recommends asking the person to repeat what they have heard to confirm they have truly understood the message, since an inmate with an intellectual disability may give the impression of comprehension without actually understanding.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 5 (Unit 1)",sourceType:"textbook"},

{id:"CO326-020",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Health-Care Appliances",difficulty:"applied",type:"scenario",
stem:"An inmate with a mobility impairment has a properly obtained wheelchair. Under what circumstance may an officer confiscate it?",
choices:{A:"Never, under any circumstances, even with a documented safety concern from medical staff",B:"Only when there are documented and legitimate safety or security concerns, following agency policy for supervisor and medical authorization",C:"Any time an officer personally decides it is inconvenient to have the wheelchair present in the housing unit",D:"Automatically after every use, for storage, regardless of the inmate's ongoing needs"},
correct:"B",
explanation:"The curriculum specifically states that a properly obtained health-care appliance should not be confiscated unless there are documented and legitimate safety or security concerns, following agency policy for contacting a supervisor and medical staff for authorization.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 6 (Unit 1)",sourceType:"textbook"},

{id:"CO326-021",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Personal Care Attendant",difficulty:"higher",type:"scenario",
stem:"An inmate is assigned as a personal care attendant to assist a disabled inmate. What is the personal care attendant NOT responsible for or permitted to access?",
choices:{A:"Pushing a wheelchair for an inmate with a mobility impairment during transport",B:"Changing linens in a housing unit as part of routine sanitation duties",C:"Medical devices such as needles, medications, or surgical instruments, or health-care records",D:"Providing feeding assistance to an inmate who cannot eat unassisted"},
correct:"C",
explanation:"A personal care attendant assists with daily tasks like pushing a wheelchair, changing linens, and feeding, but is specifically not responsible for or given access to medical devices such as needles, medications, surgical instruments, or health-care records.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 6 (Unit 1)",sourceType:"textbook"},

{id:"CO326-022",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Pregnancy Restraints",difficulty:"higher",type:"scenario",
stem:"An inmate is in active labor. According to the curriculum, what restraint policy applies?",
choices:{A:"Standard restraint procedures apply with no exception",B:"Restraints cannot be used on inmates during labor, delivery, or postpartum recovery",C:"Only handcuffs may be used, but not leg restraints",D:"Restraints are required at all times regardless of medical status"},
correct:"B",
explanation:"The curriculum is explicit that restraints cannot be used on inmates during labor, delivery, or postpartum recovery, reflecting both medical safety concerns and legal restrictions on restraining pregnant inmates in these circumstances.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 7 (Unit 1)",sourceType:"textbook"},

{id:"CO326-023",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Third-Trimester Restraints",difficulty:"higher",type:"scenario",
stem:"An inmate in her third trimester of pregnancy requires restraints due to being an extraordinary flight risk. How should wrist restraints be applied?",
choices:{A:"Behind the back, as with any other inmate",B:"In the front, due to the possibility of falls",C:"Wrist restraints are never used on pregnant inmates under any circumstance",D:"Only ankle restraints are used, never wrist restraints"},
correct:"B",
explanation:"Due to the possibility of falls, wrist restraints for pregnant inmates must be applied in the front rather than behind the back - and leg, ankle, and waist restraints generally may not be used in the third trimester except in extraordinary circumstances, applied in the least restrictive manner with documentation.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 7 (Unit 1)",sourceType:"textbook"},

{id:"CO326-024",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Terminal Illness Definition",difficulty:"foundational",type:"recall",
stem:"Most facilities define an inmate as terminally ill if they:",
choices:{A:"Have any chronic condition regardless of prognosis",B:"Are known to have a fatal disease and have less than six months to live",C:"Have been incarcerated for more than 20 years",D:"Require any form of ongoing medication"},
correct:"B",
explanation:"Most facilities specifically define terminal illness as a known fatal disease with a life expectancy of less than six months - these inmates face increased risk of suicide due to anger and depression and require increased security checks and supportive counseling.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 7 (Unit 1)",sourceType:"textbook"},

{id:"CO326-025",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Chemical Agents and Medical Conditions",difficulty:"higher",type:"scenario",
stem:"An inmate with a pacemaker becomes combative and requires the use of force. Which specific consideration is relevant to the choice of force option?",
choices:{A:"Pacemakers have no bearing on use-of-force decisions under the curriculum's guidance whatsoever",B:"An electronic control device (ECD) may aggravate a medical condition involving a pacemaker, which is a listed factor to consider",C:"Only chemical agents are safe to use on inmates with any pacemaker",D:"Use of force is automatically prohibited for any inmate with any medical device"},
correct:"B",
explanation:"A pacemaker is specifically listed among the medical conditions and devices that may be aggravated by the use of an ECD, which is a relevant safety consideration - though not an automatic prohibition - when determining the appropriate use-of-force response.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 7 (Unit 1)",sourceType:"textbook"},

{id:"CO326-026",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Juvenile Detention Limits",difficulty:"higher",type:"recall",
stem:"Under the federal Juvenile Justice and Delinquency Prevention Act, how long may juveniles generally be detained in an adult jail before release or transfer to a juvenile placement?",
choices:{A:"Up to 6 hours, with limited exceptions",B:"Up to 72 hours",C:"Up to 30 days",D:"There is no time limit"},
correct:"A",
explanation:"The federal Juvenile Justice and Delinquency Prevention Act generally limits detention of juveniles in adult jails to up to 6 hours before release or transport to an appropriate juvenile placement, with additional exceptions possible under certain specific criteria.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 8 (Unit 1), citing federal law",sourceType:"statute"},

{id:"CO326-027",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Juvenile Sight/Sound Separation",difficulty:"higher",type:"scenario",
stem:"A juvenile is temporarily held in an adult jail under a permitted exception. What is required regarding contact with adult inmates?",
choices:{A:"The juvenile may share a dining hall with adult inmates as long as an officer is present at all times",B:"The juvenile must have no sight or sound contact with adult inmates - no shared cells, dining halls, recreation areas, or other common spaces",C:"Sight contact is permitted but sound contact is strictly prohibited between the two groups",D:"There are no restrictions as long as the juvenile is restrained"},
correct:"B",
explanation:"When adult jails hold juveniles under permitted exceptions, federal law requires that the juveniles have no sight or sound contact with adult inmates - they cannot be housed together, share dining or recreation areas, or have any visual or verbal contact with adults.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 8 (Unit 1)",sourceType:"statute"},

{id:"CO326-028",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Juvenile Supervision Checks",difficulty:"foundational",type:"recall",
stem:"According to the Florida Statutes, how frequently must documented physical checks of juveniles be conducted at a receiving facility?",
choices:{A:"At intervals of no more than 10 minutes",B:"Once per shift",C:"Once every hour",D:"Only when requested by the juvenile"},
correct:"A",
explanation:"Florida Statutes require physical observation and documented checks of juveniles by facility supervisory staff at intervals of no more than 10 minutes, reflecting the heightened supervision required for this vulnerable population.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 8 (Unit 1), citing Fla. Stat.",sourceType:"statute"},

{id:"CO326-029",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Youthful Offender Definition",difficulty:"foundational",type:"recall",
stem:"What is a 'youthful offender' under Florida law?",
choices:{A:"Any person under 18 charged with a felony, regardless of how the court ultimately sentences that person",B:"Any person under 25 that the court has sentenced as an adult and classified as a youthful offender, or who the Department of Corrections assigns that status",C:"Any first-time offender regardless of age, so long as the current charge is non-violent and no prior record exists at all",D:"A term used only for inmates on probation who have not been sentenced to any period of incarceration at all"},
correct:"B",
explanation:"A youthful offender is any person under 25 sentenced as an adult and classified as a youthful offender by the court, or who the Florida Department of Corrections may also assign that status for housing and programming purposes.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 8 (Unit 1)",sourceType:"textbook"},

{id:"CO326-030",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Elderly Inmate Definition",difficulty:"foundational",type:"recall",
stem:"In a correctional setting, at what age is a person generally considered elderly?",
choices:{A:"40 years and older",B:"50 years and older",C:"65 years and older",D:"75 years and older"},
correct:"B",
explanation:"The curriculum specifically defines people 50 years of age and older as elderly in a correctional setting - a lower threshold than the general population, reflecting the accelerated aging effects often seen among incarcerated individuals.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 9 (Unit 1)",sourceType:"textbook"},

{id:"CO326-031",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Sundown Syndrome",difficulty:"applied",type:"scenario",
stem:"An elderly inmate with Alzheimer's disease becomes increasingly active, disoriented, and demanding after dinner hours, but is calmer earlier in the day. This pattern is known as:",
choices:{A:"Hypervigilance",B:"Sundown syndrome (sundowning)",C:"Mania",D:"Withdrawal"},
correct:"B",
explanation:"Sundown syndrome, or 'sundowning,' is a condition in which people with Alzheimer's become more active, disoriented, or agitated after dark - most notable after dinner hours or sundown - and inmates experiencing it may need redirection with guidance from medical staff.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 9 (Unit 1)",sourceType:"textbook"},

{id:"CO326-032",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Elderly Physical Limitations",difficulty:"applied",type:"scenario",
stem:"An officer orders an elderly inmate with a knee prosthesis to get into a prone position for a search. The inmate struggles to comply. What is the most likely explanation and appropriate response?",
choices:{A:"The inmate is being deliberately non-compliant and should be disciplined immediately, regardless of any documented medical condition on file",B:"The prosthesis may restrict the inmate's ability to kneel or get into a prone position, so standard physical directions may need to be adjusted for this physical limitation",C:"All elderly inmates should be exempt from all searches, regardless of any documented individual limitation",D:"The officer should use maximum force to compel compliance, since a search order must always be obeyed immediately"},
correct:"B",
explanation:"The curriculum specifically gives this example - a prosthesis restricting knee movement, making it impossible to kneel before assuming a prone position - as a case where standard physical control measures may not work for an elderly inmate with genuine physical limitations, not defiance.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 9 (Unit 1)",sourceType:"textbook"},

{id:"CO326-033",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Female Inmate Characteristics",difficulty:"foundational",type:"recall",
stem:"According to the curriculum, most female inmates are incarcerated for which type of offenses?",
choices:{A:"Primarily violent felonies committed against another inmate or staff member",B:"Primarily non-violent offenses, including drug-related charges, solicitation, property crimes, and economic crimes",C:"Exclusively federal offenses referred by an outside agency",D:"Primarily offenses committed against correctional staff"},
correct:"B",
explanation:"The curriculum notes that most female inmates are incarcerated for non-violent offenses such as drug-related charges, solicitation, property crimes, and economic crimes like forgery and fraud, though they have overall higher rates of disciplinary infractions than male inmates.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 10 (Unit 1)",sourceType:"textbook"},

{id:"CO326-034",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Trauma-Informed Search Communication",difficulty:"applied",type:"scenario",
stem:"Before conducting a cell search, the curriculum recommends which trauma-informed communication approach, particularly relevant given many female inmates' history of trauma?",
choices:{A:"Enter and search without any verbal notice to avoid alarming the inmate unnecessarily",B:"Use a verbal cue such as telling the inmate, \"Now, I will enter your cell for a search,\" before beginning",C:"Only communicate through written notices, never verbally, before entering",D:"Skip explanations entirely to save time"},
correct:"B",
explanation:"The curriculum specifically recommends using verbal cues before beginning a procedure - such as telling an inmate you are about to enter their cell for a search - as part of a trauma-informed communication approach, particularly relevant given higher rates of trauma history among female inmates.",
source:"Florida Basic Recruit Training Program: Corrections, Vol. 1, Ch. 8, Lesson 10 (Unit 1)",sourceType:"textbook"},

{id:"CO326-035",subject:"CJK 0326",subjectName:"Supervising Correctional Populations",subtopic:"Menstrual Health Products",difficulty:"foundational",type:"recall",
stem:"Under the Florida Statutes, what is required regarding health-care products for menstruation?",
